  // ---------- TRANSACTIONS ----------
  function renderTransactions(){
    const allGroups = state.groups||[];
    const catsForGroup = () => state.categories.filter(c => txFilter.groupIds.size===0 || txFilter.groupIds.has(c.groupId));
    const availableCats = catsForGroup();
    [...txFilter.categoryIds].forEach(cid=>{ if(!availableCats.some(c=>c.id===cid)) txFilter.categoryIds.delete(cid); });
    const subsForFilter = () => {
      const cats = txFilter.categoryIds.size>0 ? availableCats.filter(c=>txFilter.categoryIds.has(c.id)) : availableCats;
      const subs = [];
      cats.forEach(c=> (c.subcategories||[]).forEach(s=> subs.push({...s, catName:c.name})));
      return subs;
    };
    const availableSubs = subsForFilter();
    [...txFilter.subcategoryIds].forEach(sid=>{ if(!availableSubs.some(s=>s.id===sid)) txFilter.subcategoryIds.delete(sid); });

    let list = txForPeriod(txFilter.period);
    if(txFilter.groupIds.size>0) list = list.filter(t=>{ const c=catById(t.categoryId); return c && txFilter.groupIds.has(c.groupId); });
    if(txFilter.categoryIds.size>0) list = list.filter(t=>txFilter.categoryIds.has(t.categoryId));
    if(txFilter.subcategoryIds.size>0) list = list.filter(t=>txFilter.subcategoryIds.has(t.subcategoryId));
    if(txFilter.accountIds.size>0) list = list.filter(t=> t.type==='transfer' ? (txFilter.accountIds.has(t.fromAccountId) || txFilter.accountIds.has(t.toAccountId)) : txFilter.accountIds.has(t.accountId));
    if(txFilter.search.trim()) {
      const q = txFilter.search.toLowerCase();
      list = list.filter(t=>t.desc.toLowerCase().includes(q));
    }
    if(txFilter.tags.size>0) list = list.filter(t=> (t.tags||[]).some(tg=>txFilter.tags.has(tg)));
    list = [...list].sort((a,b)=> b.date.localeCompare(a.date));
    const filteredTotal = list.reduce((s,t)=> t.type==='income' ? s+t.amount : t.type==='expense' ? s+t.amount : s, 0);

    const cardBulkBarHtml = state.accounts.some(a=>a.type==='Crédito') ? `
          <div class="bulk-action-bar">
            <span>Transformar em despesa de cartão de crédito</span>
            <select id="bulkCardTarget" class="filter">${state.accounts.filter(a=>a.type==='Crédito').map(a=>`<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('')}</select>
            <span>fatura:</span>
            <input type="month" id="bulkCardFaturaTarget" value="${String(currentYear)}-${String(currentMonth+1).padStart(2,'0')}">
            <button class="btn btn-primary btn-small" id="bulkToCardBtn">Aplicar</button>
          </div>` : '';
    const groupMsel = multiSelectHtml('groupFilter', 'Todos os grupos', allGroups.map(g=>({value:g.id, label:g.name, icon:categoryBadgeHtml(g.icon, g.color, '📁')})), txFilter.groupIds);
    const catMsel = multiSelectHtml('catFilter', 'Todas categorias', availableCats.map(c=>({value:c.id, label:c.name, icon:categoryBadgeHtml(c.icon, c.color, '💰')})), txFilter.categoryIds);
    const subMsel = multiSelectHtml('subFilter', 'Todas subcategorias', availableSubs.map(s=>({value:s.id, label:s.name+(s.catName?' — '+s.catName:'')})), txFilter.subcategoryIds);
    const accMsel = multiSelectHtml('accFilter', 'Todas contas', state.accounts.map(a=>({value:a.id, label:a.name})), txFilter.accountIds);
    const tagMsel = multiSelectHtml('tagFilter', 'Todas tags', allTagsList().map(tg=>({value:tg, label:'#'+tg})), txFilter.tags);

    mainEl.innerHTML = `
      <div id="rumo-header">
        <div><h1>Transações</h1><div class="subtitle">${escapeHtml(txPeriodSubtitle(txFilter.period))}</div></div>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          ${periodModeToggleHtml(txFilter.period.mode)}
          ${txFilter.period.mode==='month' ? monthSwitchHtml() : ''}
          ${txFilter.period.mode==='year' ? periodYearMonthsHtml(txFilter.period) : ''}
          ${txFilter.period.mode==='custom' ? periodCustomRangeHtml(txFilter.period) : ''}
          <div class="type-toggle" id="txViewToggle" style="width:auto;">
            <button type="button" data-view="list" class="${txViewMode==='list'?'active income':''}">Lista</button>
            <button type="button" data-view="hierarchy" class="${txViewMode==='hierarchy'?'active income':''}">Hierarquia</button>
          </div>
          ${txViewMode==='list' ? `<button type="button" class="btn btn-ghost btn-small" id="txSelectModeBtn">${txSelectMode?'✕ Cancelar seleção':'☑️ Selecionar'}</button>` : ''}
          <button class="btn btn-primary new-tx-btn" id="addTxBtn">+ Nova transação</button>
        </div>
      </div>
      <div class="card">
        <div class="toolbar">
          <div class="toolbar-left">
            <input type="text" class="search" id="searchBox" placeholder="Buscar descrição..." value="${txFilter.search}">
            ${groupMsel}
            ${catMsel}
            ${subMsel}
            ${accMsel}
            ${tagMsel}
          </div>
          <div class="subtitle">${list.length} lançamento(s)</div>
        </div>
        <div class="filtered-total-row">
          <span>Total da seleção</span>
          <span class="mono" style="color:${filteredTotal>=0?'var(--forest)':'var(--rust)'}">${fmt(filteredTotal)}</span>
        </div>
        ${txSelectMode && txSelection.size>0 ? `
          <div class="bulk-action-bar">
            <span>${txSelection.size} selecionada(s)</span>
            <select id="bulkMoveTarget" class="filter">${state.accounts.map(a=>`<option value="${a.id}">${escapeHtml(a.name)} (${a.type})</option>`).join('')}</select>
            <button class="btn btn-primary btn-small" id="bulkMoveBtn">Mover para essa conta</button>
            <button class="btn btn-ghost btn-small" id="bulkClearBtn">Limpar seleção</button>
          </div>
          ${cardBulkBarHtml}` : ''}
        ${txViewMode==='list'
          ? `<div class="ledger">${list.map(t=> txSelectMode
              ? `<label class="tx-select-row"><input type="checkbox" class="tx-select-cb" data-id="${t.id}" ${txSelection.has(t.id)?'checked':''}>${rowHtml(t)}</label>`
              : rowHtml(t)
            ).join('') || `<div class="empty-state"><div class="display">Nada encontrado</div>Tente ajustar os filtros ou o mês.</div>`}</div>`
          : renderExpenseHierarchy(list)}
      </div>
    `;
    bindPeriodControls();
    document.getElementById('addTxBtn').onclick = ()=> openTxModal();
    document.getElementById('searchBox').oninput = (e)=>{ txFilter.search = e.target.value; renderTransactions(); };
    bindMultiSelect('groupFilter', txFilter.groupIds, ()=>{ txFilter.categoryIds.clear(); txFilter.subcategoryIds.clear(); renderTransactions(); });
    bindMultiSelect('catFilter', txFilter.categoryIds, ()=>{ txFilter.subcategoryIds.clear(); renderTransactions(); });
    bindMultiSelect('subFilter', txFilter.subcategoryIds, ()=> renderTransactions());
    bindMultiSelect('accFilter', txFilter.accountIds, ()=> renderTransactions());
    bindMultiSelect('tagFilter', txFilter.tags, ()=> renderTransactions());
    const selModeBtn = document.getElementById('txSelectModeBtn');
    if(selModeBtn) selModeBtn.onclick = ()=>{ txSelectMode = !txSelectMode; if(!txSelectMode) txSelection.clear(); renderTransactions(); };
    mainEl.querySelectorAll('.tx-select-cb').forEach(cb=>{
      cb.onclick = (e)=> e.stopPropagation();
      cb.onchange = ()=>{
        if(cb.checked) txSelection.add(cb.dataset.id); else txSelection.delete(cb.dataset.id);
        renderTransactions();
      };
    });
    const bulkBtn = document.getElementById('bulkMoveBtn');
    if(bulkBtn) bulkBtn.onclick = async ()=>{
      const targetId = document.getElementById('bulkMoveTarget').value;
      if(!targetId) return;
      let count = 0;
      state.transactions.forEach(t=>{
        if(!txSelection.has(t.id)) return;
        if(t.type==='transfer') return; // transferências não têm "a conta", tem origem/destino — pula
        t.accountId = targetId;
        count++;
      });
      await saveState();
      txSelection.clear();
      alert(`${count} lançamento(s) movido(s).`);
      renderTransactions();
    };
    const bulkClearBtn = document.getElementById('bulkClearBtn');
    if(bulkClearBtn) bulkClearBtn.onclick = ()=>{ txSelection.clear(); renderTransactions(); };
    const bulkToCardBtn = document.getElementById('bulkToCardBtn');
    if(bulkToCardBtn) bulkToCardBtn.onclick = async ()=>{
      const cardId = document.getElementById('bulkCardTarget').value;
      const monthVal = document.getElementById('bulkCardFaturaTarget').value; // "AAAA-MM"
      if(!cardId || !monthVal) return;
      const card = accById(cardId);
      if(!card) return;
      const [ty, tm] = monthVal.split('-').map(Number); // tm é 1-indexado
      const dueDay = card.dueDay || card.closingDay || 1;
      const lastDay = new Date(ty, tm, 0).getDate();
      const newDate = `${ty}-${String(tm).padStart(2,'0')}-${String(Math.min(dueDay,lastDay)).padStart(2,'0')}`;
      let count = 0, skipped = 0;
      state.transactions.forEach(t=>{
        if(!txSelection.has(t.id)) return;
        if(t.type!=='expense'){ skipped++; return; }
        // Guarda a data original da compra (se ainda não vier de outro cartão) antes de virar despesa de fatura.
        if(!t.purchaseDate) t.purchaseDate = t.date;
        t.accountId = cardId;
        t.date = newDate;
        t.paid = false;
        count++;
      });
      await saveState();
      txSelection.clear();
      alert(`${count} despesa(s) transformada(s) em despesa de cartão (${escapeHtml(card.name)}), alocada(s) na fatura selecionada.${skipped?` ${skipped} selecionada(s) ignorada(s) por não serem despesas.`:''}`);
      renderTransactions();
    };
    document.querySelectorAll('#txViewToggle button').forEach(btn=>{
      btn.onclick = ()=>{ txViewMode = btn.dataset.view; renderTransactions(); };
    });
    if(txViewMode==='list'){
      bindLedgerRowActions();
    } else {
      bindHierarchyEvents();
    }
  }

  // Monta a árvore Grupo > Categoria > Subcategoria com o valor de cada nível,
  // a partir das despesas já filtradas (mês + filtros ativos).
  function buildExpenseHierarchy(list){
    const tree = {};
    list.filter(t=>t.type==='expense').forEach(t=>{
      if(t.subcategoryId && disabledSubcats.has(t.subcategoryId)) return;
      const cat = catById(t.categoryId);
      const groupId = cat ? (cat.groupId || '__none__') : '__none__';
      const group = groupId!=='__none__' ? groupById(groupId) : null;
      tree[groupId] = tree[groupId] || { group, total: 0, cats: {} };
      tree[groupId].total += (-t.amount);
      const catId = t.categoryId || '__none__';
      tree[groupId].cats[catId] = tree[groupId].cats[catId] || { cat, total: 0, subs: {} };
      tree[groupId].cats[catId].total += (-t.amount);
      const subId = t.subcategoryId || '__none__';
      const subName = subId==='__none__' ? 'Sem subcategoria' : (((cat&&cat.subcategories)||[]).find(s=>s.id===subId)||{}).name || 'Subcategoria removida';
      tree[groupId].cats[catId].subs[subId] = tree[groupId].cats[catId].subs[subId] || { name: subName, total: 0 };
      tree[groupId].cats[catId].subs[subId].total += (-t.amount);
    });
    return tree;
  }

  function renderExpenseHierarchy(list){
    const tree = buildExpenseHierarchy(list);
    const groupEntries = Object.entries(tree).sort((a,b)=>b[1].total-a[1].total);
    if(groupEntries.length===0) return `<div class="empty-state"><div class="display">Nenhuma despesa encontrada</div>Tente ajustar os filtros ou o mês.</div>`;
    const grandTotal = groupEntries.reduce((s,[,g])=>s+g.total,0);

    const rows = groupEntries.map(([groupId, g])=>{
      const gKey = 'g:'+groupId;
      const gCollapsed = hierarchyCollapsed.has(gKey);
      const gColor = g.group ? g.group.color : '#6E6E6E';
      const catEntries = Object.entries(g.cats).sort((a,b)=>b[1].total-a[1].total);

      const catRowsHtml = catEntries.map(([catId, cEntry])=>{
        const cKey = 'c:'+groupId+':'+catId;
        const cCollapsed = hierarchyCollapsed.has(cKey);
        const cColor = cEntry.cat ? cEntry.cat.color : gColor;
        const subEntries = Object.entries(cEntry.subs).sort((a,b)=>b[1].total-a[1].total);
        const hasRealSubs = subEntries.length>0 && !(subEntries.length===1 && subEntries[0][0]==='__none__');

        const subChipsHtml = subEntries.map(([subId, sEntry])=>{
          const toggleable = subId!=='__none__';
          const isOff = toggleable && disabledSubcats.has(subId);
          const style = isOff ? '' : `background:${cColor}1F; border-color:${cColor}80; color:${cColor};`;
          return `<button type="button" class="subcat-chip ${isOff?'off':''}" ${toggleable?`data-subcat-toggle="${subId}"`:'style="cursor:default;"'} style="${style}">${escapeHtml(sEntry.name)} <span class="mono">${fmt(sEntry.total)}</span></button>`;
        }).join('');

        return `<div class="hier-row hier-cat">
          <div class="hier-row-main ${hasRealSubs?'clickable':''}" ${hasRealSubs?`data-hier-toggle="${cKey}"`:''}>
            <span class="hier-label">${hasRealSubs?`<span class="hier-chev ${cCollapsed?'':'open'}">›</span>`:'<span class="hier-chev-spacer"></span>'}${categoryBadgeHtml(cEntry.cat?cEntry.cat.icon:null, cEntry.cat?cEntry.cat.color:'#999', '💰')}${cEntry.cat?escapeHtml(cEntry.cat.name):'Sem categoria'}</span>
            <span class="hier-value mono">${fmt(cEntry.total)}</span>
          </div>
          ${hasRealSubs && !cCollapsed ? `<div class="subcat-chips" style="margin-left:39px;">${subChipsHtml}</div>` : ''}
        </div>`;
      }).join('');

      return `<div class="hier-row hier-group">
        <div class="hier-row-main clickable" data-hier-toggle="${gKey}">
          <span class="hier-label"><span class="hier-chev ${gCollapsed?'':'open'}">›</span>${categoryBadgeHtml(g.group?g.group.icon:null, g.group?g.group.color:'#999', '📁')}${g.group?escapeHtml(g.group.name):'Sem grupo'}</span>
          <span class="hier-value mono">${fmt(g.total)}</span>
        </div>
        ${!gCollapsed ? `<div class="hier-children">${catRowsHtml}</div>` : ''}
      </div>`;
    }).join('');

    return `
      <div class="hier-total-row">
        <span>Total das despesas filtradas</span>
        <span class="mono">${fmt(grandTotal)}</span>
      </div>
      <div class="hier-tree">${rows}</div>
    `;
  }

  function bindHierarchyEvents(){
    mainEl.querySelectorAll('[data-hier-toggle]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        const key = el.dataset.hierToggle;
        if(hierarchyCollapsed.has(key)) hierarchyCollapsed.delete(key); else hierarchyCollapsed.add(key);
        renderTransactions();
      };
    });
    mainEl.querySelectorAll('[data-subcat-toggle]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        const sid = el.dataset.subcatToggle;
        if(disabledSubcats.has(sid)) disabledSubcats.delete(sid); else disabledSubcats.add(sid);
        renderTransactions();
      };
    });
  }

  // ---------- ANÁLISE (gasto diário por grupo/categoria/subcategoria) ----------
  function renderAnalysis(){
    if(!state.groupDailyGoals) state.groupDailyGoals = {};
    const groups = (state.groups||[]).filter(g=>g.type==='expense');
    const catsForGroup = () => state.categories.filter(c=>c.type==='expense' && (analysisFilter.groupIds.size===0 || analysisFilter.groupIds.has(c.groupId)));
    const availableCats = catsForGroup();
    // Tira da seleção qualquer categoria que não exista mais nos grupos escolhidos.
    [...analysisFilter.categoryIds].forEach(cid=>{ if(!availableCats.some(c=>c.id===cid)) analysisFilter.categoryIds.delete(cid); });
    const subsForCat = () => {
      const cats = analysisFilter.categoryIds.size>0 ? availableCats.filter(c=>analysisFilter.categoryIds.has(c.id)) : availableCats;
      const subs = [];
      cats.forEach(c=> (c.subcategories||[]).forEach(s=> subs.push({...s, catName:c.name})));
      return subs;
    };
    const availableSubs = subsForCat();
    [...analysisFilter.subcategoryIds].forEach(sid=>{ if(!availableSubs.some(s=>s.id===sid)) analysisFilter.subcategoryIds.delete(sid); });

    const selectedAccounts = [...analysisFilter.accountIds].map(id=>accById(id)).filter(Boolean);
    const isSingleCardAccount = selectedAccounts.length===1 && selectedAccounts[0].type==='Crédito';
    // Faturas disponíveis: só faz sentido oferecer quando exatamente 1 cartão está escolhido.
    const faturaDates = isSingleCardAccount
      ? [...new Set(state.transactions.filter(t=>t.type==='expense' && t.accountId===selectedAccounts[0].id).map(t=>t.date))].sort()
      : [];
    if(!isSingleCardAccount) analysisFilter.faturaDate = 'all';
    else if(analysisFilter.faturaDate!=='all' && !faturaDates.includes(analysisFilter.faturaDate)) analysisFilter.faturaDate = 'all';

    const groupMsel = multiSelectHtml('an-group', 'Todos os grupos', groups.map(g=>({value:g.id, label:g.name, icon:categoryBadgeHtml(g.icon, g.color, '📁')})), analysisFilter.groupIds);
    const catMsel = multiSelectHtml('an-cat', 'Todas categorias', availableCats.map(c=>({value:c.id, label:c.name, icon:categoryBadgeHtml(c.icon, c.color, '💰')})), analysisFilter.categoryIds);
    const subMsel = multiSelectHtml('an-sub', 'Todas subcategorias', availableSubs.map(s=>({value:s.id, label:s.name+(s.catName?' — '+s.catName:'')})), analysisFilter.subcategoryIds);
    const accMsel = multiSelectHtml('an-acc', 'Todas contas', state.accounts.map(a=>({value:a.id, label:a.name})), analysisFilter.accountIds);
    const faturaOptsHtml = `<option value="all">Todas faturas</option>` + faturaDates.map(d=>{
      const dObj = new Date(d+'T00:00:00');
      return `<option value="${d}" ${analysisFilter.faturaDate===d?'selected':''}>${dObj.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'})}</option>`;
    }).join('');

    // Transações que batem com os filtros, dentro do mês selecionado.
    const filteredTx = txForMonth(currentYear, currentMonth).filter(t=>{
      if(t.type!=='expense') return false;
      const cat = catById(t.categoryId);
      if(analysisFilter.groupIds.size>0 && (!cat || !analysisFilter.groupIds.has(cat.groupId))) return false;
      if(analysisFilter.categoryIds.size>0 && !analysisFilter.categoryIds.has(t.categoryId)) return false;
      if(analysisFilter.subcategoryIds.size>0 && !analysisFilter.subcategoryIds.has(t.subcategoryId)) return false;
      if(analysisFilter.accountIds.size>0 && !analysisFilter.accountIds.has(t.accountId)) return false;
      if(analysisFilter.faturaDate!=='all' && t.date!==analysisFilter.faturaDate) return false;
      return true;
    });

    const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
    const totals = new Array(daysInMonth+1).fill(0);
    filteredTx.forEach(t=>{
      const day = new Date((t.purchaseDate||t.date)+'T00:00:00').getDate();
      totals[day] = (totals[day]||0) + (-t.amount);
    });
    const totalSpent = filteredTx.reduce((s,t)=>s+(-t.amount),0);

    // Meta do que está filtrado agora (categoria tem prioridade sobre grupo;
    // sem filtro, soma a meta de todos os grupos). Categoria usa o limite em
    // R$ do Orçamentos; grupo usa o % da meta de receita, convertido em R$.
    const incomeGoalA = state.incomeGoal || 0;
    let filterGoalReais = 0;
    if(analysisFilter.categoryIds.size>0){
      analysisFilter.categoryIds.forEach(cid=>{ filterGoalReais += (state.budgets[cid]||0); });
    } else if(analysisFilter.groupIds.size>0){
      let pctSum = 0;
      analysisFilter.groupIds.forEach(gid=>{ pctSum += (state.groupBudgets[gid]||0); });
      filterGoalReais = incomeGoalA * (pctSum/100);
    } else {
      const totalPct = (state.groups||[]).filter(g=>g.type==='expense').reduce((s,g)=>s+(state.groupBudgets[g.id]||0),0);
      filterGoalReais = incomeGoalA * (totalPct/100);
    }
    const remainingBudget = filterGoalReais - totalSpent;
    const pctOfGoalConsumed = filterGoalReais>0 ? (totalSpent/filterGoalReais*100) : null;
    const daysWithSpend = totals.slice(1, daysInMonth+1).filter(v=>v>0).length;
    const avgPerActiveDay = daysWithSpend>0 ? totalSpent/daysWithSpend : 0;
    const avgWholeMonth = totalSpent/daysInMonth;
    // Dias já decorridos no mês selecionado (incluindo hoje, se for o mês
    // atual). Mês passado: conta todos os dias. Mês futuro: 0 (evita
    // divisão sem sentido).
    const todayForElapsed = new Date();
    const selMonthKey = currentYear*12 + currentMonth;
    const nowMonthKey = todayForElapsed.getFullYear()*12 + todayForElapsed.getMonth();
    const daysElapsed = selMonthKey < nowMonthKey ? daysInMonth : (selMonthKey === nowMonthKey ? todayForElapsed.getDate() : 0);
    // "Média até hoje" só considera o que já foi gasto até a data de hoje —
    // soma só os dias já decorridos do array "totals" (que é indexado por
    // dia), não o totalSpent do mês inteiro, que pode incluir lançamentos
    // futuros já cadastrados (ex.: parcela de cartão de um dia que ainda não
    // chegou). Ex.: gastou 200 até o dia 2 → média até hoje = 100.
    const totalSpentUntilToday = daysElapsed>0 ? totals.slice(1, daysElapsed+1).reduce((s,v)=>s+v,0) : 0;
    const avgPerElapsedDay = daysElapsed>0 ? totalSpentUntilToday/daysElapsed : 0;
    let peakDay = 0, peakVal = 0;
    for(let d=1; d<=daysInMonth; d++){ if(totals[d]>peakVal){ peakVal = totals[d]; peakDay = d; } }

    // Meta diária de acompanhamento: calculada AUTOMATICAMENTE a partir da
    // meta mensal do que está filtrado agora (filterGoalReais, que já usa a
    // mesma prioridade categoria > grupo > soma geral) dividida pelos dias
    // do mês — assim ela acompanha o filtro: meta do grupo Alimentação
    // (3539) vira ~114/dia; filtrando pra categoria Rest. Gourmet (800)
    // dentro dele, vira ~25,80/dia; sem filtro nenhum, usa a soma de todos
    // os grupos (o mês inteiro) — e assim por diante pra qualquer recorte.
    // Em qualquer um desses três casos (grupo, categoria(s) de 1 só grupo,
    // ou nenhum filtro) dá pra sobrescrever esse valor manualmente — o campo
    // de edição já vem preenchido com o valor automático como ponto de
    // partida, guardado em state.groupDailyGoals por escopo (id do grupo,
    // ou a chave especial '__all__' pro "sem filtro"). Uma vez sobrescrito,
    // o valor manual tem prioridade sobre o automático até ser apagado.
    // Compara com a média do mês: vermelho se a média está acima da meta,
    // verde se está abaixo/igual.
    let dailyGoalScopeId = null;
    if(analysisFilter.categoryIds.size===0 && analysisFilter.groupIds.size===1){
      dailyGoalScopeId = [...analysisFilter.groupIds][0];
    } else if(analysisFilter.groupIds.size===0 && analysisFilter.categoryIds.size>0){
      const catGroupIds = new Set([...analysisFilter.categoryIds].map(cid=>(catById(cid)||{}).groupId));
      if(catGroupIds.size===1) dailyGoalScopeId = [...catGroupIds][0];
    } else if(analysisFilter.groupIds.size===0 && analysisFilter.categoryIds.size===0 && analysisFilter.subcategoryIds.size===0 && analysisFilter.accountIds.size===0 && analysisFilter.faturaDate==='all'){
      dailyGoalScopeId = '__all__';
    }
    const manualDailyGoal = dailyGoalScopeId ? (state.groupDailyGoals[dailyGoalScopeId] || 0) : 0;
    const autoDailyGoal = (filterGoalReais>0 && daysInMonth>0) ? (filterGoalReais/daysInMonth) : 0;
    const dailyGoalValue = manualDailyGoal>0 ? manualDailyGoal : autoDailyGoal;
    const dailyGoalIsAuto = !(manualDailyGoal>0) && autoDailyGoal>0;
    const dailyGoalEditRawValue = manualDailyGoal>0 ? manualDailyGoal : (autoDailyGoal>0 ? Math.round(autoDailyGoal*100)/100 : '');
    const dailyGoalOver = dailyGoalValue>0 && avgPerElapsedDay>dailyGoalValue;
    // Mantido por compatibilidade com o resto do código, que ainda usa esse
    // nome pra achar o grupo do filtro (ícone, nome no calendário etc.) —
    // '__all__' não é um grupo de verdade, então não conta aqui.
    const dailyGoalGroupId = (dailyGoalScopeId && dailyGoalScopeId!=='__all__') ? dailyGoalScopeId : null;


    // Ritmo do período filtrado, no mesmo padrão do cartão de grupo da Home:
    // usa a meta diária quando definida, senão projeta o gasto pro mês
    // inteiro contra a meta em R$. Quando está acima da meta diária, calcula
    // quantos dias a mais com gasto zero trariam a média de volta pra dentro
    // da meta.
    let paceOverA=null, paceLabelA='', paceMsgA='';
    let daysToZeroA = null, daysToZeroImpossibleA = false;
    if(dailyGoalValue>0){
      paceOverA = dailyGoalOver;
      paceLabelA = dailyGoalOver ? 'Acima do ritmo' : 'Abaixo do ritmo';
      paceMsgA = `${fmt(Math.abs(dailyGoalValue-avgPerElapsedDay))} ${dailyGoalOver?'acima':'abaixo'} da meta diária`;
      if(dailyGoalOver && daysElapsed>0){
        const neededExtraDaysA = Math.ceil((totalSpentUntilToday/dailyGoalValue) - daysElapsed);
        if(neededExtraDaysA > 0){
          const remainingDaysA = Math.max(0, daysInMonth - daysElapsed);
          daysToZeroA = neededExtraDaysA;
          daysToZeroImpossibleA = neededExtraDaysA > remainingDaysA;
        }
      }
    } else if(filterGoalReais>0 && daysElapsed>0){
      const projectedA = avgPerElapsedDay*daysInMonth;
      paceOverA = projectedA>filterGoalReais;
      paceLabelA = paceOverA ? 'Acima do ritmo' : 'Abaixo do ritmo';
      paceMsgA = paceOverA ? 'No ritmo atual, vai passar da meta' : 'Você está no caminho certo!';
    }

    // Resumo compacto pro card de Ritmo: mesma informação (quanto a média
    // está fora da meta, dias pra recuperar, % consumido e o que sobra ou
    // já estourou) numa linha só, pra ocupar bem menos espaço.
    let ritmoCompactA = '';
    if(dailyGoalValue>0 && daysElapsed>0){
      const diffDailyA = Math.abs(dailyGoalValue-avgPerElapsedDay);
      const partsA = [`${fmt(diffDailyA)} ${dailyGoalOver?'acima':'abaixo'} da meta${dailyGoalIsAuto?' automática':''}`];
      if(dailyGoalOver && daysToZeroA){
        partsA.push(daysToZeroImpossibleA ? 'não dá mais pra recuperar este mês' : `${daysToZeroA} dia${daysToZeroA>1?'s':''} p/ recuperar`);
      }
      ritmoCompactA = partsA.join(' · ');
    } else if(paceMsgA){
      ritmoCompactA = paceMsgA;
    }
    if(filterGoalReais>0){
      const scopeLabelA = dailyGoalGroupId ? ' deste grupo' : (analysisFilter.categoryIds.size===1 ? ' desta categoria' : '');
      ritmoCompactA += (ritmoCompactA?' · ':'') + `${pctOfGoalConsumed.toFixed(0)}% consumido${scopeLabelA}` + (remainingBudget>=0 ? ` · restam ${fmt(remainingBudget)}` : ` · estourou ${fmt(Math.abs(remainingBudget))}`);
    }

    // Quanto ainda pode ser gasto HOJE sem comprometer a meta diária
    // AUTOMÁTICA (autoDailyGoal — sempre a automática, mesmo que o campo
    // "Meta diária" acima esteja usando um valor manual sobrescrito).
    // Compara o total gasto até hoje (totalSpentUntilToday, que já inclui
    // o que foi gasto hoje) com o que a meta automática permitiria ter
    // acumulado até agora (autoDailyGoal × dias decorridos). A diferença é
    // o quanto ainda cabe gastar hoje sem tirar o dia seguinte da mesma
    // média automática; se já foi ultrapassada, mostra o quanto passou.
    let availableTodayA = null;
    if(autoDailyGoal>0 && daysElapsed>0){
      availableTodayA = (autoDailyGoal*daysElapsed) - totalSpentUntilToday;
    }

    // Ícone/título do resumo: usa o selo do grupo/categoria quando o filtro
    // aponta pra um só, senão um selo neutro representando "todas as despesas".
    let summaryIconHtml;
    if(dailyGoalGroupId){
      const gIco = groupById(dailyGoalGroupId);
      summaryIconHtml = categoryBadgeHtml(gIco?gIco.icon:null, gIco?gIco.color:'#999', '📁');
    } else if(analysisFilter.categoryIds.size===1){
      const cIco = catById([...analysisFilter.categoryIds][0]);
      summaryIconHtml = categoryBadgeHtml(cIco?cIco.icon:null, cIco?cIco.color:'#999', '💰');
    } else {
      summaryIconHtml = categoryBadgeHtml(null, 'var(--slate-mute)', '📊');
    }
    const elapsedFracA = daysInMonth>0 ? Math.min(1, daysElapsed/daysInMonth) : 0;
    const dotsA = Array.from({length:10},(_,i)=> `<span class="gbc-dot ${i < Math.round(elapsedFracA*10) ? 'filled':''}"></span>`).join('');

    // No calendário, quando existe uma meta diária (automática ou manual)
    // pro filtro atual, ela vira a referência de cor por dia — verde se o
    // dia ficou abaixo da meta, vermelho se acima — em vez da média do mês.
    const calendarGoalValue = dailyGoalValue>0 ? dailyGoalValue : null;

    function analysisFilterSummary(){
      if(analysisFilter.subcategoryIds.size>0){
        const names = [...analysisFilter.subcategoryIds].map(id=>{
          for(const c of state.categories){ const s=(c.subcategories||[]).find(x=>x.id===id); if(s) return s.name; }
          return null;
        }).filter(Boolean);
        return names.join(', ') || 'Todas as despesas';
      }
      if(analysisFilter.categoryIds.size>0){
        return [...analysisFilter.categoryIds].map(id=>(catById(id)||{}).name).filter(Boolean).join(', ') || 'Todas as despesas';
      }
      if(analysisFilter.groupIds.size>0){
        return [...analysisFilter.groupIds].map(id=>(groupById(id)||{}).name).filter(Boolean).join(', ') || 'Todas as despesas';
      }
      return 'Todas as despesas';
    }
    const chartColor = analysisFilter.categoryIds.size===1 ? (catById([...analysisFilter.categoryIds][0])||{}).color
      : analysisFilter.groupIds.size===1 ? (groupById([...analysisFilter.groupIds][0])||{}).color
      : 'var(--brass)';
    const chartSvg = dailyChartSvg(totals, daysInMonth, chartColor||'var(--brass)', filterGoalReais, dailyGoalValue, daysElapsed);

    // Gráfico bridge: Meta do filtro atual descendo por categoria de
    // despesa (dentro do que está filtrado) até a coluna "Como estamos".
    const catTotalsBridgeA = {};
    filteredTx.forEach(t=>{
      const cid = t.categoryId;
      catTotalsBridgeA[cid] = (catTotalsBridgeA[cid]||0) + (-t.amount);
    });
    const catStepsBridgeA = Object.entries(catTotalsBridgeA)
      .map(([cid, val])=>({ name: (catById(cid)||{}).name || 'Sem categoria', value: val }))
      .filter(r=>r.value>0.01)
      .sort((a,b)=>b.value-a.value);
    const goalBridgeHtmlA = (filterGoalReais>0 || catStepsBridgeA.length>0) ? goalBridgeChartSvg(filterGoalReais, catStepsBridgeA) : '';

    const dayRows = [];
    for(let d=1; d<=daysInMonth; d++){
      if(totals[d]>0) dayRows.push({day:d, val:totals[d]});
    }
    const maxDayVal = Math.max(1, ...dayRows.map(r=>r.val));
    const txByDay = {};
    filteredTx.forEach(t=>{
      const day = new Date((t.purchaseDate||t.date)+'T00:00:00').getDate();
      (txByDay[day] = txByDay[day]||[]).push(t);
    });
    const dayRowsHtml = dayRows.map(r=>{
      const dateObj = new Date(currentYear, currentMonth, r.day);
      const weekday = dateObj.toLocaleDateString('pt-BR', {weekday:'short'});
      const items = (txByDay[r.day]||[]).sort((a,b)=>Math.abs(b.amount)-Math.abs(a.amount));
      const itemsHtml = items.map(t=>{
        const cat = catById(t.categoryId);
        const sub = cat && t.subcategoryId ? (cat.subcategories||[]).find(s=>s.id===t.subcategoryId) : null;
        return `<div class="day-tx-item">
          <span class="day-tx-desc">${escapeHtml(t.desc)}${sub?` <span class="day-tx-sub">— ${escapeHtml(sub.name)}</span>`:''}</span>
          <span class="day-tx-amount mono">${fmt(Math.abs(t.amount))}</span>
        </div>`;
      }).join('');
      return `<div class="bar-row">
        <div class="bar-head"><span class="name">Dia ${String(r.day).padStart(2,'0')}/${String(currentMonth+1).padStart(2,'0')} <span style="color:var(--slate-mute); font-weight:400;">(${weekday})</span></span><span class="mono">${fmt(r.val)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${(r.val/maxDayVal*100).toFixed(0)}%; background:${chartColor||'var(--brass)'}"></div></div>
        <div class="day-tx-list">${itemsHtml}</div>
      </div>`;
    }).join('') || `<div class="empty-state">Nenhuma despesa encontrada com esses filtros neste mês.</div>`;

    mainEl.innerHTML = `
      <div id="rumo-header">
        <div><h1>Análise</h1><div class="subtitle">Acompanhamento diário de gastos</div></div>
        ${monthSwitchHtml()}
      </div>
      <div class="card" style="margin-bottom:16px;">
        <div class="card-title">Filtros</div>
        <div class="card-sub">Escolha grupo, categoria, subcategoria, conta e/ou fatura — os filtros se combinam</div>
        <div class="toolbar-left" style="margin-top:4px;">
          ${groupMsel}
          ${catMsel}
          ${subMsel}
          ${accMsel}
          ${isSingleCardAccount ? `<select class="filter" id="an-fatura">${faturaOptsHtml}</select>` : ''}
        </div>
      </div>
      <div class="card" style="margin-bottom:16px;">
        <div class="card-title">Resumo do período</div>
        <div class="card-sub">${escapeHtml(analysisFilterSummary())} · ${filteredTx.length} lançamento(s)</div>

        <div class="an-hero-grid">
          <div class="an-hero-card tone-danger">
            <div class="an-hero-label">Total gasto</div>
            <div class="an-hero-value mono">${fmt(totalSpent)}</div>
            <div class="an-hero-sub">${filteredTx.length} lançamento(s)</div>
          </div>
          <div class="an-hero-card ${filterGoalReais>0 ? (remainingBudget<0?'tone-danger':'tone-success') : ''}">
            <div class="an-hero-label">Meta − Restante</div>
            <div class="an-hero-value mono">${filterGoalReais>0 ? fmt(remainingBudget) : '—'}</div>
            <div class="an-hero-sub">${filterGoalReais>0 ? `Meta: ${fmt(filterGoalReais)}` : 'Sem meta definida'}</div>
          </div>
          <div class="an-hero-card ${pctOfGoalConsumed===null ? '' : pctOfGoalConsumed>100?'tone-danger':'tone-success'}">
            <div class="an-hero-label">% da meta consumida</div>
            <div class="an-hero-value mono">${pctOfGoalConsumed===null?'—':pctOfGoalConsumed.toFixed(0)+'%'}</div>
            ${pctOfGoalConsumed!==null ? `<div class="an-hero-mini-track"><div class="an-hero-mini-fill" style="width:${Math.min(100,pctOfGoalConsumed)}%; background:${pctOfGoalConsumed>100?'var(--rust)':'var(--forest)'};"></div></div>` : `<div class="an-hero-sub">Defina a meta na aba Dashboard</div>`}
          </div>
          ${paceOverA!==null ? `<div class="an-hero-card ${paceOverA?'tone-danger':'tone-success'}">
            <div class="an-hero-label">Ritmo</div>
            <div class="an-hero-value">${paceLabelA}</div>
            <div class="an-hero-sub">${paceMsgA}</div>
          </div>` : ''}
        </div>

        <div class="group-budget-card an-summary-card" style="padding-top:14px;">
          <div class="gbc-header">
            <div class="gbc-header-left">
              <div class="gbc-icon-wrap">${summaryIconHtml}</div>
              <div>
                <div class="gbc-title">${escapeHtml(analysisFilterSummary())}</div>
                <div class="gbc-subtitle">${filteredTx.length} lançamento(s) no período</div>
              </div>
            </div>
            <div class="gbc-header-right">
              <div class="gbc-amount mono">${fmt(totalSpent)}</div>
              ${filterGoalReais>0 ? `<div class="gbc-target">de ${fmt(filterGoalReais)}</div>` : ''}
            </div>
          </div>
          ${filterGoalReais>0 ? `
          <div class="gbc-bar-wrap">
            <div class="gbc-bar-top">
              <span class="gbc-bar-pct" style="color:${pctOfGoalConsumed>100?'var(--rust)':'var(--forest)'};">${Math.min(999,pctOfGoalConsumed).toFixed(0)}% utilizado</span>
            </div>
            <div class="gbc-bar-track">
              <div class="gbc-bar-fill" style="width:${Math.min(100,pctOfGoalConsumed)}%; background:${pctOfGoalConsumed>100?'var(--rust)':'var(--forest)'};"></div>
              <div class="gbc-bar-bubble" style="left:${Math.min(92,Math.max(8,pctOfGoalConsumed))}%; color:${pctOfGoalConsumed>100?'var(--rust)':'var(--forest)'};">${fmt(totalSpent)}</div>
            </div>
            <div class="gbc-bar-scale"><span>R$ 0</span><span>${fmt(filterGoalReais)}</span></div>
          </div>` : ''}
          <div class="gbc-stats">
            <div class="gbc-stat">
              <div class="gbc-stat-label">Média por dia (até hoje)</div>
              <div class="gbc-stat-value mono" style="color:${dailyGoalValue>0 ? (dailyGoalOver?'var(--rust)':'var(--forest)') : 'var(--ink)'};">${daysElapsed>0 ? fmt(avgPerElapsedDay) : '—'}</div>
            </div>
            <div class="gbc-stat">
              <div class="gbc-stat-label">Meta diária</div>
              ${dailyGoalScopeId
                ? statEditValueHtml('groupDailyGoal:'+dailyGoalScopeId, manualDailyGoal>0 ? fmt(manualDailyGoal) : (autoDailyGoal>0 ? fmt(autoDailyGoal) : 'Definir'), dailyGoalEditRawValue, autoDailyGoal>0?fmt(autoDailyGoal):'0,00', !manualDailyGoal && autoDailyGoal===0)
                : (dailyGoalValue>0 ? `<div class="gbc-stat-value mono">${fmt(dailyGoalValue)}</div>` : `<div class="gbc-stat-sub">Sem meta definida pra calcular</div>`)}
              ${dailyGoalIsAuto ? `<div class="gbc-stat-sub">Calculada automaticamente (meta ÷ ${daysInMonth} dias) · toque pra ajustar</div>` : (dailyGoalScopeId && manualDailyGoal>0 ? `<div class="gbc-stat-sub">Definida manualmente${dailyGoalScopeId==='__all__'?'':' pro grupo'}</div>` : '')}
            </div>
            <div class="gbc-stat">
              <div class="gbc-stat-label">Dia do mês</div>
              <div class="gbc-stat-value">${daysElapsed} de ${daysInMonth}</div>
              <div class="gbc-dots-row">${dotsA}</div>
            </div>
            ${paceOverA!==null ? `<div class="gbc-stat" style="grid-column: 1 / -1;">
              <div class="gbc-stat-label">Ritmo</div>
              <div class="gbc-pace-badge ${paceOverA?'over':'under'}">${paceLabelA}</div>
              <div class="gbc-stat-sub" style="margin-top:4px;">${ritmoCompactA}</div>
              ${availableTodayA!==null ? `<div class="gbc-stat-sub" style="margin-top:6px; color:${availableTodayA>=0?'var(--forest)':'var(--rust)'}; font-weight:600;">${availableTodayA>=0 ? `Pode gastar até ${fmt(availableTodayA)} hoje sem sair dos ${fmt(autoDailyGoal)}/dia da meta automática` : `Já passou ${fmt(Math.abs(availableTodayA))} da meta automática de ${fmt(autoDailyGoal)}/dia`}</div>` : ''}
            </div>` : ''}
            <div class="gbc-stat">
              <div class="gbc-stat-label">Média do mês inteiro</div>
              <div class="gbc-stat-value mono">${fmt(avgWholeMonth)}</div>
              <div class="gbc-stat-sub">Considerando os ${daysInMonth} dias</div>
            </div>
          </div>
        </div>
      </div>
      <div class="card" style="margin-bottom:16px;">
        <div class="card-title">Calendário — ${MONTHS[currentMonth]}</div>
        <div class="card-sub">${escapeHtml(analysisFilterSummary())} · dias em destaque gastaram acima da ${calendarGoalValue ? 'meta' : 'média'}</div>
        ${renderMonthCalendar(totals, daysInMonth, currentYear, currentMonth, avgWholeMonth, calendarGoalValue)}
        <div class="cal-avg-row">
          <span>Média diária do mês inteiro (com os filtros acima)</span>
          <span class="mono">${fmt(avgWholeMonth)}</span>
        </div>
      </div>
      <div class="card" style="margin-bottom:16px;">
        <div class="card-title">Gasto por dia — ${MONTHS[currentMonth]}</div>
        <div class="card-sub">${escapeHtml(analysisFilterSummary())}</div>
        <div style="display:flex; flex-wrap:wrap; gap:14px; margin:10px 0 4px; font-size:11.5px; color:var(--slate-mute);">
          <span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${chartColor||'var(--brass)'};margin-right:5px;"></span>Gasto do dia</span>
          <span><span style="display:inline-block;width:9px;height:2.5px;background:var(--amber);margin-right:5px;vertical-align:middle;"></span>Acumulado no mês</span>
          ${filterGoalReais>0 ? `<span><span style="display:inline-block;width:9px;height:2.5px;background:var(--brass-light);margin-right:5px;vertical-align:middle;"></span>Ritmo da meta (linear)</span>` : ''}
          ${filterGoalReais>0 ? `<span><span style="display:inline-block;width:9px;height:2.5px;background:var(--rust);margin-right:5px;vertical-align:middle;border-top:1px dashed var(--rust);"></span>Meta mensal</span>` : ''}
          ${dailyGoalValue>0 ? `<span><span style="display:inline-block;width:9px;height:2.5px;background:var(--forest);margin-right:5px;vertical-align:middle;"></span>Meta diária</span>` : ''}
        </div>
        ${chartSvg}
      </div>
      <div class="card" style="margin-bottom:16px;">
        <div class="card-title">Meta × Categorias — como estamos</div>
        <div class="card-sub">${escapeHtml(analysisFilterSummary())} · da meta do filtro atual, quanto cada categoria consumiu, até sobrar ou faltar no final</div>
        ${goalBridgeHtmlA || `<div class="empty-state">Sem meta definida e sem despesas neste recorte pra montar o gráfico.</div>`}
      </div>
      <div class="card">
        <div class="card-title">Detalhe por dia</div>
        <div class="card-sub">Só os dias com gasto registrado</div>
        <div class="ledger">${dayRowsHtml}</div>
      </div>
    `;
    bindMonthSwitch();
    bindMultiSelect('an-group', analysisFilter.groupIds, ()=>{ analysisFilter.categoryIds.clear(); analysisFilter.subcategoryIds.clear(); renderAnalysis(); });
    bindMultiSelect('an-cat', analysisFilter.categoryIds, ()=>{ analysisFilter.subcategoryIds.clear(); renderAnalysis(); });
    bindMultiSelect('an-sub', analysisFilter.subcategoryIds, ()=> renderAnalysis());
    bindMultiSelect('an-acc', analysisFilter.accountIds, ()=>{ analysisFilter.faturaDate='all'; renderAnalysis(); });
    const anFaturaSel = document.getElementById('an-fatura');
    if(anFaturaSel) anFaturaSel.onchange = (e)=>{
      analysisFilter.faturaDate = e.target.value;
      if(e.target.value!=='all'){
        const d = new Date(e.target.value+'T00:00:00');
        currentYear = d.getFullYear();
        currentMonth = d.getMonth();
      }
      renderAnalysis();
    };
    bindMiniTags(async (field, rawValue)=>{
      const val = parseFloat((rawValue||'').replace(',','.')) || 0;
      if(field.startsWith('groupDailyGoal:')){
        if(!state.groupDailyGoals) state.groupDailyGoals = {};
        state.groupDailyGoals[field.slice(15)] = val;
      }
      await saveState();
      renderAnalysis();
    });
  }

  // Monta a grade do calendário do mês, com o valor gasto em cada dia (já
  // considerando os filtros ativos) e um destaque nos dias acima da média.
  function renderMonthCalendar(totals, daysInMonth, year, month, avgValue, goalValueOverride){
    const weekDayLabels = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    const firstDow = new Date(year, month, 1).getDay();
    const maxVal = Math.max(1, ...totals.slice(1, daysInMonth+1));
    const todayStr = new Date().toISOString().slice(0,10);
    let cells = '';
    for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell cal-empty"></div>`;
    for(let d=1; d<=daysInMonth; d++){
      const val = totals[d]||0;
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isToday = dateStr===todayStr;
      const aboveAvg = goalValueOverride>0 ? val>goalValueOverride : (avgValue>0 && val>avgValue);
      const intensity = val>0 ? Math.min(1, val/maxVal) : 0;
      const style = val>0 ? `--cal-alpha:${(0.06+intensity*0.22).toFixed(2)};` : '';
      cells += `<div class="cal-cell ${val>0?'has-spend':''} ${isToday?'is-today':''} ${aboveAvg?'above-avg':''}" style="${style}">
        <span class="cal-day-num">${d}</span>
        ${val>0 ? `<span class="cal-day-val mono">${val.toLocaleString('pt-BR',{maximumFractionDigits:0})}</span>` : (dateStr<=todayStr ? `<span class="cal-day-val mono">0</span>` : '')}
      </div>`;
    }
    const totalCells = firstDow + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for(let i=0;i<trailing;i++) cells += `<div class="cal-cell cal-empty"></div>`;

    return `
      <div class="cal-weekdays">${weekDayLabels.map(w=>`<div>${w}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    `;
  }

  // Gráfico combinado: barras com o gasto de cada dia + linha do acumulado
  // do mês, linha do "ritmo da meta" (projeção linear da meta mensal dia a
  // dia) e linhas de referência para meta mensal (tracejada) e meta diária.
  // As linhas de meta só aparecem quando o valor correspondente existe.
  // Anel circular de progresso — versão moderna do "quanto já usei da
  // receita" no lugar da barra reta, com status colorido (verde/âmbar/
  // vermelho) igual ao resto do app.
  // Anel pequeno pra usar inline numa linha (ex: cartão de reembolsos do
  // mês) — igual ao budgetRingSvg, só que compacto e sem número no centro.
  function miniRingSvg(pct, color){
    const cx=22, cy=22, r=17, sw=5;
    const circumference = 2*Math.PI*r;
    const clamped = Math.min(100, Math.max(0, pct||0));
    const dash = (circumference*clamped/100).toFixed(2);
    return `<svg viewBox="0 0 44 44" style="width:44px; height:44px; display:block; flex:none;">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}"></circle>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${dash} ${circumference.toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"></circle>
    </svg>`;
  }
  // Uma linha com anel circular + rótulo + valor — usada no card de
  // reembolsos do mês (Painel), no lugar dos cartõezinhos em grade.
  function reimbRingRowHtml(label, value, pct, color){
    return `<div style="display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:0.5px solid var(--line);">
      ${miniRingSvg(pct, color)}
      <div style="flex:1; min-width:0;">
        <div style="font-size:13px; color:var(--slate-mute);">${label}</div>
        <div class="mono" style="font-size:16px; font-weight:700; color:${color};">${fmt(value)}</div>
      </div>
      <div class="mono" style="font-size:13px; color:var(--slate-mute); flex:none;">${pct.toFixed(0)}%</div>
    </div>`;
  }

  // Anel maior, com % no centro — usado nos dois círculos (saída/entrada)
  // do card de reembolsos do mês.
  function ringWithPctSvg(pct, color, size){
    const cx=50, cy=50, r=40, sw=10;
    const circumference = 2*Math.PI*r;
    const clamped = Math.min(100, Math.max(0, pct||0));
    const dash = (circumference*clamped/100).toFixed(2);
    return `<div style="position:relative; width:${size}px; height:${size}px; flex:none;">
      <svg viewBox="0 0 100 100" style="width:100%; height:100%; display:block;">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}"></circle>
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${dash} ${circumference.toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"></circle>
      </svg>
      <div class="mono" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:${Math.round(size*0.2)}px; font-weight:700; color:${color};">${clamped.toFixed(0)}%</div>
    </div>`;
  }
  function reimbCircleHtml(label, value, pct, color){
    return `<div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
      ${ringWithPctSvg(pct, color, 76)}
      <div style="font-size:13px; color:var(--slate-mute); text-align:center;">${label}</div>
      <div class="mono" style="font-size:17px; font-weight:700; color:${color};">${fmt(value)}</div>
    </div>`;
  }

  // Ícone de grupo centralizado numa rosca (usado no resumo do "Despesas
  // por grupo") — mesmo mapeamento de ícones das categorias, colorido com
  // a cor do grupo, sem o fundo colorido do selo normal (a cor já vem da
  // própria rosca ao redor).
  function ringCenterIconSvg(cx, cy, size, icon, color, fallbackEmoji){
    const path = CATEGORY_ICON_PATHS[icon];
    if(path){
      const half = size/2;
      return `<svg x="${(cx-half).toFixed(2)}" y="${(cy-half).toFixed(2)}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:${color};">${path}</svg>`;
    }
    return `<text x="${cx.toFixed(2)}" y="${(cy+size*0.32).toFixed(2)}" font-size="${(size*0.9).toFixed(1)}" text-anchor="middle">${escapeHtml(icon||fallbackEmoji||'📁')}</text>`;
  }

  // Rosca dupla do resumo "Despesas por grupo" (fica embaixo da rosca de
  // alocação, uma por grupo, numa linha só): anel externo compara a meta
  // mensal do grupo com o total consumido — verde se ainda dentro, vermelho
  // se estourou. Anel interno (só quando existe meta diária automática ou
  // manual) compara essa meta com a média já gasta até hoje — verde se a
  // meta ainda for maior que a média, vermelho se a média já passou dela.
  // Ícone do grupo no centro. Sem meta diária, mostra só o anel externo,
  // um pouco maior pra preencher o espaço.
  function groupDualRingSvg(g, monthlyVal, monthlyGoal, dailyAvg, dailyGoal){
    const cx=50, cy=50, sw=8;
    const hasDaily = dailyGoal!=null && dailyGoal>0;
    const outerR = hasDaily ? 42 : 40;
    const outerOver = monthlyVal>monthlyGoal;
    const outerColor = outerOver ? 'var(--rust)' : 'var(--forest)';
    const outerPct = monthlyGoal>0 ? Math.min(100, monthlyVal/monthlyGoal*100) : 0;
    const circOuter = 2*Math.PI*outerR;
    const dashOuter = (circOuter*outerPct/100).toFixed(2);
    let svg = `<circle cx="${cx}" cy="${cy}" r="${outerR}" fill="none" stroke="var(--line)" stroke-width="${sw}"></circle>`;
    svg += `<circle cx="${cx}" cy="${cy}" r="${outerR}" fill="none" stroke="${outerColor}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${dashOuter} ${circOuter.toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
    let iconSize = 32;
    if(hasDaily){
      const innerR = 26;
      const innerOver = dailyAvg>dailyGoal;
      const innerColor = innerOver ? 'var(--rust)' : 'var(--forest)';
      const innerPct = Math.min(100, dailyGoal>0 ? (dailyAvg/dailyGoal*100) : 0);
      const circInner = 2*Math.PI*innerR;
      const dashInner = (circInner*innerPct/100).toFixed(2);
      svg += `<circle cx="${cx}" cy="${cy}" r="${innerR}" fill="none" stroke="var(--line)" stroke-width="${sw}"></circle>`;
      svg += `<circle cx="${cx}" cy="${cy}" r="${innerR}" fill="none" stroke="${innerColor}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${dashInner} ${circInner.toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
      iconSize = 24;
    }
    svg += ringCenterIconSvg(cx, cy, iconSize, g.icon, g.color, '📁');

    const numFmt = v => fmt(v).replace('R$ ', '');
    const labelsHtml = (hasDaily ? `
      <div class="mono group-ring-val">${numFmt(dailyAvg)}</div>
      <div class="mono group-ring-goal" style="color:${dailyAvg>dailyGoal?'var(--rust)':'var(--forest)'};">${numFmt(dailyGoal)}</div>
    ` : '') + `
      <div class="mono group-ring-val" style="margin-top:${hasDaily?'4px':'0'};">${numFmt(monthlyVal)}</div>
      <div class="mono group-ring-goal" style="color:${outerColor};">${numFmt(monthlyGoal)}</div>
    `;
    return `<div class="group-ring-item" title="${escapeHtml(g.name)}">
      <div class="group-ring-svg-wrap"><svg viewBox="0 0 100 100">${svg}</svg></div>
      <div class="group-ring-labels">${labelsHtml}</div>
    </div>`;
  }

  function budgetRingSvg(pct, colorOverride){
    const cx=50, cy=50, r=40, sw=11;
    const circumference = 2*Math.PI*r;
    const trackSvg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}"></circle>`;
    if(pct===null){
      return `<div class="budget-ring-wrap"><svg viewBox="0 0 100 100" class="budget-ring-svg">${trackSvg}</svg><div class="budget-ring-center"><div class="budget-ring-pct" style="color:var(--slate-mute);">—</div></div></div>`;
    }
    const color = colorOverride || (pct>=100 ? 'var(--rust)' : pct>=75 ? 'var(--amber)' : 'var(--forest)');
    const clamped = Math.min(100, Math.max(0, pct));
    const dash = (circumference*clamped/100).toFixed(2);
    const arcSvg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${dash} ${circumference.toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
    return `<div class="budget-ring-wrap"><svg viewBox="0 0 100 100" class="budget-ring-svg">${trackSvg}${arcSvg}</svg><div class="budget-ring-center"><div class="budget-ring-pct mono" style="color:${color};">${pct.toFixed(0)}%</div></div></div>`;
  }

  function dailyChartSvg(totals, daysInMonth, color, monthlyGoal, dailyGoal, daysElapsed){
    const fmt0 = v => 'R$ ' + Math.round(v).toLocaleString('pt-BR');
    const barMax = Math.max(1, ...totals.slice(1, daysInMonth+1));
    const lastDay = daysElapsed>0 ? Math.min(daysElapsed, daysInMonth) : daysInMonth;

    const cumActual = [0];
    let run = 0;
    for(let d=1; d<=daysInMonth; d++){
      if(d<=lastDay){ run += (totals[d]||0); cumActual[d] = run; }
      else cumActual[d] = null;
    }
    const cumActualMax = Math.max(0, ...cumActual.slice(1).filter(v=>v!=null));
    const hasTarget = monthlyGoal>0;
    const cumTarget = [0];
    for(let d=1; d<=daysInMonth; d++) cumTarget[d] = hasTarget ? (monthlyGoal*d/daysInMonth) : null;

    const yMax = Math.max(barMax, cumActualMax, hasTarget?monthlyGoal:0, dailyGoal||0, 1) * 1.16;

    // Topo com mais espaço: a legenda "META MENSAL" fica numa faixa fixa,
    // separada da linha do acumulado — evita que se sobreponham quando o
    // acumulado encosta perto da meta no fim do mês (era o problema antes).
    const w = 720, h = 320, padL = 14, padR = 14, padT = 54, padB = 34;
    const chartW = w-padL-padR, chartH = h-padT-padB;
    const gap = chartW/daysInMonth;
    const barW = Math.max(2, gap*0.6);
    const yFor = v => padT + chartH - (v/yMax)*chartH;
    const xFor = d => padL + (d-1)*gap + gap/2;

    // Texto com um "halo" na cor de fundo do cartão atrás — continua legível
    // mesmo cruzando uma barra, linha ou outro rótulo.
    const haloText = (x, y, content, {size=14, weight=700, color='var(--ink)', anchor='middle'}={}) =>
      `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${size}" font-weight="${weight}" text-anchor="${anchor}" font-family="Inter, sans-serif" style="fill:${color}; paint-order:stroke; stroke:var(--paper-card); stroke-width:4px; stroke-linejoin:round;">${content}</text>`;

    let svg = '';

    // Linhas de referência de meta (atrás de tudo, sem rótulo grudado nelas)
    if(hasTarget){
      const gy = yFor(monthlyGoal);
      svg += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${w-padR}" y2="${gy.toFixed(1)}" stroke="var(--rust)" stroke-width="1.8" stroke-dasharray="5,4"></line>`;
    }
    if(dailyGoal>0){
      const gy2 = yFor(dailyGoal);
      svg += `<line x1="${padL}" y1="${gy2.toFixed(1)}" x2="${w-padR}" y2="${gy2.toFixed(1)}" stroke="var(--forest)" stroke-width="1.8" opacity="0.8"></line>`;
    }

    // Barras do gasto diário
    for(let d=1; d<=daysInMonth; d++){
      const val = totals[d]||0;
      const barH = val>0 ? Math.max(2, (val/yMax)*chartH) : 0;
      const x = padL + (d-1)*gap + (gap-barW)/2;
      const y = padT + chartH - barH;
      svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="2" fill="${val>0?color:'var(--line)'}"></rect>`;
    }

    // Linha do ritmo da meta (projeção linear da meta mensal)
    if(hasTarget){
      const pts = [];
      for(let d=1; d<=daysInMonth; d++) pts.push(`${xFor(d).toFixed(1)},${yFor(cumTarget[d]).toFixed(1)}`);
      svg += `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--brass-light)" stroke-width="2.6"></polyline>`;
    }

    // Linha do acumulado real do mês, com rótulos em alguns pontos — pula o
    // rótulo de intervalo (a cada 5 dias) quando fica muito perto do
    // primeiro ou do último dia (evita amontoar, ex.: "30" colado no "31"),
    // e empurra o rótulo pra baixo do ponto quando ele cai muito perto da
    // faixa fixa das legendas "META MENSAL"/"META DIÁRIA" no topo.
    {
      const pts = [];
      for(let d=1; d<=lastDay; d++) pts.push(`${xFor(d).toFixed(1)},${yFor(cumActual[d]).toFixed(1)}`);
      if(pts.length>1) svg += `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--amber)" stroke-width="3.2"></polyline>`;
      // Só finca o rótulo acima do ponto se houver uma folga confortável até
      // a faixa fixa das legendas no topo (que ocupa aprox. y 9–34); perto
      // demais disso, desce o rótulo pra baixo do ponto em vez de cima.
      const topLegendBuffer = 30;
      for(let d=1; d<=lastDay; d++){
        const cx = xFor(d), cy = yFor(cumActual[d]);
        svg += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="3.4" fill="var(--amber)"></circle>`;
        const isIntervalLabel = d%5===0 && Math.abs(d-lastDay)>2 && Math.abs(d-1)>2;
        if(d===1 || d===lastDay || isIntervalLabel){
          const anchor = d<=2 ? 'start' : (d>=daysInMonth-1 ? 'end' : 'middle');
          const labelAbove = cy > (padT + topLegendBuffer);
          const ly = labelAbove ? cy-11 : cy+20;
          svg += haloText(cx, ly, cumActual[d].toLocaleString('pt-BR',{maximumFractionDigits:0}), {size:15, weight:700, color:'var(--amber)', anchor});
        }
      }
    }

    // Legendas "META MENSAL"/"META DIÁRIA", numa faixa fixa no topo (uma em
    // cada canto) — não acompanham a altura das linhas, então nunca colidem
    // nem entre si nem com os rótulos do acumulado.
    if(hasTarget){
      svg += haloText(w-padR, 20, `META MENSAL ${fmt0(monthlyGoal)}`, {size:14, weight:700, color:'var(--rust)', anchor:'end'});
    }
    if(dailyGoal>0){
      svg += haloText(padL, 20, `META DIÁRIA ${fmt0(dailyGoal)}`, {size:14, weight:700, color:'var(--forest)', anchor:'start'});
    }

    // Eixo X
    for(let d=1; d<=daysInMonth; d++){
      if(d===1 || d%5===0 || d===daysInMonth){
        svg += `<text x="${xFor(d).toFixed(1)}" y="${h-8}" font-size="15" fill="var(--slate-mute)" text-anchor="middle" font-family="Inter, sans-serif">${d}</text>`;
      }
    }
    svg += `<line x1="${padL}" y1="${padT+chartH}" x2="${w-padR}" y2="${padT+chartH}" stroke="var(--line)" stroke-width="1"></line>`;

    return `<div style="max-width:640px; margin:0 auto;"><svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block;">${svg}</svg></div>`;
  }

  // ---------- DASHBOARD DE METAS (grupo, categoria, balanço mensal) ----------
  function farolFor(pct, over){
    if(over) return { emoji:'🔴', color:'var(--rust)' };
    if(pct>=75) return { emoji:'🟡', color:'var(--amber)' };
    return { emoji:'🟢', color:'var(--forest)' };
  }

  // Tag discreta: mostra um botãozinho compacto (ex: "Meta: 20%"); ao clicar,
  // vira um campo de texto ali mesmo, pra editar sem poluir a tela.
  function miniTagHtml(field, label, rawValue, placeholder, isEmpty){
    return `<span class="tag-edit-wrap">
      <button type="button" class="mini-tag ${isEmpty?'empty':''}" data-tag-show>${label}</button>
      <input type="text" inputmode="decimal" class="mini-tag-input" data-tag-field="${field}" value="${rawValue}" placeholder="${placeholder}" style="display:none;">
    </span>`;
  }
  // Mesma edição inline do miniTagHtml, mas com a aparência de um valor de
  // estatística normal (rótulo + valor em negrito) em vez do selo tracejado —
  // usado só no Painel, onde o valor precisa combinar com os outros números
  // ao redor dele (ex.: Meta diária dentro do cartão de grupo).
  function statEditValueHtml(field, displayValue, rawValue, placeholder, isEmpty){

  function bindMiniTags(onSave){
    mainEl.querySelectorAll('[data-tag-show]').forEach(btn=>{

  // Permite arrastar tabelas largas pros lados com o dedo/mouse. Usa pointer
  // events (funciona em touch e mouse) além do scroll nativo, porque dentro
  // do app web o scroll nativo por toque às vezes trava logo no início.
  function enableDragScroll(el){
    if(!el || el.dataset.dragScrollBound) return;
    el.dataset.dragScrollBound = '1';
    let isDown = false, startX = 0, startScroll = 0, moved = false;
    el.addEventListener('pointerdown', (e)=>{
      isDown = true; moved = false;
      startX = e.clientX; startScroll = el.scrollLeft;
      el.classList.add('is-dragging');
    });
    el.addEventListener('pointermove', (e)=>{
      if(!isDown) return;
      const dx = e.clientX - startX;
      if(Math.abs(dx)>3) moved = true;
      el.scrollLeft = startScroll - dx;
    });
    const stop = (e)=>{
      isDown = false;
      el.classList.remove('is-dragging');
    };
    el.addEventListener('pointerup', stop);
    el.addEventListener('pointerleave', stop);
    el.addEventListener('pointercancel', stop);
  }

  // ---------- BOWLER (visão anual, todos os grupos x 12 meses) ----------
  function renderBowler(){

    const reimbIdsBowler = reimbCategoryIds();
    for(let m=0; m<12; m++){
      txForMonth(year, m).filter(t=>t.type==='expense').forEach(t=>{
        if(isReimbTx(t, reimbIdsBowler)) return;
        const c = catById(t.categoryId);
        if(!c || !spentByGroupMonth[c.groupId]) return;
        spentByGroupMonth[c.groupId][m] += (-t.amount);

    const pctFor = (spent) => incomeGoal>0 ? (spent/incomeGoal*100) : 0;
    const cellClass = (realizedPct, goalPct) => {
      if(!goalPct) return 'bowler-neutral';
      return realizedPct>goalPct ? 'bowler-red' : 'bowler-green';
    };

    const rowsHtml = expenseGroups.map(g=>{
      const goalPct = state.groupBudgets[g.id] || 0;

        const realizedPct = pctFor(spent);
        return `<td class="bowler-cell ${cellClass(realizedPct, goalPct)}" title="${fmt(spent)}">${goalPct ? realizedPct.toFixed(0)+'%' : '—'}</td>`;
      }).join('');

    const totalGoalPct = expenseGroups.reduce((s,g)=>s+(state.groupBudgets[g.id]||0),0);
    const totalCellsHtml = [];
    for(let m=0;m<12;m++){
      const totalSpent = expenseGroups.reduce((s,g)=>s+spentByGroupMonth[g.id][m],0);
      const realizedPct = pctFor(totalSpent);
      totalCellsHtml.push(`<td class="bowler-cell bowler-total-cell ${cellClass(realizedPct, totalGoalPct)}" title="${fmt(totalSpent)}">${totalGoalPct ? realizedPct.toFixed(0)+'%' : '—'}</td>`);
    }

    // Transações da categoria "Reembolso" (despesa e a receita de volta) não
    // entram aqui — são dinheiro de passagem, não sobra real do mês.

    const expenseByMonthS = new Array(12).fill(0);

        if(isReimbTx(t, reimbIds)) return;

        else if(t.type==='expense') expenseByMonthS[m] += (-t.amount);

    const leftoverByMonthS = incomeByMonthS.map((inc,i)=> inc - expenseByMonthS[i]);
    const leftoverPctByMonthS = leftoverByMonthS.map((v,i)=> incomeByMonthS[i]>0 ? (v/incomeByMonthS[i]*100) : 0);
    const leftoverCellsHtml = leftoverByMonthS.map((v,i)=>{
      const hasData = incomeByMonthS[i]>0 || expenseByMonthS[i]>0;
      if(!hasData) return `<td class="bowler-cell bowler-neutral">—</td>`;
      const cls = v>=0 ? 'bowler-green' : 'bowler-red';

    const leftoverElapsedCount = year===new Date().getFullYear() ? (new Date().getMonth()+1) : (year<new Date().getFullYear() ? 12 : 0);

  // Regressão linear simples sobre os meses com dado real (>0), pra apontar
  // se o grupo está subindo, caindo ou estável ao longo do ano.
  function computeBowlerTrend(monthlyPct){
    const points = monthlyPct.map((v,i)=>({x:i,y:v})).filter(p=>p.y>0.01);
    if(points.length<2) return { label:'Dados insuficientes', icon:'➡️' };
    const n = points.length;
    const sumX = points.reduce((s,p)=>s+p.x,0);
    const sumY = points.reduce((s,p)=>s+p.y,0);
    const sumXY = points.reduce((s,p)=>s+p.x*p.y,0);
    const sumXX = points.reduce((s,p)=>s+p.x*p.x,0);
    const denom = (n*sumXX - sumX*sumX) || 1;
    const slope = (n*sumXY - sumX*sumY) / denom;
    if(Math.abs(slope)<0.6) return { label:'Estável', icon:'➡️' };
    return slope>0 ? { label:'Tendência de alta', icon:'📈' } : { label:'Tendência de queda', icon:'📉' };
  }

  // Igual ao computeBowlerTrend, mas pra séries em R$ (não %): usa um limiar
  // relativo à média da série, já que a escala de valores varia muito.
  function computeValueTrend(series){
    const points = series.map((v,i)=>({x:i,y:v})).filter(p=>p.y>0.01);
    if(points.length<2) return { label:'Dados insuficientes', icon:'➡️' };
    const n = points.length;
    const sumX = points.reduce((s,p)=>s+p.x,0);
    const sumY = points.reduce((s,p)=>s+p.y,0);
    const sumXY = points.reduce((s,p)=>s+p.x*p.y,0);
    const sumXX = points.reduce((s,p)=>s+p.x*p.x,0);
    const denom = (n*sumXX - sumX*sumX) || 1;
    const slope = (n*sumXY - sumX*sumY) / denom;
    const avgY = sumY/n;
    const relSlope = avgY>0 ? slope/avgY : 0;
    if(Math.abs(relSlope)<0.03) return { label:'Estável', icon:'➡️' };
    return slope>0 ? { label:'Tendência de alta', icon:'📈' } : { label:'Tendência de queda', icon:'📉' };
  }

  function bowlerTrendChartSvg(monthlyPct, goalPct, avgPct){
    const w=700, h=270, padL=36, padR=20, padT=36, padB=36;

    const maxVal = Math.max(goalPct*1.25, (avgPct||0)*1.25, ...monthlyPct, 10);
    const stepX = chartW/11;
    const yFor = (v) => padT + chartH - (Math.min(v,maxVal)/maxVal*chartH);
    const xFor = (i) => padL + i*stepX;
    const goalLine = goalPct>0 ? `<line x1="${padL}" y1="${yFor(goalPct).toFixed(1)}" x2="${w-padR}" y2="${yFor(goalPct).toFixed(1)}" stroke="var(--slate-mute)" stroke-dasharray="4,3" stroke-width="1"></line>
      <text x="${w-padR}" y="${(yFor(goalPct)-7).toFixed(1)}" font-size="14" font-weight="600" fill="var(--slate-mute)" text-anchor="end" font-family="Inter, sans-serif">meta ${goalPct.toFixed(0)}%</text>` : '';
    const avgLine = (avgPct>0.01) ? `<line x1="${padL}" y1="${yFor(avgPct).toFixed(1)}" x2="${w-padR}" y2="${yFor(avgPct).toFixed(1)}" stroke="var(--amber)" stroke-dasharray="4,3" stroke-width="1"></line>
      <text x="${padL}" y="${(yFor(avgPct)-7).toFixed(1)}" font-size="14" font-weight="600" fill="var(--amber)" text-anchor="start" font-family="Inter, sans-serif">média ${avgPct.toFixed(0)}%</text>` : '';

    const path = `<polyline points="${points}" fill="none" stroke="var(--brass)" stroke-width="2.5"></polyline>`;
    const dots = monthlyPct.map((v,i)=>{
      const over = goalPct>0 && v>goalPct;
      const color = goalPct===0 ? 'var(--brass)' : (over ? 'var(--rust)' : 'var(--forest)');
      return `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(v).toFixed(1)}" r="4.5" fill="${color}"></circle>
        ${v>0.01 ? `<text x="${xFor(i).toFixed(1)}" y="${(yFor(v)-11).toFixed(1)}" font-size="16" font-weight="700" fill="${color}" text-anchor="middle" font-family="Inter, sans-serif">${v.toFixed(0)}%</text>` : ''}`;
    }).join('');
    const xLabels = MONTHS.map((m,i)=>`<text x="${xFor(i).toFixed(1)}" y="${h-10}" font-size="13" font-weight="600" fill="var(--slate-mute)" text-anchor="middle" font-family="Inter, sans-serif">${m.slice(0,3)}</text>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:270px; display:block;">${goalLine}${avgLine}${path}${dots}${xLabels}</svg>`;
  }

  // Gráfico de tendência da Análise anual: valores em R$ jan-dez (só plota
  // pontos nos meses já decorridos), com a meta (R$) e a média do período.
  function annualValueTrendChartSvg(series, avgValue, monthsElapsed, goalValue){
    const w=700, h=270, padL=56, padR=20, padT=36, padB=36;
    const chartW = w-padL-padR, chartH = h-padT-padB;
    const elapsedValues = series.slice(0, monthsElapsed);
    const maxVal = Math.max(avgValue*1.3, (goalValue||0)*1.3, ...elapsedValues, 10);
    const stepX = chartW/11;
    const yFor = (v) => padT + chartH - (Math.min(v,maxVal)/maxVal*chartH);
    const xFor = (i) => padL + i*stepX;
    const avgLine = `<line x1="${padL}" y1="${yFor(avgValue).toFixed(1)}" x2="${w-padR}" y2="${yFor(avgValue).toFixed(1)}" stroke="var(--amber)" stroke-dasharray="4,3" stroke-width="1"></line>
      <text x="${padL}" y="${(yFor(avgValue)-7).toFixed(1)}" font-size="14" font-weight="600" fill="var(--amber)" text-anchor="start" font-family="Inter, sans-serif">média ${fmt(avgValue)}</text>`;
    const goalLine = (goalValue>0) ? `<line x1="${padL}" y1="${yFor(goalValue).toFixed(1)}" x2="${w-padR}" y2="${yFor(goalValue).toFixed(1)}" stroke="var(--slate-mute)" stroke-dasharray="4,3" stroke-width="1"></line>
      <text x="${w-padR}" y="${(yFor(goalValue)-7).toFixed(1)}" font-size="14" font-weight="600" fill="var(--slate-mute)" text-anchor="end" font-family="Inter, sans-serif">meta ${fmt(goalValue)}</text>` : '';
    const points = elapsedValues.map((v,i)=>`${xFor(i).toFixed(1)},${yFor(v).toFixed(1)}`).join(' ');
    const path = elapsedValues.length>1 ? `<polyline points="${points}" fill="none" stroke="var(--brass)" stroke-width="2.5"></polyline>` : '';
    const dots = elapsedValues.map((v,i)=>{
      const over = v>avgValue;
      const color = over ? 'var(--rust)' : 'var(--forest)';
      return `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(v).toFixed(1)}" r="4.5" fill="${color}"></circle>
        <text x="${xFor(i).toFixed(1)}" y="${(yFor(v)-11).toFixed(1)}" font-size="15" font-weight="700" fill="${color}" text-anchor="middle" font-family="Inter, sans-serif">${v.toLocaleString('pt-BR',{maximumFractionDigits:0})}</text>`;
    }).join('');
    const xLabels = MONTHS.map((m,i)=>`<text x="${xFor(i).toFixed(1)}" y="${h-10}" font-size="13" font-weight="600" fill="var(--slate-mute)" text-anchor="middle" font-family="Inter, sans-serif">${m.slice(0,3)}</text>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:270px; display:block;">${goalLine}${avgLine}${path}${dots}${xLabels}</svg>`;
  }

  // Gráfico de barras da sobra mensal (receitas - despesas): barra pra cima e
  // verde quando sobrou, barra pra baixo e vermelha quando faltou, com uma
  // linha de base em zero — igual em espírito aos outros gráficos desta aba.
  function leftoverValueChartSvg(values){
    const w=700, h=290, padL=60, padR=20, padT=30, padB=36;
    const chartW = w-padL-padR, chartH = h-padT-padB;
    const maxAbs = Math.max(...values.map(v=>Math.abs(v)), 10);
    const stepX = chartW/12;
    const barW = stepX*0.5;
    const zeroY = padT + chartH/2;
    const scale = (chartH/2)/maxAbs;
    const xFor = (i) => padL + i*stepX + stepX/2;
    const zeroLine = `<line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w-padR}" y2="${zeroY.toFixed(1)}" stroke="var(--line-strong)" stroke-width="1"></line>`;
    const bars = values.map((v,i)=>{
      if(Math.abs(v)<0.01) return '';
      const isPos = v>=0;
      const color = isPos ? 'var(--forest)' : 'var(--rust)';
      const barH = Math.max(Math.abs(v)*scale, 2);
      const y = isPos ? zeroY-barH : zeroY;
      const labelY = isPos ? (y-8) : (y+barH+18);
      const label = (isPos?'':'-') + Math.abs(v).toLocaleString('pt-BR',{maximumFractionDigits:0});
      return `<rect x="${(xFor(i)-barW/2).toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="3" fill="${color}"></rect>
        <text x="${xFor(i).toFixed(1)}" y="${labelY.toFixed(1)}" font-size="15" font-weight="700" fill="${color}" text-anchor="middle" font-family="Inter, sans-serif">${label}</text>`;
    }).join('');
    const xLabels = MONTHS.map((m,i)=>`<text x="${xFor(i).toFixed(1)}" y="${h-10}" font-size="13" font-weight="600" fill="var(--slate-mute)" text-anchor="middle" font-family="Inter, sans-serif">${m.slice(0,3)}</text>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:290px; display:block;">${zeroLine}${bars}${xLabels}</svg>`;
  }

  // Gráfico de fluxo de caixa acumulado (estilo "waterfall"): cada mês é uma
  // barra que sobe (verde) ou desce (vermelho) a partir de onde o mês
  // anterior parou, terminando numa barra "Total" azul com o acumulado do ano.
  // Se realBalance for informado (saldo real de hoje em bancos+caixinhas),
  // desenha uma linha de referência tracejada nesse valor, pra comparar
  // visualmente o acumulado calculado com o dinheiro que realmente existe.
  function cashflowWaterfallChartSvg(values, realBalance){
    const w=760, h=340, padL=54, padR=20, padT=46, padB=40;
    const n = values.length;
    const totalCols = n+1; // 12 meses + Total
    const chartW = w-padL-padR, chartH = h-padT-padB;
    const stepX = chartW/totalCols;
    const barW = stepX*0.6;
    const hasRef = typeof realBalance==='number' && !isNaN(realBalance);

    const cum = [];
    let running = 0;
    values.forEach(v=>{ running += v; cum.push(running); });
    const total = running;

    const allY = [0, ...cum, total];
    if(hasRef) allY.push(realBalance);
    const minY = Math.min(...allY);
    const maxY = Math.max(...allY);
    const range = (maxY-minY) || 1;
    const pad = range*0.12;
    const scaleMin = minY-pad, scaleMax = maxY+pad;
    const scaleRange = (scaleMax-scaleMin) || 1;
    const scale = chartH/scaleRange;
    const yFor = (val) => padT + chartH - (val-scaleMin)*scale;
    const xFor = (i) => padL + i*stepX + stepX/2;

    const zeroY = yFor(0);
    const zeroLine = `<line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w-padR}" y2="${zeroY.toFixed(1)}" stroke="var(--line-strong)" stroke-width="1"></line>`;

    let bars = '';
    let prevCum = 0;
    values.forEach((v,i)=>{
      const from = prevCum, to = cum[i];
      const isPos = v>=0;
      const color = isPos ? 'var(--forest)' : 'var(--rust)';
      const yTop = yFor(Math.max(from,to));
      const yBot = yFor(Math.min(from,to));
      const barH = Math.max(yBot-yTop, 2);
      const label = (isPos?'':'-') + Math.abs(v).toLocaleString('pt-BR',{maximumFractionDigits:0});
      const labelY = isPos ? yTop-8 : yBot+18;
      bars += `<rect x="${(xFor(i)-barW/2).toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="3" fill="${color}"></rect>
        <text x="${xFor(i).toFixed(1)}" y="${labelY.toFixed(1)}" font-size="13.5" font-weight="700" fill="${color}" text-anchor="middle" font-family="Inter, sans-serif">${label}</text>`;
      if(i<n-1){
        const y = yFor(to);
        bars += `<line x1="${(xFor(i)+barW/2).toFixed(1)}" y1="${y.toFixed(1)}" x2="${(xFor(i+1)-barW/2).toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="2,2"></line>`;
      }
      prevCum = to;
    });

    const totalX = xFor(n);
    const totalIsPos = total>=0;
    const totalYTop = yFor(Math.max(0,total));
    const totalYBot = yFor(Math.min(0,total));
    const totalBarH = Math.max(totalYBot-totalYTop, 2);
    const totalLabel = (totalIsPos?'':'-') + Math.abs(total).toLocaleString('pt-BR',{maximumFractionDigits:0});
    const totalLabelY = totalIsPos ? totalYTop-8 : totalYBot+18;
    bars += `<rect x="${(totalX-barW/2).toFixed(1)}" y="${totalYTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${totalBarH.toFixed(1)}" rx="3" fill="var(--brass-light)"></rect>
      <text x="${totalX.toFixed(1)}" y="${totalLabelY.toFixed(1)}" font-size="14" font-weight="800" fill="var(--ink)" text-anchor="middle" font-family="Inter, sans-serif">${totalLabel}</text>`;

    // Linha de referência: saldo real de hoje em bancos + caixinhas.
    let refLine = '';
    if(hasRef){
      const refY = yFor(realBalance);
      const refLabel = 'saldo real hoje: ' + realBalance.toLocaleString('pt-BR',{maximumFractionDigits:0});
      const labelAbove = refY > padT+16;
      refLine = `<line x1="${padL}" y1="${refY.toFixed(1)}" x2="${w-padR}" y2="${refY.toFixed(1)}" stroke="var(--brass)" stroke-width="1.5" stroke-dasharray="6,4"></line>
        <text x="${padL}" y="${(labelAbove ? refY-8 : refY+18).toFixed(1)}" font-size="13" font-weight="700" fill="var(--brass)" text-anchor="start" font-family="Inter, sans-serif">${refLabel}</text>`;
    }

    const xLabels = MONTHS.map((m,i)=>`<text x="${xFor(i).toFixed(1)}" y="${h-12}" font-size="13" font-weight="600" fill="var(--slate-mute)" text-anchor="middle" font-family="Inter, sans-serif">${m.slice(0,3)}</text>`).join('')
      + `<text x="${totalX.toFixed(1)}" y="${h-12}" font-size="13" font-weight="700" fill="var(--ink)" text-anchor="middle" font-family="Inter, sans-serif">Total</text>`;

    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:340px; display:block;">${zeroLine}${bars}${refLine}${xLabels}</svg>`;
  }

  function renderGoalsDashboard(){
    if(!state.groupBudgets) state.groupBudgets = {};
    if(state.incomeGoal===undefined) state.incomeGoal = 0;
    if(!state.planningEvents) state.planningEvents = [];
    if(!state.planningNotes) state.planningNotes = {};
    if(!state.dismissedNotifications) state.dismissedNotifications = [];
    if(!state.budgets) state.budgets = {};
    const monthTx = txForMonth(currentYear, currentMonth).filter(t=>t.type==='expense');
    const expenseGroups = (state.groups||[]).filter(g=>g.type==='expense');
    if(!state.groupDailyGoals) state.groupDailyGoals = {};

    // Dias já decorridos no mês selecionado (mesma lógica da aba Análise):
    // mês passado conta todos os dias, mês atual conta até hoje, mês
    // futuro fica em 0 (sem média ainda).
    const todayForElapsedDash = new Date();
    const selMonthKeyDash = currentYear*12 + currentMonth;
    const nowMonthKeyDash = todayForElapsedDash.getFullYear()*12 + todayForElapsedDash.getMonth();
    const daysElapsedDash = selMonthKeyDash < nowMonthKeyDash ? new Date(currentYear, currentMonth+1, 0).getDate() : (selMonthKeyDash === nowMonthKeyDash ? todayForElapsedDash.getDate() : 0);

    // ---- Meta de receita (referência única pros percentuais por grupo) ----
    const incomeGoal = state.incomeGoal || 0;

    // ---- Metas por grupo, em % da meta de receita ----
    // Transações da categoria "Reembolso" ficam de fora do % da meta — é uma
    // despesa real (você precisa pagar), mas some do cálculo de "quanto
    // ainda posso gastar" porque esse dinheiro não é seu, é passageiro.
    const reimbIdsG = reimbCategoryIds();
    const spentByGroup = {};
    const reimbSpentByGroup = {};
    monthTx.forEach(t=>{
      const c = catById(t.categoryId);
      if(!c) return;
      if(isReimbTx(t, reimbIdsG)){
        reimbSpentByGroup[c.groupId] = (reimbSpentByGroup[c.groupId]||0) + (-t.amount);
        return;
      }
      spentByGroup[c.groupId] = (spentByGroup[c.groupId]||0) + (-t.amount);
    });
    const groupGoalRows = expenseGroups.map(g=>{
      const goalPct = state.groupBudgets[g.id] || 0; // agora é um percentual (0-100), não R$
      const spent = spentByGroup[g.id] || 0;
      const realizedPct = incomeGoal>0 ? (spent/incomeGoal*100) : 0;
      const over = goalPct>0 && realizedPct>goalPct;
      const farol = farolFor(goalPct>0 ? (realizedPct/goalPct*100) : 0, over);
      const goalReais = incomeGoal * (goalPct/100);
      return { g, goalPct, spent, realizedPct, over, farol, goalReais, reimb: reimbSpentByGroup[g.id]||0 };
    });

    const groupGoalsHtml = groupGoalRows.map(r=>{
      const barPct = r.goalPct>0 ? Math.min(100, (r.realizedPct/r.goalPct*100)) : 0;
      const tag = r.goalPct>0
        ? miniTagHtml('group:'+r.g.id, `Meta: ${r.goalPct}% ✎`, r.goalPct, '0')
        : miniTagHtml('group:'+r.g.id, '+ meta', '', '0', true);
      const dailyGoal = state.groupDailyGoals[r.g.id] || 0;
      const avgPerDay = daysElapsedDash>0 ? r.spent/daysElapsedDash : 0;
      const dailyOver = dailyGoal>0 && avgPerDay>dailyGoal;
      const dailyIndicator = dailyGoal>0 ? (dailyOver?'🔴 ':'🟢 ') : '';
