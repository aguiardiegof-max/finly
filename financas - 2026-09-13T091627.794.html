  // Devolve o SVG minimalista pro emoji salvo, ou null se não houver mapeamento
  // (nesse caso quem chamou cai de volta pro emoji original).
  function categoryIconSvg(emoji){
    const path = CATEGORY_ICON_PATHS[emoji];
    if(!path) return null;
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
  }
  // Selo de "fora da meta" usado nas roscas do Painel — reaproveita o mesmo
  // ícone SVG minimalista das categorias/grupos (não o emoji cru), desenhado
  // do lado de fora da fatia com uma bolinha vermelha de aviso.
  // Selo de "fora da meta" usado nas roscas do Painel — igual ao selo redondo
  // de categorias/grupos (fundo na cor + ícone branco), com uma bolinha
  // vermelha de aviso no canto, desenhado do lado de fora da fatia.
  function donutOverBudgetBadgeSvg(bx, by, icon, fallbackEmoji, bgColor){
    const path = CATEGORY_ICON_PATHS[icon];
    const iconInner = path
      ? `<svg x="${(bx-5.2).toFixed(2)}" y="${(by-5.2).toFixed(2)}" width="10.4" height="10.4" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:#fff;">${path}</svg>`
      : `<text x="${bx.toFixed(2)}" y="${(by+2.8).toFixed(2)}" font-size="8.5" text-anchor="middle" fill="#fff">${escapeHtml(icon||fallbackEmoji)}</text>`;
    return `<circle cx="${bx.toFixed(2)}" cy="${by.toFixed(2)}" r="7.6" fill="${bgColor}" stroke="var(--paper-card)" stroke-width="1.4"></circle>
      ${iconInner}
      <circle cx="${(bx+5.4).toFixed(2)}" cy="${(by-5.4).toFixed(2)}" r="2.8" fill="var(--rust)" stroke="var(--paper-card)" stroke-width="0.9"></circle>`;
  }
  // Banco de ícones disponível pros seletores de grupo/categoria — todo emoji
  // com um SVG minimalista mapeado em CATEGORY_ICON_PATHS, na ordem em que foi
  // cadastrado ali.
  const ICON_BANK = Object.keys(CATEGORY_ICON_PATHS);
  // Selo redondo (cor de fundo + ícone minimalista branco) usado pra grupos e
  // categorias — cai pro emoji cru se o ícone salvo não tiver um SVG mapeado.
  function categoryBadgeHtml(icon, color, fallbackEmoji){
    const svg = categoryIconSvg(icon);
    if(svg) return `<span class="swatch icon-swatch" style="background:${color}">${svg}</span>`;
    return `<span class="swatch icon-swatch" style="background:${color}">${icon || fallbackEmoji}</span>`;
  }
  function bankLogoHtml(account){
    const bank = bankStyle(account.name);
    if(bank && bank.img){
      return `<span class="bank-logo bank-logo-img" style="background:${bank.color}"><img src="${bank.img}" alt="${escapeHtml(account.name)}" loading="lazy"></span>`;
    }
    const color = bank ? bank.color : account.color;
    const label = bank ? bank.label.slice(0,2).toUpperCase() : account.name.slice(0,2).toUpperCase();
    return `<span class="bank-logo" style="background:${color}">${label}</span>`;
  }

  const CREDIT_CARD_IMAGES = [
    { match: /ita[uú].*uniclass/i, img: CARD_ITAU_UNICLASS },
    { match: /nubank/i, img: CARD_NUBANK },
    { match: /swile/i, img: CARD_SWILE },
  ];
  function creditCardImage(name){
    if(!name) return null;
    const found = CREDIT_CARD_IMAGES.find(c=>c.match.test(name));
    return found ? found.img : null;
  }
  // Pra contas do tipo Crédito com foto de cartão cadastrada, mostra a foto real
  // (retângulo, proporção de cartão) em vez do selo redondo com iniciais/logo.
  function creditCardVisualHtml(account){
    const img = account.type==='Crédito' ? creditCardImage(account.name) : null;
    if(!img) return bankLogoHtml(account);
    return `<span class="credit-card-visual"><img src="${img}" alt="${escapeHtml(account.name)}" loading="lazy"></span>`;
  }

  function dueInfoText(a){
    if(!a.dueDay) return '';
    const closing = (a.type==='Crédito' && a.closingDay) ? ` · fecha dia ${a.closingDay}` : '';
    return `${closing} · vence dia ${a.dueDay}`;
  }

  // Junta contas a pagar pendentes, despesas marcadas como pendentes e faturas
  // de cartão próximas do vencimento, tudo numa lista só, ordenada por data.
  // Só notifica o que é do mês atual ou ainda pendente do mês passado — nada
  // mais antigo, nada de meses futuros (exceto os lembretes de planejamento,
  // que têm sua própria janela de antecedência).
  function getUpcomingNotifications(){
    const todayDate = new Date(); todayDate.setHours(0,0,0,0);
    const today = todayDate.toISOString().slice(0,10);
    const curMonthKey = today.slice(0,7);
    const lastMonthDate = new Date(todayDate.getFullYear(), todayDate.getMonth()-1, 1);
    const lastMonthKey = `${lastMonthDate.getFullYear()}-${String(lastMonthDate.getMonth()+1).padStart(2,'0')}`;
    const monthOk = (dateStr) => { const k = dateStr.slice(0,7); return k===curMonthKey || k===lastMonthKey; };

    const items = [];
    state.bills.filter(b=>!b.paid).forEach(b=>{
      if(!monthOk(b.dueDate)) return;
      items.push({ kind:'bill', date: b.dueDate, label: b.desc, amount: b.amount, overdue: b.dueDate<today, id: b.id, notifKey: 'bill:'+b.id });
    });
    // Despesas avulsas, exceto as de cartão de crédito — essas só notificam
    // como um único aviso do valor final da fatura fechada, mais abaixo.
    state.transactions.filter(t=>t.type==='expense' && t.paid===false).forEach(t=>{
      if(!monthOk(t.date)) return;
      const acc = accById(t.accountId);
      if(acc && acc.type==='Crédito') return;
      items.push({ kind:'tx', date: t.date, label: t.desc, amount: Math.abs(t.amount), overdue: t.date<today, id: t.id, notifKey: 'tx:'+t.id });
    });
    // Cartão de crédito: só avisa quando a fatura já fechou de verdade
    // (mesma regra do botão "Pagar fatura"), com o valor final já somado.
    state.accounts.filter(a=>a.type==='Crédito').forEach(a=>{
      const info = currentInvoiceInfo(a);
      if(info.payable && info.amount>0.004){
        if(monthOk(info.dueDate)) items.push({ kind:'card', date: info.dueDate, label: `Fatura fechada — ${a.name}`, amount: info.amount, overdue: info.dueDate<today, id: a.id, notifKey: 'card:'+a.id+':'+info.dueDate });
      }
    });
    // Eventos do Planejamento: aviso antecipado, a partir de 10 dias antes.
    const horizon = new Date(todayDate); horizon.setDate(horizon.getDate()+10);
    const horizonStr = horizon.toISOString().slice(0,10);
    (state.planningEvents||[]).forEach(ev=>{
      if(ev.date>=today && ev.date<=horizonStr){
        const info = planningTypeInfo(ev.eventType);
        items.push({ kind:'plan', date: ev.date, label: `${info.emoji} ${ev.title}`, amount: ev.value||null, overdue:false, id: ev.id, notifKey: 'plan:'+ev.id });
      }
    });

    const dismissed = state.dismissedNotifications || [];
    return items.filter(it=> !dismissed.includes(it.notifKey)).sort((a,b)=>a.date.localeCompare(b.date));
  }

  function addMonthsToDateStr(dateStr, n){
    const d = new Date(dateStr+'T00:00:00');
    const day = d.getDate();
    const target = new Date(d.getFullYear(), d.getMonth()+n, 1);
    const lastDay = new Date(target.getFullYear(), target.getMonth()+1, 0).getDate();
    target.setDate(Math.min(day, lastDay));
    return target.toISOString().slice(0,10);
  }

  // One-time migration: the app used to have a 2-level Category > Subcategory
  // model. Now it's 3-level: Group > Category > Subcategory. Every category
  // that already had subcategories is promoted to a group, and each of its
  // subcategories becomes a real category underneath it. Nothing is deleted;
  // transactions, bills and budgets are remapped to point at the right level.
  // Mantém a cor de cada categoria sempre igual à cor do seu grupo — o ícone
  // (formato) pode variar categoria a categoria, mas a cor nunca é escolhida
  // individualmente, é sempre herdada do grupo. Roda toda vez que o app carrega
  // (corrige dados antigos) e depois de qualquer edição de grupo/categoria.
  function syncCategoryColorsToGroups(){
    let changed = false;
    (state.categories||[]).forEach(c=>{
      const g = (state.groups||[]).find(x=>x.id===c.groupId);
      if(g && c.color !== g.color){ c.color = g.color; changed = true; }
    });
    return changed;
  }
  function migrateToGroupHierarchy(){
    if(state.groups) return false;
    state.groups = [];
    const fallback = {};
    function fallbackGroup(type){
      if(!fallback[type]){
        const g = {id: uid(), name: type==='income' ? 'Receitas' : 'Geral', type, color:'#6B7280', icon:'📁'};
        state.groups.push(g);
        fallback[type] = g.id;
      }
      return fallback[type];
    }
    const oldCategories = state.categories;
    const newCategories = [];
    const catIdRemap = {};
    const promotedIds = new Set();

    oldCategories.forEach(cat=>{
      const subs = cat.subcategories || [];
      if(subs.length > 0){
        const group = {id: uid(), name: cat.name, type: cat.type, color: cat.color, icon: cat.icon};
        state.groups.push(group);
        promotedIds.add(cat.id);
        subs.forEach(sub=>{
          newCategories.push({ id: sub.id, name: sub.name, type: cat.type, groupId: group.id, color: cat.color, icon: cat.icon, subcategories: [] });
        });
        catIdRemap[cat.id] = { groupId: group.id, subIds: new Set(subs.map(s=>s.id)) };
      } else {
        cat.groupId = fallbackGroup(cat.type);
        newCategories.push(cat);
      }
    });

    function fallbackCategoryFor(groupId, type, color, icon){
      let fc = newCategories.find(c=>c.groupId===groupId && c.name==='Outros');
      if(!fc){
        fc = {id: uid(), name:'Outros', type, groupId, color, icon, subcategories:[]};
        newCategories.push(fc);
      }
      return fc.id;
    }
    function remap(catId, subId){
      if(!catId) return {categoryId: catId, subcategoryId: subId};
      const info = catIdRemap[catId];
      if(!info) return {categoryId: catId, subcategoryId: subId};
      if(subId && info.subIds.has(subId)) return {categoryId: subId, subcategoryId: undefined};
      const oldCat = oldCategories.find(c=>c.id===catId);
      return {categoryId: fallbackCategoryFor(info.groupId, oldCat.type, oldCat.color, oldCat.icon), subcategoryId: undefined};
    }

    state.transactions.forEach(t=>{
      if(t.categoryId){ const r = remap(t.categoryId, t.subcategoryId); t.categoryId = r.categoryId; t.subcategoryId = r.subcategoryId; }
    });
    state.bills.forEach(b=>{
      if(b.categoryId){ b.categoryId = remap(b.categoryId, null).categoryId; }
    });
    const newBudgets = {};
    Object.entries(state.budgets||{}).forEach(([catId, val])=>{ if(!promotedIds.has(catId)) newBudgets[catId] = val; });
    state.budgets = newBudgets;
    state.categories = newCategories;
    return true;
  }

  function ensureRequestedGroups(){
    // Roda só uma vez (na primeira vez que o app carrega com essa versão).
    // Antes rodava em todo carregamento, o que recriava categorias/grupos
    // dessa lista fixa mesmo depois do usuário deletar de propósito.
    if(state._requestedGroupsSeededV1) return false;
    state._requestedGroupsSeededV1 = true;
    let changed = true;
    REQUESTED_GROUPS.forEach(def=>{
      let group = state.groups.find(g=> g.type===def.type && g.name.trim().toLowerCase()===def.name.trim().toLowerCase());
      if(!group){
        group = {id: uid(), name: def.name, type: def.type, color: def.color, icon: def.icon};
        state.groups.push(group);
        changed = true;
      }
      def.cats.forEach(([catName, catIcon])=>{
        const exists = state.categories.some(c=> c.groupId===group.id && c.name.trim().toLowerCase()===catName.trim().toLowerCase());
        if(!exists){
          state.categories.push({id: uid(), name: catName, type: def.type, groupId: group.id, color: def.color, icon: catIcon||def.icon, subcategories: []});
          changed = true;
        }
      });
    });
    return changed;
  }

  // Transactions/transfers that pointed at the old accounts are moved onto
  // the first new account instead of being orphaned (invalid transfers,
  // where both sides would collapse into the same account, are dropped).
  function resetAccountsOnce(){
    if(state._accountsResetV1) return false;
    const REQUESTED_ACCOUNTS = ['Caixa','Nubank ALN','Itaú ALN','Itaú DGO','Mercado Pago DGO'];
    const colors = ['#1F6E4A','#B8913C','#3F6E92','#8C6FB0','#AE3B2C'];
    const newAccounts = REQUESTED_ACCOUNTS.map((name,i)=>({
      id: uid(), name, type: name==='Caixa' ? 'Dinheiro' : 'Banco', balance: 0, color: colors[i%colors.length]
    }));
    const fallbackId = newAccounts[0].id;
    state.transactions.forEach(t=>{
      if(t.accountId) t.accountId = fallbackId;
      if(t.fromAccountId) t.fromAccountId = fallbackId;
      if(t.toAccountId) t.toAccountId = fallbackId;
    });
    state.transactions = state.transactions.filter(t=> !(t.type==='transfer' && t.fromAccountId===t.toAccountId));
    state.accounts = newAccounts;
    state._accountsResetV1 = true;
    return true;

    state._cardPaidBackfillV1 = true;
    return changed || true;
  }

  // Receitas lançadas antes do controle de "recebido/pendente" existir também
  // ficam sem esse campo — aqui elas ganham um valor de partida pela data.
  function backfillIncomePaidStatusOnce(){
    if(state._incomePaidBackfillV1) return false;
    const today = new Date().toISOString().slice(0,10);
    let changed = false;
    state.transactions.forEach(t=>{
      if(t.type==='income' && t.paid===undefined){
        t.paid = t.date<=today;
        changed = true;
      }
    });
    state._incomePaidBackfillV1 = true;
    return changed || true;
  }

  // Despesas comuns (não-cartão) lançadas antes do controle de "pago/pendente"
  // existir também ficam sem esse campo — aqui elas ganham um valor de
  // partida pela data, do mesmo jeito que já era feito para receitas.
  function backfillExpensePaidStatusOnce(){
    if(state._expensePaidBackfillV1) return false;
    const today = new Date().toISOString().slice(0,10);
    let changed = false;
    state.transactions.forEach(t=>{
      if(t.type==='expense' && t.paid===undefined){
        const acc = accById(t.accountId);
        if(!acc || acc.type!=='Crédito'){
          t.paid = t.date<=today;
          changed = true;
        }
      }
    });
    state._expensePaidBackfillV1 = true;
    return changed || true;
  }

  // Primeira letra maiúscula, resto minúsculo — usado sempre que um nome de
  // grupo/categoria/subcategoria é criado ou editado, pra manter o padrão.
  function toStandardCase(str){
    if(!str) return str;
    const trimmed = String(str).trim();
    if(!trimmed) return trimmed;
    return trimmed.charAt(0).toUpperCase() + trimmed.slice(1).toLowerCase();
  }
  // Corrige de uma vez os nomes que já existiam em CAIXA ALTA ou mistos.

    (state.categories||[]).forEach(c=>{

      (c.subcategories||[]).forEach(s=>{ s.name = toStandardCase(s.name); });
    });
    state._caseNormalizedV1 = true;
    return true;
  }

  const AUTH_KEY = 'rumo-auth-session-v1';
  let authSession = null;

  // ---------- Backup automático no Google Drive ----------
  // Usa o Google Identity Services (OAuth2 implícito) com o escopo mínimo
  // 'drive.file', que só enxerga arquivos/pastas criados pelo próprio app —
  // nunca o resto do Drive do usuário. O access_token só vive em memória,
  // nunca é persistido. O Client ID (não-secreto, específico do domínio
  // onde o app está hospedado) fica salvo em state.settings.driveClientId.
  let driveTokenClient = null;
  let driveAccessToken = null;

  function waitForGis(timeoutMs){
    return new Promise((resolve)=>{
      const start = Date.now();
      (function check(){
        if(typeof google !== 'undefined' && google.accounts && google.accounts.oauth2){ resolve(true); return; }
        if(Date.now()-start > timeoutMs){ resolve(false); return; }
        setTimeout(check, 200);
      })();
    });
  }

  function ensureDriveTokenClient(){
    const clientId = state && state.settings && state.settings.driveClientId;
    if(!clientId || typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) return null;
    if(driveTokenClient && driveTokenClient.__clientId === clientId) return driveTokenClient;
    driveTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: ()=>{}
    });
    driveTokenClient.__clientId = clientId;
    return driveTokenClient;
  }

  function requestDriveToken(interactive){
    return new Promise((resolve, reject)=>{
      const tc = ensureDriveTokenClient();
      if(!tc){ reject(new Error('Google Identity Services indisponível ou Client ID não configurado.')); return; }
      tc.callback = (resp)=>{
        if(resp && resp.error){ reject(new Error(resp.error)); return; }
        driveAccessToken = resp.access_token;
        resolve(resp.access_token);
      };
      try { tc.requestAccessToken({ prompt: interactive ? 'consent' : '' }); }
      catch(e){ reject(e); }
    });
  }

  async function findOrCreateDriveFolder(token){
    if(state.settings.driveFolderId) return state.settings.driveFolderId;
    const q = encodeURIComponent("name='Finly - Backups' and mimeType='application/vnd.google-apps.folder' and trashed=false");
    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, { headers:{ Authorization:'Bearer '+token } });
    if(!res.ok) throw new Error('Não consegui acessar o Drive (HTTP '+res.status+').');
    const data = await res.json();
    let folderId;
    if(data.files && data.files.length>0){
      folderId = data.files[0].id;
    } else {
      const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
        method:'POST',
        headers:{ Authorization:'Bearer '+token, 'Content-Type':'application/json' },
        body: JSON.stringify({ name:'Finly - Backups', mimeType:'application/vnd.google-apps.folder' })
      });
      if(!createRes.ok) throw new Error('Não consegui criar a pasta no Drive (HTTP '+createRes.status+').');
      const created = await createRes.json();
      folderId = created.id;
    }
    state.settings.driveFolderId = folderId;
    await saveState();
    return folderId;
  }

  async function uploadBackupToDrive(token, folderId, filename, jsonStr){
    const metadata = { name: filename, parents:[folderId], mimeType:'application/json' };
    const boundary = 'finly-' + uid();
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${jsonStr}\r\n` +
      `--${boundary}--`;
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name', {
      method:'POST',
      headers:{ Authorization:'Bearer '+token, 'Content-Type': 'multipart/related; boundary='+boundary },
      body
    });
    if(!res.ok) throw new Error('Falha no upload pro Drive (HTTP '+res.status+').');
    return res.json();
  }

  async function pruneOldDriveBackups(token, folderId, keep){
    try {
      const res = await fetch(`https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+trashed=false&orderBy=createdTime+desc&fields=files(id,createdTime)&pageSize=100`, { headers:{ Authorization:'Bearer '+token } });
      if(!res.ok) return;
      const data = await res.json();
      const toDelete = (data.files||[]).slice(keep);
      for(const f of toDelete){
        await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}`, { method:'DELETE', headers:{ Authorization:'Bearer '+token } });
      }
    } catch(e){ /* limpeza de backups antigos é best-effort */ }
  }

  async function runDriveBackup(interactive){
    const token = await requestDriveToken(interactive);
    const folderId = await findOrCreateDriveFolder(token);
    const ts = new Date().toISOString().slice(0,10);
    await uploadBackupToDrive(token, folderId, `financas-backup-${ts}.json`, JSON.stringify(state, null, 2));
    await pruneOldDriveBackups(token, folderId, 30);
    state.settings.driveLastBackup = new Date().toISOString();
    await saveState();
  }

  // Roda no boot: se o backup automático estiver ativado e ainda não tiver
  // rodado hoje, tenta silenciosamente (sem popup, reaproveitando a sessão
  // Google já autorizada no navegador). Falha em silêncio — sem popup de
  // erro — pra não incomodar; o usuário pode conferir em Exportar dados.
  async function maybeRunAutoDriveBackup(){
    const s = state && state.settings;
    if(!s || !s.driveBackupEnabled || !s.driveClientId) return;
    const today = new Date().toISOString().slice(0,10);
    if(s.driveLastBackup && s.driveLastBackup.slice(0,10)===today) return;
    const ok = await waitForGis(6000);
    if(!ok) return;
    try { await runDriveBackup(false); }
    catch(e){ console.warn('Backup automático do Drive não rodou:', e.message); }
  }

  async function loadAuthSession(){
    try {
      const res = await storageGet(AUTH_KEY);
      if(res && res.value) authSession = JSON.parse(res.value);
    } catch(e){ authSession = null; }
  }
  function setAuthSession(data){
    authSession = {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      user_id: data.user ? data.user.id : (data.id || null),
      email: (data.user && data.user.email) || data.email || null,
      expires_at: Date.now() + (data.expires_in ? data.expires_in*1000 : 3600*1000)
    };
    storageSet(AUTH_KEY, JSON.stringify(authSession));
  }
  async function clearAuthSession(){
    authSession = null;
    await storageDelete(AUTH_KEY);
  }
  // Sanitiza a URL do Supabase, mantendo só o domínio — protege contra o
  // usuário colar sem querer algo com /rest/v1, /auth/v1 etc no final.
  function sbOrigin(url){
    try { return new URL(url.trim()).origin; }
    catch(e){ return (url||'').trim().replace(/\/$/,''); }
  }

  async function authRequest(path, body){
    let res;
    try {
      res = await fetch(sbOrigin(state.settings.supabaseUrl) + path, {
        method: 'POST',
        headers: {'Content-Type':'application/json', apikey: state.settings.supabaseKey},
        body: JSON.stringify(body)
      });
    } catch(e){
      throw new Error('Não consegui alcançar o servidor do Supabase. Confira a URL (deve começar com https://) e sua conexão.');
    }
    const rawText = await res.text();
    let data = {};
    try { data = rawText ? JSON.parse(rawText) : {}; } catch(e){ /* resposta não era JSON */ }
    if(!res.ok){
      const msg = data.error_description || data.msg || (data.error&&data.error.message) || data.error
        || (rawText ? rawText.slice(0,200) : ('HTTP ' + res.status));
      throw new Error(msg);
    }
    return data;
  }
  async function signInWithPassword(email, password){ return authRequest('/auth/v1/token?grant_type=password', {email, password}); }
  async function signUpWithPassword(email, password){ return authRequest('/auth/v1/signup', {email, password}); }
  async function refreshAuthSession(){
    if(!authSession || !authSession.refresh_token) return false;
    try {
      const data = await authRequest('/auth/v1/token?grant_type=refresh_token', {refresh_token: authSession.refresh_token});
      setAuthSession(data);
      return true;
    } catch(e){ return false; }
  }

  async function pullFromSupabase(url, key){
    if(!authSession) return null;
    const res = await fetch(sbOrigin(url) + '/rest/v1/app_state?id=eq.'+encodeURIComponent(authSession.user_id)+'&select=data', {
      headers: { apikey: key, Authorization: 'Bearer '+authSession.access_token }
    });
    if(res.status===401){ const ok = await refreshAuthSession(); return ok ? pullFromSupabase(url,key) : null; }
    if(!res.ok) return null;
    const rows = await res.json();
    return (rows && rows[0] && rows[0].data) ? rows[0].data : null;
  }

  async function loadState(){
    try {
      const res = await storageGet(STORAGE_KEY);
      if (res && res.value) { state = JSON.parse(res.value); }

    if(!state){ state = defaultState(); await saveState(); }
    if(!state.settings) state.settings = {theme:'light'};

    if(!state.planningEvents) state.planningEvents = [];

    if(!state.dismissedNotifications) state.dismissedNotifications = [];
  }

  // Called once we know we have a valid state to work with (either local-only,
  // or after a successful login + pull from Supabase).
  async function finishBoot(){
    if(!state.settings) state.settings = {theme:'light'};
    if(!state.groupBudgets) state.groupBudgets = {};
    if(state.incomeGoal===undefined) state.incomeGoal = 0;
    if(!state.planningEvents) state.planningEvents = [];

    if(!state.budgets) state.budgets = {};
    let changed = migrateToGroupHierarchy();
    changed = renameReembolsosCategoryOnce() || changed;
    changed = ensureRequestedGroups() || changed;
    changed = ensureReembolsoIncomeCategoryOnce() || changed;
    changed = syncRequestedCategoryIcons() || changed;
    changed = ensureMoradiaExampleSubs() || changed;
    changed = resetAccountsOnce() || changed;
    changed = updateAccountsV2Once() || changed;
    changed = updateAccountsV3Once() || changed;
    changed = updateAccountsV4Once() || changed;
    changed = backfillCardPaidStatusOnce() || changed;
    changed = backfillIncomePaidStatusOnce() || changed;
    changed = backfillExpensePaidStatusOnce() || changed;
    changed = normalizeCaseOnce() || changed;
    changed = seedPlanningEventsOnce() || changed;
    changed = migrateGoalsOnce() || changed;
    changed = syncCategoryColorsToGroups() || changed;
    applyTheme();
    if(changed) await saveState();

  async function saveState(){

  function syncToSupabase(){
    const s = state && state.settings;
    if(!s || !s.supabaseUrl || !s.supabaseKey || !authSession) return;
    fetch(sbOrigin(s.supabaseUrl) + '/rest/v1/app_state?on_conflict=id', {
      method: 'POST',
      headers: {
        'Content-Type':'application/json',
        apikey: s.supabaseKey,
        Authorization: 'Bearer '+authSession.access_token,
        Prefer: 'resolution=merge-duplicates'
      },
      body: JSON.stringify({id: authSession.user_id, data: state, updated_at: new Date().toISOString()})
    }).then(async (res)=>{
      if(res.status===401){ const ok = await refreshAuthSession(); if(ok) syncToSupabase(); }
    }).catch(()=>{ /* offline ou config errada — ignora silenciosamente */ });
  }

  function catById(id){ return state.categories.find(c=>c.id===id); }
  function accById(id){ return state.accounts.find(a=>a.id===id); }

  // Categoria "Reembolso": qualquer despesa (e a receita correspondente,
  // quando a empresa devolve o dinheiro) lançada nessa categoria não conta
  // pra sobra mensal, metas nem pro fluxo de caixa acumulado — é dinheiro
  // de passagem, não seu ganho ou gasto de verdade.
  function reimbCategoryIds(){
    const exp = state.categories.find(c=>c.type==='expense' && normalizeMatch(c.name)==='reembolso');
    const inc = state.categories.find(c=>c.type==='income' && normalizeMatch(c.name)==='reembolso');
    return { expenseId: exp ? exp.id : null, incomeId: inc ? inc.id : null };
  }
  function isReimbTx(t, ids){
    if(t.type==='expense') return ids.expenseId!==null && t.categoryId===ids.expenseId;
    if(t.type==='income') return ids.incomeId!==null && t.categoryId===ids.incomeId;
    return false;
  }

  // Current balance = opening balance stored on the account + every transaction
  // that has ever touched it (income/expense directly, or transfers in/out).
  function computeAccountBalance(accountId){
    const acc = accById(accountId);
    let bal = acc ? (acc.balance || 0) : 0;
    const isCredit = acc && acc.type==='Crédito';
    state.transactions.forEach(t=>{
      if(t.type==='transfer'){
        if(t.fromAccountId===accountId) bal -= t.amount;
        if(t.toAccountId===accountId) bal += t.amount;
      } else if(t.accountId===accountId){
        // Cartão de crédito: a fatura acumula todas as compras assim que
        // lançadas (pagas ou não) e só é "zerada" quando a fatura é paga,
        // via transferência (ver openPayInvoiceModal). Contas normais: só
        // entram no saldo quando marcadas como pagas/recebidas — pendentes
        // não mexem no saldo.
        if(isCredit || t.paid){
          bal += t.amount;
        }
      }
    });
    return bal;
  }

  // Uma fatura junta TODAS as compras feitas num mesmo mês-calendário — sem
  // nunca mudar a data de nenhuma transação. Ela "fecha" (fica paga-mento
  // liberado) no dia de fechamento do mês seguinte ao das compras — ex:
  // compras de julho fecham em 01/08 e ficam pagáveis a partir daí.
  function invoiceMonthKey(dateStr){ return dateStr.slice(0,7); } // "AAAA-MM"
  function isInvoiceMonthClosed(monthKey, closingDay){
    const [y,m] = monthKey.split('-').map(Number); // m é 1-indexado
    const closeDate = new Date(y, m, closingDay||1); // mês "m" (0-indexado) = mês seguinte ao das compras
    const today = new Date(); today.setHours(0,0,0,0);
    return closeDate <= today;
  }
  function hasPayableInvoice(account){
    if(!account || account.type!=='Crédito') return false;
    const closingDay = account.closingDay || 1;
    return state.transactions.some(t=> t.type==='expense' && t.accountId===account.id && !t.paid && isInvoiceMonthClosed(invoiceMonthKey(t.date), closingDay));
  }
  // Descobre qual fatura mostrar: se tem algum mês já fechado e ainda não
  // pago, é esse (libera o botão "Pagar fatura"). Se está tudo pago, mostra
  // o total que já está se acumulando pro mês corrente (fatura em aberto).
  function currentInvoiceInfo(account){
    const closingDay = account.closingDay || 1;
    const dueDay = account.dueDay || closingDay;
    const byMonth = {};
    state.transactions.forEach(t=>{
      if(t.type!=='expense' || t.accountId!==account.id || t.paid) return;
      const key = invoiceMonthKey(t.date);
      // Compra tem amount negativo (-amount vira positivo, soma na fatura);
      // estorno/desconto tem amount positivo (-amount vira negativo, abate).
      byMonth[key] = (byMonth[key]||0) + (-t.amount);
    });
    const monthToDueDate = (monthKey) => {
      const [y,m] = monthKey.split('-').map(Number);
      const dueMonthDate = new Date(y, m, 1); // mês seguinte ao das compras (0-indexado = m)
      const lastDay = new Date(dueMonthDate.getFullYear(), dueMonthDate.getMonth()+1, 0).getDate();
      const dd = Math.min(dueDay, lastDay);
      return `${dueMonthDate.getFullYear()}-${String(dueMonthDate.getMonth()+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    };
    const closedMonths = Object.keys(byMonth).filter(k=>isInvoiceMonthClosed(k, closingDay)).sort();
    if(closedMonths.length>0){
      const monthKey = closedMonths[0];
      return { payable:true, amount: byMonth[monthKey], dueDate: monthToDueDate(monthKey) };
    }
    const openMonths = Object.keys(byMonth).sort();
    if(openMonths.length>0){
      const monthKey = openMonths[0];
      return { payable:false, amount: byMonth[monthKey], dueDate: monthToDueDate(monthKey) };
    }
    return { payable:false, amount:0, dueDate:null };
  }
  // Igual acima, mas pro mês exato que está sendo visualizado no painel —
  // assim trocar o mês no seletor também atualiza o valor do cartão.
  function invoiceInfoForMonth(account, year, month){
    const closingDay = account.closingDay || 1;
    const dueDay = account.dueDay || closingDay;
    const monthKey = `${year}-${String(month+1).padStart(2,'0')}`;
    let amount = 0, pendingAmount = 0;
    state.transactions.forEach(t=>{
      if(t.type!=='expense' || t.accountId!==account.id) return;
      if(invoiceMonthKey(t.date)!==monthKey) return;
      amount += (-t.amount);
      if(!t.paid) pendingAmount += (-t.amount);
    });
    const dueMonthDate = new Date(year, month+1, 1);
    const lastDay = new Date(dueMonthDate.getFullYear(), dueMonthDate.getMonth()+1, 0).getDate();
    const dd = Math.min(dueDay, lastDay);
    const dueDate = `${dueMonthDate.getFullYear()}-${String(dueMonthDate.getMonth()+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    return { amount, pendingAmount, dueDate, closed: isInvoiceMonthClosed(monthKey, closingDay) };
  }
  function daysUntilClosing(account){
    const closingDay = account.closingDay || 1;
    const today = new Date(); today.setHours(0,0,0,0);
    let close = new Date(today.getFullYear(), today.getMonth(), closingDay);
    if(close < today) close = new Date(close.getFullYear(), close.getMonth()+1, closingDay);
    return Math.round((close-today)/(1000*60*60*24));
  }

  function txForMonth(y,m){
    return state.transactions.filter(t=>{
      const dt = new Date(t.date+'T00:00:00');
      return dt.getFullYear()===y && dt.getMonth()===m;
    });
  }

  // Filtro de período da aba Transações: além do mês atual (padrão, com as
  // setinhas de sempre), permite ver um ano inteiro, um ou mais meses
  // específicos dentro de um ano, ou um intervalo de datas personalizado.
  function txForPeriod(period){
    if(period.mode==='year'){
      if(period.months.size>0){
        return state.transactions.filter(t=>{
          const dt = new Date(t.date+'T00:00:00');
          return dt.getFullYear()===period.year && period.months.has(String(dt.getMonth()));
        });
      }
      return state.transactions.filter(t=> new Date(t.date+'T00:00:00').getFullYear()===period.year);
    }
    if(period.mode==='custom'){
      if(!period.from || !period.to) return [];
      const from = period.from, to = period.to;
      return state.transactions.filter(t=> t.date>=from && t.date<=to);
    }
    return txForMonth(currentYear, currentMonth);
  }

  function yearsWithTransactions(){
    const years = new Set(state.transactions.map(t=> new Date(t.date+'T00:00:00').getFullYear()));
    years.add(currentYear);
    return [...years].sort((a,b)=>a-b);
  }

  function txPeriodSubtitle(period){

        return `Lançamentos de ${names.join(', ')} de ${period.year}`;
      }
      return `Lançamentos do ano de ${period.year}`;
    }
    if(period.mode==='custom'){
      if(period.from && period.to){
        const f = new Date(period.from+'T00:00:00').toLocaleDateString('pt-BR');
        const t = new Date(period.to+'T00:00:00').toLocaleDateString('pt-BR');
        return `Lançamentos de ${f} até ${t}`;
      }
      return 'Escolha as duas datas do período';
    }
    return `Lançamentos de ${MONTHS[currentMonth]} ${currentYear}`;
  }

  // "Fixed" (indefinite) recurring expenses are generated in rolling batches:
  // whenever the viewed month approaches the edge of what's been generated,
  // we top up further months automatically.
  async function ensureFixedCoverage(){
    const groups = {};
    state.transactions.filter(t=>t.recurrenceType==='fixed').forEach(t=>{
      (groups[t.recurrenceGroupId] = groups[t.recurrenceGroupId] || []).push(t);
    });
    let changed = false;
    Object.values(groups).forEach(list=>{
      list.sort((a,b)=>a.date.localeCompare(b.date));
      const last = list[list.length-1];
      const lastMonthDate = new Date(last.date+'T00:00:00');
      const targetMonthDate = new Date(currentYear, currentMonth+12, 1);
      const n = monthsBetween(new Date(lastMonthDate.getFullYear(), lastMonthDate.getMonth(),1), targetMonthDate);
      const today = new Date().toISOString().slice(0,10);
      const lastAcc = accById(last.accountId);
      const isCardExpense = last.type==='expense' && lastAcc && lastAcc.type==='Crédito';
      const tracksPaid = last.paid!==undefined;
      for(let i=1;i<=n;i++){
        const d = addMonthsToDateStr(last.date, i);
        state.transactions.push({
          id: uid(), desc: last.desc, amount: last.amount, date: d,
          type: last.type, categoryId: last.categoryId, subcategoryId: last.subcategoryId, accountId: last.accountId,
          paid: tracksPaid ? (isCardExpense ? false : d<=today) : undefined,
          recurrenceType: 'fixed', recurrenceGroupId: last.recurrenceGroupId
        });
        changed = true;
      }
    });
    if(changed) await saveState();
  }

  // ---------- DASHBOARD ----------
  function renderDashboard(){
    const monthTx = txForMonth(currentYear, currentMonth);
    const income = monthTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
    const expense = monthTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    const savings = income + expense;
    const pctSpent = income>0 ? (Math.abs(expense)/income*100) : null;

    const byCat = {};
    const bySubCat = {};
    monthTx.filter(t=>t.type==='expense').forEach(t=>{
      if(t.subcategoryId && disabledSubcats.has(t.subcategoryId)) return;
      byCat[t.categoryId] = (byCat[t.categoryId]||0) + (-t.amount);
      const subKey = t.subcategoryId || '__none__';
      bySubCat[t.categoryId] = bySubCat[t.categoryId] || {};
      bySubCat[t.categoryId][subKey] = (bySubCat[t.categoryId][subKey]||0) + (-t.amount);
    });

    function subBreakdownHtml(cid, c){
      const subMap = bySubCat[cid] || {};
      const entries = Object.entries(subMap).sort((a,b)=>b[1]-a[1]);
      const chips = entries.map(([subId,val])=>{
        const subName = subId==='__none__' ? 'Sem subcategoria' : ((c.subcategories||[]).find(s=>s.id===subId)||{}).name || 'Subcategoria removida';
        const toggleable = subId!=='__none__';
        const isOff = toggleable && disabledSubcats.has(subId);
        const style = isOff ? '' : `background:${c.color}1F; border-color:${c.color}80; color:${c.color};`;
        return `<button type="button" class="subcat-chip ${isOff?'off':''}" ${toggleable?`data-subcat-toggle="${subId}"`:'style="cursor:default;"'} style="${style}">${escapeHtml(subName)} <span class="mono">${fmt(val)}</span></button>`;
      }).join('');
      return `<div class="subcat-chips">${chips}</div>`;
    }

    // Rosca de "Despesas por categoria": cada fatia é clicável (mesmo toggle
    // do chevron da lista) e mostra o nome + valor da categoria selecionada
    // no centro, ou o total gasto no mês quando nada está selecionado.
    function categoryDonutSvg(entries, total, expandedId){
      if(total<=0 || entries.length===0) return '';
      const cx=50, cy=50, rOuter=45, rInner=29;
      function polar(r, angleDeg){
        const rad=(angleDeg-90)*Math.PI/180;
        return [cx+r*Math.cos(rad), cy+r*Math.sin(rad)];
      }
      function slicePath(rO, rI, a0, a1){
        const [x1,y1]=polar(rO,a1), [x2,y2]=polar(rO,a0), [x3,y3]=polar(rI,a0), [x4,y4]=polar(rI,a1);
        const large = (a1-a0) > 180 ? 1 : 0;
        return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${rO} ${rO} 0 ${large} 0 ${x2.toFixed(2)} ${y2.toFixed(2)} L${x3.toFixed(2)} ${y3.toFixed(2)} A${rI} ${rI} 0 ${large} 1 ${x4.toFixed(2)} ${y4.toFixed(2)} Z`;
      }
      let angle=0;
      const labelParts = [];
      const badgeParts = [];
      const slices = entries.map(([cid,val])=>{
        const c = catById(cid);
        const pct = val/total*100;
        const sweep = Math.max(pct/100*360, 0.4);
        const a0=angle, a1=Math.min(angle+sweep,360);
        angle=a1;
        const isExpanded = expandedId===cid;
        const rO = isExpanded ? rOuter+3 : rOuter;
        const color = c ? c.color : '#999';
        const d = (a1-a0)>=359.9
          ? `${slicePath(rO,rInner,0,180)} ${slicePath(rO,rInner,180,360)}`
          : slicePath(rO, rInner, a0, a1);
        const dim = expandedId && !isExpanded ? 'opacity:0.4;' : '';
        if(pct>=6){
          const [lx,ly] = polar((rO+rInner)/2, (a0+a1)/2);
          labelParts.push(`<text x="${lx.toFixed(2)}" y="${ly.toFixed(2)}" font-size="7.2" font-weight="400" fill="#fff" text-anchor="middle" dominant-baseline="middle" font-family="Inter, sans-serif" style="pointer-events:none; opacity:${expandedId && !isExpanded ? 0.5 : 1};">${pct.toFixed(0)}%</text>`);
        }
        // Categoria com orçamento próprio definido e estourado este mês —
        // sinaliza com o ícone da categoria + bolinha vermelha, colocado do
        // lado de fora da rosca (não sobrepõe o % nem o resto da fatia), e
        // a linha que contorna essa fatia fica vermelha também.
        const catBudget = (state.budgets && c) ? (state.budgets[c.id]||0) : 0;
        const overBudget = catBudget>0 && val>catBudget;
        if(overBudget){
          const midA = (a0+a1)/2;
          const [ex,ey] = polar(rOuter, midA);
          const [bx,by] = polar(rOuter+11, midA);
          badgeParts.push(`<g style="pointer-events:none;">
            <line x1="${ex.toFixed(2)}" y1="${ey.toFixed(2)}" x2="${bx.toFixed(2)}" y2="${by.toFixed(2)}" stroke="var(--rust)" stroke-width="0.8"></line>
            ${donutOverBudgetBadgeSvg(bx, by, c.icon, '💰', color)}
          </g>`);
        }
        const strokeColor = overBudget ? 'var(--rust)' : 'var(--paper-card)';
        const strokeW = overBudget ? 2.4 : 1.8;
        return `<path d="${d}" fill="${color}" data-toggle-cat="${cid}" style="cursor:pointer; stroke:${strokeColor}; stroke-width:${strokeW}; stroke-linejoin:round;${dim}"><title>${escapeHtml(c?c.name:'Outros')} · ${pct.toFixed(0)}%</title></path>`;
      }).join('') + labelParts.join('') + badgeParts.join('');
      const expandedEntry = expandedId ? entries.find(([cid])=>cid===expandedId) : null;
      const centerCat = expandedEntry ? catById(expandedEntry[0]) : null;
      const centerLabel = centerCat ? centerCat.name : 'Total gasto';
      const centerValue = expandedEntry ? fmt(expandedEntry[1]) : fmt(total);
      return `<div class="cat-donut-wrap">
        <svg viewBox="-16 -16 132 132" class="cat-donut-svg">${slices}</svg>
        <div class="cat-donut-center">
          <div class="cat-donut-center-label">${escapeHtml(centerLabel)}</div>
          <div class="cat-donut-center-value mono">${centerValue}</div>
        </div>
      </div>`;
    }

    // Rosca de alocação (grupos + poupança) — mesmo estilo da rosca de
    // categorias: fatias com bordas divisórias, clique destaca a fatia e
    // mostra nome + valor no centro. incomeGoal>0 habilita o sinal de "fora
    // da meta" (ícone do grupo + bolinha vermelha) quando o grupo estoura
    // sua meta de % da receita.
    function allocationDonutSvg(items, total, expandedId, defaultLabel, incomeGoal){
      if(total<=0 || items.length===0) return '';
      const cx=50, cy=50, rOuter=45, rInner=29;
      function polar(r, angleDeg){
        const rad=(angleDeg-90)*Math.PI/180;
        return [cx+r*Math.cos(rad), cy+r*Math.sin(rad)];
      }
      function slicePath(rO, rI, a0, a1){
        const [x1,y1]=polar(rO,a1), [x2,y2]=polar(rO,a0), [x3,y3]=polar(rI,a0), [x4,y4]=polar(rI,a1);
        const large = (a1-a0) > 180 ? 1 : 0;
        return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${rO} ${rO} 0 ${large} 0 ${x2.toFixed(2)} ${y2.toFixed(2)} L${x3.toFixed(2)} ${y3.toFixed(2)} A${rI} ${rI} 0 ${large} 1 ${x4.toFixed(2)} ${y4.toFixed(2)} Z`;
      }
      let angle=0;
      const labelParts2 = [];
      const badgeParts2 = [];
      const slices = items.map(it=>{
        const pct = it.value/total*100;
        const sweep = Math.max(pct/100*360, 0.4);
        const a0=angle, a1=Math.min(angle+sweep,360);
        angle=a1;
        const isExpanded = expandedId===it.id;
        const rO = isExpanded ? rOuter+3 : rOuter;
        const d = (a1-a0)>=359.9
          ? `${slicePath(rO,rInner,0,180)} ${slicePath(rO,rInner,180,360)}`
          : slicePath(rO, rInner, a0, a1);
        const dim = expandedId && !isExpanded ? 'opacity:0.4;' : '';
        if(pct>=6){
          const [lx,ly] = polar((rO+rInner)/2, (a0+a1)/2);
          labelParts2.push(`<text x="${lx.toFixed(2)}" y="${ly.toFixed(2)}" font-size="7.2" font-weight="400" fill="#fff" text-anchor="middle" dominant-baseline="middle" font-family="Inter, sans-serif" style="pointer-events:none; opacity:${expandedId && !isExpanded ? 0.5 : 1};">${pct.toFixed(0)}%</text>`);
        }
        // Grupo com meta definida e estourada este mês — ícone do grupo +
        // bolinha vermelha, colocado do lado de fora da rosca, e a linha
        // que contorna a fatia fica vermelha. A "Poupança" (id 'savings')
        // nunca tem meta, é ignorada.
        let overBudget = false;
        if(it.id && it.id.startsWith('g:') && incomeGoal>0){
          const gid = it.id.slice(2);
          const goalPct = (state.groupBudgets && state.groupBudgets[gid]) || 0;
          const budgetAmount = incomeGoal * (goalPct/100);
          overBudget = goalPct>0 && it.value>budgetAmount;
        }
        if(overBudget){
          const midA = (a0+a1)/2;
          const [ex,ey] = polar(rOuter, midA);
          const [bx,by] = polar(rOuter+11, midA);
          badgeParts2.push(`<g style="pointer-events:none;">
            <line x1="${ex.toFixed(2)}" y1="${ey.toFixed(2)}" x2="${bx.toFixed(2)}" y2="${by.toFixed(2)}" stroke="var(--rust)" stroke-width="0.8"></line>
            ${donutOverBudgetBadgeSvg(bx, by, it.icon, '📁', it.color)}
          </g>`);
        }
        const strokeColor2 = overBudget ? 'var(--rust)' : 'var(--paper-card)';
        const strokeW2 = overBudget ? 2.4 : 1.8;
        return `<path d="${d}" fill="${it.color}" data-toggle-alloc="${it.id}" style="cursor:pointer; stroke:${strokeColor2}; stroke-width:${strokeW2}; stroke-linejoin:round;${dim}"><title>${escapeHtml(it.name)} · ${pct.toFixed(0)}%</title></path>`;
      }).join('') + labelParts2.join('') + badgeParts2.join('');
      const expandedItem = expandedId ? items.find(it=>it.id===expandedId) : null;
      const centerLabel = expandedItem ? expandedItem.name : (defaultLabel||'Total gasto');
      const centerValue = expandedItem ? fmt(expandedItem.value) : fmt(total);
      return `<div class="cat-donut-wrap">
        <svg viewBox="-16 -16 132 132" class="cat-donut-svg">${slices}</svg>
        <div class="cat-donut-center">
          <div class="cat-donut-center-label">${escapeHtml(centerLabel)}</div>
          <div class="cat-donut-center-value mono">${centerValue}</div>
        </div>
      </div>`;
    }

    const catEntriesSorted = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
    const totalExpenseAbs = Math.abs(expense);
    const catRows = catEntriesSorted.map(([cid, val])=>{
      const c = catById(cid);
      const hasSubs = !!(c && c.subcategories && c.subcategories.length>0);
      const expanded = expandedDashboardCat===cid;
      const chev = hasSubs ? `<span class="chev ${expanded?'open':''}" data-toggle-cat="${cid}" title="Ver subcategorias aqui">›</span>` : '';
      const pct = totalExpenseAbs>0 ? (val/totalExpenseAbs*100) : 0;
      const catBudgetRow = (state.budgets && c) ? (state.budgets[c.id]||0) : 0;
      const overBudgetRow = catBudgetRow>0 && val>catBudgetRow;
      return `<div class="rank-item">
        <div class="rank-row clickable ${expanded?'rank-row-active':''}" data-goto-analysis="${cid}" title="Ver detalhes">
          <span class="rank-name">${chev}${categoryBadgeHtml(c?c.icon:null, c?c.color:'#999', '💰')}${c?c.name:'Outros'}</span>
          <span class="rank-value"><span class="rank-pct">${pct.toFixed(0)}%</span> <span class="mono" style="${overBudgetRow?'color:var(--rust);':''}">${fmt(val)}</span></span>
        </div>
        ${expanded ? subBreakdownHtml(cid, c) : ''}
      </div>`;
    }).join('') || `<div class="empty-state">Nenhuma despesa lançada neste mês ainda.</div>`;
    const catDonut = categoryDonutSvg(catEntriesSorted, totalExpenseAbs, expandedDashboardCat);

    const todayStrDD = new Date().toISOString().slice(0,10);
    const byGroup = {};
    const byGroupUntilToday = {};
    const reimbByGroupD = {};
    const reimbIdsDD = reimbCategoryIds();
    monthTx.filter(t=>t.type==='expense').forEach(t=>{
      if(t.subcategoryId && disabledSubcats.has(t.subcategoryId)) return;
      const c = catById(t.categoryId);
      const gid = c ? c.groupId : null;
      if(!gid) return;
      // Reembolso é despesa real (aparece no total do mês, no extrato, na
      // lista de categorias), mas não conta pro % da meta do grupo nem pra
      // rosca de alocação — é dinheiro de passagem, não seu gasto de fato.
      if(isReimbTx(t, reimbIdsDD)){
        reimbByGroupD[gid] = (reimbByGroupD[gid]||0) + (-t.amount);
        return;
      }
      byGroup[gid] = (byGroup[gid]||0) + (-t.amount);
      // "Média até hoje" só deve considerar o que já foi gasto até a data de
      // hoje — não o mês inteiro (que pode incluir lançamentos futuros já
      // cadastrados, como parcelas de cartão de dias que ainda não chegaram).
      if(t.date <= todayStrDD) byGroupUntilToday[gid] = (byGroupUntilToday[gid]||0) + (-t.amount);
    });
    const incomeGoalD = state.incomeGoal || 0;
    if(!state.groupDailyGoals) state.groupDailyGoals = {};
    const daysInMonthDD = new Date(currentYear, currentMonth+1, 0).getDate();
    const todayForElapsedDD = new Date();
    const selMonthKeyDD = currentYear*12 + currentMonth;
    const nowMonthKeyDD = todayForElapsedDD.getFullYear()*12 + todayForElapsedDD.getMonth();
    const daysElapsedDD = selMonthKeyDD < nowMonthKeyDD ? daysInMonthDD : (selMonthKeyDD === nowMonthKeyDD ? todayForElapsedDD.getDate() : 0);
    // Inclui também grupos cujo único gasto no mês foi reembolso — assim o
    // cartão do grupo continua aparecendo (com R$0 de meta consumida) e o
    // lembrete de reembolso fica visível.
    const allGroupIdsD = new Set([...Object.keys(byGroup), ...Object.keys(reimbByGroupD)]);
    allGroupIdsD.forEach(gid=>{ if(!(gid in byGroup)) byGroup[gid] = 0; });
    const byGroupSorted = Object.entries(byGroup).sort((a,b)=>b[1]-a[1]);

    // Poupança do mês = receitas menos despesas. Não é um grupo de verdade
    // (não tem categorias nem meta), é só informativo — mostra visualmente
    // quanto sobrou, junto dos grupos, tanto na barra de alocação quanto
    // como um cartão no fim da lista. Só entra na conta quando há receita
    // registrada no mês e o resultado é positivo (sobrou algo pra guardar).
    // Base de cálculo do percentual de participação de cada grupo — a MESMA
    // em todo o painel (rosca + cartões) e também na aba Dashboard, que já
    // usa a meta de receita (state.incomeGoal) como base pro "Realizado %"
    // de cada grupo. Prioridade: meta de receita (bate com a aba Dashboard)
    // → receita real do mês (quando não há meta mas há receita, pra caber a
    // poupança) → total gasto (sem nenhuma receita configurada).
    const canShowSavings = income>0 && savings>0;
    const allocBase = incomeGoalD>0 ? incomeGoalD : (canShowSavings ? income : totalExpenseAbs);
    const allocBaseLabel = incomeGoalD>0 ? 'da meta de receita' : (canShowSavings ? 'da receita do mês' : 'das despesas');
    const SAVINGS_COLOR = '#1F6E4A';

    // Rosca de alocação: uma fatia colorida por grupo (+ poupança quando
    // aplicável), proporcional ao que cada um representa da receita do mês —
    // ou do total gasto, se não houver receita pra comparar.
    const allocItems = byGroupSorted.map(([gid,val])=>{
      const g = groupById(gid);
      return { id: 'g:'+gid, name: g?g.name:'Sem grupo', color: g?g.color:'#999', value: val, icon: g?g.icon:null };
    });
    if(canShowSavings){
      allocItems.push({ id: 'savings', name: 'Poupança', color: SAVINGS_COLOR, value: savings });
    }
    const allocationBar = `<div class="alloc-block">
      <div class="alloc-head"><span>Total gasto no mês</span><span class="mono">${fmt(totalExpenseAbs)}</span></div>
      <div class="alloc-sub">${canShowSavings ? 'Alocação da receita do mês — grupos + poupança' : 'Alocação por grupo'}</div>
      ${allocationDonutSvg(allocItems, allocBase, expandedDashboardAlloc, incomeGoalD>0 ? 'Meta de receita' : (canShowSavings ? 'Receita do mês' : 'Total gasto'), incomeGoalD)}
    </div>`;


    // Cartão informativo da poupança — sem meta nem barra de orçamento
    // (não é um grupo de despesa de verdade), só mostra o valor que sobrou.
    const savingsCard = canShowSavings ? `<div class="group-budget-card savings-card">
      <div class="gbc-header">
        <div class="gbc-header-left">
          <div class="gbc-icon-wrap"><span class="swatch icon-swatch" style="background:${SAVINGS_COLOR};">${categoryIconSvg('💰')||'💰'}</span></div>
          <div>
            <div class="gbc-title">Poupança</div>
            <div class="gbc-subtitle">${(savings/income*100).toFixed(0)}% da receita do mês</div>
          </div>
        </div>
        <div class="gbc-header-right">
          <div class="gbc-amount mono" style="color:${SAVINGS_COLOR};">${fmt(savings)}</div>
          <div class="gbc-target">sobrou este mês</div>
        </div>
      </div>
    </div>` : '';

    // Linha de roscas duplas, uma por grupo, logo abaixo da rosca de
    // alocação — resumo visual rápido: anel externo = meta mensal x
    // consumido, anel interno = meta diária x média até hoje (quando existe).
    const groupRingsRowHtml = byGroupSorted.map(([gid,val])=>{
      const g = groupById(gid);
      if(!g) return '';
      const goalPctS = state.groupBudgets[gid] || 0;
      const budgetAmountS = incomeGoalD>0 ? (incomeGoalD*goalPctS/100) : 0;
      if(!(goalPctS>0 && budgetAmountS>0)) return '';
      const valUntilTodayS = byGroupUntilToday[gid] || 0;
      const avgUntilTodayS = daysElapsedDD>0 ? valUntilTodayS/daysElapsedDD : 0;
      const manualDailyGoalS = state.groupDailyGoals[gid] || 0;
      const autoDailyGoalS = daysInMonthDD>0 ? (budgetAmountS/daysInMonthDD) : 0;
      const dailyGoalS = manualDailyGoalS>0 ? manualDailyGoalS : autoDailyGoalS;
      const hasDailyS = dailyGoalS>0 && daysElapsedDD>0;
      return groupDualRingSvg(g, val, budgetAmountS, hasDailyS ? avgUntilTodayS : null, hasDailyS ? dailyGoalS : null);
    }).filter(Boolean).join('');

    const groupRows = byGroupSorted.map(([gid,val])=>{
      const g = groupById(gid);
      const reimbAmtD = reimbByGroupD[gid] || 0;
      const goalPctD = state.groupBudgets[gid] || 0;
      const budgetAmount = incomeGoalD>0 ? (incomeGoalD*goalPctD/100) : 0;
      const hasBudget = goalPctD>0 && budgetAmount>0;
      const overD = hasBudget && val>budgetAmount;
      const barPctD = hasBudget ? Math.min(100, (val/budgetAmount*100)) : 0;
      const participationPct = allocBase>0 ? (val/allocBase*100) : 0;
      // Meta diária automática (mesma lógica da aba Análise): meta do grupo
      // (budgetAmount) dividida pelos dias do mês inteiro. Uma meta diária
      // definida manualmente em state.groupDailyGoals continua tendo
      // prioridade — o campo de edição já vem preenchido com o valor
      // automático como ponto de partida.
      const manualDailyGoalD = state.groupDailyGoals[gid] || 0;
      const autoDailyGoalD = (hasBudget && daysInMonthDD>0) ? (budgetAmount/daysInMonthDD) : 0;
      const dailyGoalD = manualDailyGoalD>0 ? manualDailyGoalD : autoDailyGoalD;
      const dailyGoalIsAutoD = !(manualDailyGoalD>0) && autoDailyGoalD>0;
      const dailyGoalEditRawValueD = manualDailyGoalD>0 ? manualDailyGoalD : (autoDailyGoalD>0 ? Math.round(autoDailyGoalD*100)/100 : '');
      // Duas médias, pra todos os grupos igualmente: "Média até hoje" é o
      // ritmo real — só o que já foi gasto até a data de hoje (não o mês
      // inteiro, que pode incluir lançamentos futuros já cadastrados) ÷
      // dias já passados (ex.: gastou 200 até o dia 2, média até hoje é
      // 100); "Média mês" projeta o total do mês inteiro dividido pelos
      // dias inteiros do mês (ex.: 80/31 = 2,58). O ritmo (badge,
      // dias-pra-zerar) usa sempre a média até hoje, que é a mais precisa.
      const valUntilToday = byGroupUntilToday[gid] || 0;
      const avgUntilTodayD = daysElapsedDD>0 ? valUntilToday/daysElapsedDD : 0;
      const avgPerMonthD = daysInMonthDD>0 ? val/daysInMonthDD : 0;
      const dailyOverD = dailyGoalD>0 && avgUntilTodayD>dailyGoalD;
      const dailyDiff = Math.abs(dailyGoalD-avgUntilTodayD);
      const dailyEditTagD = miniTagHtml('groupDailyGoal:'+gid, dailyGoalD>0 ? `meta diária ${fmt(dailyGoalD)} ✎` : '+ meta diária', dailyGoalEditRawValueD, '0,00', !manualDailyGoalD && autoDailyGoalD===0);
      const dailyGoalStatD = statEditValueHtml('groupDailyGoal:'+gid, dailyGoalD>0 ? fmt(dailyGoalD) : 'Definir', dailyGoalEditRawValueD, '0,00', !manualDailyGoalD && autoDailyGoalD===0);

      const elapsedFrac = daysInMonthDD>0 ? Math.min(1, daysElapsedDD/daysInMonthDD) : 0;
      const dots = Array.from({length:10},(_,i)=> `<span class="gbc-dot ${i < Math.round(elapsedFrac*10) ? 'filled':''}"></span>`).join('');

      let paceOver=null, paceLabel='', paceMsg='';
      // Quando o ritmo diário está acima da meta, calcula quantos dias com
      // gasto zero (a partir de agora) seriam necessários pra trazer a
      // média de volta pra dentro da meta diária. Usa daysElapsedDD (a
      // mesma base da "Média até hoje" acima), pra ficar coerente com o
      // número mostrado.
      let daysToZeroD = null, daysToZeroImpossibleD = false;
      if(dailyGoalD>0 && dailyOverD){
        const neededExtraDaysD = Math.ceil((valUntilToday/dailyGoalD) - daysElapsedDD);
        if(neededExtraDaysD > 0){
          const remainingDaysD = Math.max(0, daysInMonthDD - daysElapsedDD);
          daysToZeroD = neededExtraDaysD;
          daysToZeroImpossibleD = neededExtraDaysD > remainingDaysD;
        }
      }
      if(dailyGoalD>0){
        paceOver = dailyOverD;
        paceLabel = dailyOverD ? 'Acima do ritmo' : 'Abaixo do ritmo';
        paceMsg = `${fmt(dailyDiff)} ${dailyOverD?'acima':'abaixo'} da meta diária`;
      } else if(hasBudget){
        const projected = avgUntilTodayD*daysInMonthDD;
        paceOver = projected>budgetAmount;
        paceLabel = paceOver ? 'Acima do ritmo' : 'Abaixo do ritmo';
        paceMsg = paceOver ? 'No ritmo atual, vai passar da meta' : 'Você está no caminho certo!';
      }

      // Resumo compacto pro card de Ritmo: mesma informação (quanto a média
      // está fora da meta, dias pra recuperar, % consumido e o que sobra ou
      // já estourou) mas numa linha só, com separador "·", pra ocupar bem
      // menos espaço que a explicação corrida.
      let ritmoCompactD = '';
      if(dailyGoalD>0 && daysElapsedDD>0){
        const partsD = [`${fmt(dailyDiff)} ${dailyOverD?'acima':'abaixo'} da meta${dailyGoalIsAutoD?' automática':''}`];
        if(dailyOverD && daysToZeroD){
          partsD.push(daysToZeroImpossibleD ? 'não dá mais pra recuperar este mês' : `${daysToZeroD} dia${daysToZeroD>1?'s':''} p/ recuperar`);
        }
        ritmoCompactD = partsD.join(' · ');
      } else if(paceMsg){
        ritmoCompactD = paceMsg;
      }
      if(hasBudget){
        const rawPctD = budgetAmount>0 ? (val/budgetAmount*100) : 0;
        const remainingD = budgetAmount-val;
        ritmoCompactD += (ritmoCompactD?' · ':'') + `${rawPctD.toFixed(0)}% consumido` + (remainingD>=0 ? ` · restam ${fmt(remainingD)}` : ` · estourou ${fmt(Math.abs(remainingD))}`);
      }

      // Quanto ainda pode ser gasto HOJE sem comprometer a meta diária
      // AUTOMÁTICA (autoDailyGoalD — sempre a automática, mesmo se houver
      // uma meta diária manual sobrescrevendo o campo acima). Compara o
      // que já foi gasto até hoje (valUntilToday, que já inclui os gastos
      // de hoje) com o que a meta automática permitiria ter acumulado até
      // agora (autoDailyGoalD × dias decorridos). A diferença é o quanto
      // ainda cabe gastar hoje sem tirar o dia seguinte da mesma média
      // automática; se já foi ultrapassada, mostra o quanto passou.
      let availableTodayD = null;
      if(autoDailyGoalD>0 && daysElapsedDD>0){
        availableTodayD = (autoDailyGoalD*daysElapsedDD) - valUntilToday;
      }

      const barSection = hasBudget ? `
        <div class="gbc-bar-wrap">
          <div class="gbc-bar-top">
            <span class="gbc-bar-pct" style="color:${overD?'var(--rust)':'var(--forest)'};">${barPctD.toFixed(0)}% utilizado</span>
          </div>
          <div class="gbc-bar-track">
            <div class="gbc-bar-fill" style="width:${barPctD}%; background:${overD?'var(--rust)':'var(--forest)'};"></div>
            <div class="gbc-bar-bubble" style="left:${Math.min(92,Math.max(8,barPctD))}%; color:${overD?'var(--rust)':'var(--forest)'};">${fmt(val)}</div>
          </div>
          <div class="gbc-bar-scale"><span>R$ 0</span><span>${fmt(budgetAmount)}</span></div>
        </div>
        <div class="gbc-stats">
          <div class="gbc-stat">
            <div class="gbc-stat-label">Restante</div>
            <div class="gbc-stat-value mono" style="color:${(budgetAmount-val)<0?'var(--rust)':'var(--ink)'};">${fmt(budgetAmount-val)}</div>
          </div>
          <div class="gbc-stat">
            <div class="gbc-stat-label">Média até hoje</div>
            <div class="gbc-stat-value mono" style="color:${paceOver===null?'var(--ink)':paceOver?'var(--rust)':'var(--forest)'};">${daysElapsedDD>0 ? fmt(avgUntilTodayD) : '—'}</div>
          </div>
          <div class="gbc-stat">
            <div class="gbc-stat-label">Média mês</div>
            <div class="gbc-stat-value mono">${fmt(avgPerMonthD)}</div>
          </div>
          <div class="gbc-stat">
            <div class="gbc-stat-label">Meta diária</div>
            ${dailyGoalStatD}
            ${dailyGoalIsAutoD ? `<div class="gbc-stat-sub">Automática (meta ÷ ${daysInMonthDD} dias)</div>` : (manualDailyGoalD>0 ? `<div class="gbc-stat-sub">Definida manualmente</div>` : '')}
          </div>
          <div class="gbc-stat">
            <div class="gbc-stat-label">Dia do mês</div>
            <div class="gbc-stat-value">${daysElapsedDD} de ${daysInMonthDD}</div>
            <div class="gbc-dots-row">${dots}</div>
          </div>
          ${paceOver!==null ? `<div class="gbc-stat" style="grid-column: 1 / -1;">
            <div class="gbc-stat-label">Ritmo</div>
            <div class="gbc-pace-badge ${paceOver?'over':'under'}">${paceLabel}</div>
            <div class="gbc-stat-sub" style="margin-top:4px;">${ritmoCompactD}</div>
            ${availableTodayD!==null ? `<div class="gbc-stat-sub" style="margin-top:6px; color:${availableTodayD>=0?'var(--forest)':'var(--rust)'}; font-weight:600;">${availableTodayD>=0 ? `Pode gastar até ${fmt(availableTodayD)} hoje sem sair dos ${fmt(autoDailyGoalD)}/dia da meta automática` : `Já passou ${fmt(Math.abs(availableTodayD))} da meta automática de ${fmt(autoDailyGoalD)}/dia`}</div>` : ''}
          </div>` : ''}
          <div class="gbc-stat">
            <div class="gbc-stat-label">Participação</div>
            <div class="gbc-stat-value">${participationPct.toFixed(1)}%</div>
            <div class="gbc-stat-sub">${allocBaseLabel}</div>
          </div>
        </div>` : `<div class="gbc-nogoal">
          <span class="gbc-nogoal-note">Sem meta mensal definida · defina em Dashboard → Metas por grupo</span>
          ${dailyEditTagD}
        </div>`;

      return `<div class="group-budget-card">
        <div class="gbc-header">
          <div class="gbc-header-left clickable" data-goto-analysis-group="${gid}" title="Ver detalhes">
            <div class="gbc-icon-wrap">${categoryBadgeHtml(g?g.icon:null, g?g.color:'#999', '📁')}</div>
            <div>
              <div class="gbc-title">${g?escapeHtml(g.name):'Sem grupo'}</div>
              <div class="gbc-subtitle">${participationPct.toFixed(0)}% ${allocBaseLabel}</div>
            </div>
          </div>
          <div class="gbc-header-right">
            <div class="gbc-amount mono">${fmt(val)}</div>
            ${hasBudget ? `<div class="gbc-target">de ${fmt(budgetAmount)}</div>` : ''}
          </div>
        </div>
        ${barSection}
        ${reimbAmtD>0 ? `<div class="gbc-nogoal-note" style="margin-top:8px;">↩️ + ${fmt(reimbAmtD)} em reembolso — o valor total das despesas neste grupo é ${fmt(val+reimbAmtD)}</div>` : ''}
      </div>`;
    }).join('') || `<div class="empty-state">Nenhuma despesa lançada neste mês ainda.</div>`;
    const groupRowsWithSavings = groupRows + savingsCard;


    const recent = [...monthTx].sort((a,b)=> b.date.localeCompare(a.date)).slice(0,7);
    const recentRows = recent.map(rowHtml).join('') || `<div class="empty-state"><div class="display">Tudo em branco por aqui</div>Lance sua primeira transação do mês.</div>`;

    // Pendências do mês (despesas de cartão ficam de fora — elas têm fluxo
    // próprio via fatura, já coberto na seção de cartões).
    const pendingExpenses = monthTx.filter(t=>{
      if(t.type!=='expense' || t.paid!==false) return false;
      const acc = accById(t.accountId);
      return !(acc && acc.type==='Crédito');
    });
    const pendingExpenseTotal = pendingExpenses.reduce((s,t)=>s+Math.abs(t.amount),0);
    const pendingIncome = monthTx.filter(t=>t.type==='income' && t.paid===false);
    const pendingIncomeTotal = pendingIncome.reduce((s,t)=>s+t.amount,0);

    const accRows = state.accounts.filter(a=>!a.archived && a.type!=='Crédito').map(a=>{
      const bal = computeAccountBalance(a.id);
      return `<div class="acc-mini-row" data-edit-acc="${a.id}">
        ${bankLogoHtml(a)}
        <div style="flex:1;">
          <div style="font-weight:600;color:var(--ink);font-size:13px;">${escapeHtml(a.name)}</div>
          <div class="meta">${a.type}${dueInfoText(a)}</div>
        </div>
        <div class="mono" style="font-weight:600;color:${bal>=0?'var(--forest)':'var(--rust)'}">${fmt(bal)}</div>
      </div>`;
    }).join('') || `<div class="empty-state">Nenhuma conta cadastrada.</div>`;
    const accountsTotal = state.accounts.filter(a=>!a.archived && a.type!=='Crédito').reduce((s,a)=>s+computeAccountBalance(a.id),0);

    // ---- Reembolsos do mês: qualquer transação na categoria "Reembolso"
    // (despesa ou a receita quando o dinheiro volta) fica de fora das
    // metas, mas ganha visibilidade própria aqui no Painel. A visão anual
    // (mês a mês) mora na aba Dashboard.
    const reimbIdsD = reimbCategoryIds();
    const reimbOutMonth = monthTx.filter(t=>isReimbTx(t, reimbIdsD) && t.type==='expense').reduce((s,t)=>s+(-t.amount),0);
    const reimbInMonth = monthTx.filter(t=>isReimbTx(t, reimbIdsD) && t.type==='income').reduce((s,t)=>s+t.amount,0);
    const reimbPendingMonth = Math.max(0, reimbOutMonth - reimbInMonth);
    const reimbHasCategory = reimbIdsD.expenseId!==null || reimbIdsD.incomeId!==null;


    // Gráfico "Gasto por dia" — mesmo componente usado na aba Análise, aqui
    // sem nenhum filtro (todas as despesas do mês inteiro), pra dar uma visão
    // geral do ritmo de gastos direto no painel.
    const dashDailyTotals = new Array(daysInMonthDD+1).fill(0);
    monthTx.filter(t=>t.type==='expense').forEach(t=>{
      const day = new Date((t.purchaseDate||t.date)+'T00:00:00').getDate();
      dashDailyTotals[day] = (dashDailyTotals[day]||0) + (-t.amount);
    });
    const dashTotalPctAllGroups = (state.groups||[]).filter(g=>g.type==='expense').reduce((s,g)=>s+(state.groupBudgets[g.id]||0),0);

  function rowHtml(t){
    const dateFmt = new Date(t.date+'T00:00:00').toLocaleDateString('pt-BR', {day:'2-digit', month:'short'});
    if(t.type==='transfer'){
      const from = accById(t.fromAccountId);
      const to = accById(t.toAccountId);
      return `<div class="ledger-row" data-id="${t.id}">
        <div class="cat-stamp" style="background:var(--brass)"></div>
        <div>
          <div class="desc">${escapeHtml(t.desc || 'Transferência')}</div>
          <div class="meta">${from?from.name:'?'} → ${to?to.name:'?'}</div>
        </div>
        <div class="amount mono" style="color:var(--ink);">${fmt(t.amount)}</div>
        <div class="date">${dateFmt}</div>
        <div class="row-actions">
          <button class="icon-btn edit-tx" title="Editar">✎</button>
          <button class="icon-btn del-tx" title="Excluir">✕</button>
        </div>
      </div>`;
    }
    const c = catById(t.categoryId);
    const a = accById(t.accountId);
    const sub = c && t.subcategoryId ? (c.subcategories||[]).find(s=>s.id===t.subcategoryId) : null;
    const isCardExpense = t.type==='expense' && a && a.type==='Crédito';
    // Numa despesa de cartão, valor gravado positivo = estorno/desconto
    // (o usuário digitou negativo no formulário, que abate a fatura).
    const isCardCredit = isCardExpense && t.amount>0;
    const badge = isCardCredit ? `<span class="tag" style="color:var(--ok, #1F6E4A); border-color:var(--ok, #1F6E4A);">Estorno/desconto</span>`
      : t.recurrenceType==='installment' ? `<span class="tag">${t.installmentIndex}/${t.installmentTotal}</span>`
      : t.recurrenceType==='period' ? `<span class="tag">${t.installmentIndex}/${t.installmentTotal}</span>`
      : t.recurrenceType==='fixed' ? `<span class="tag">Fixa</span>` : '';
    const paidLabel = t.type==='income' ? (t.paid?'✓ Recebido':'○ A receber') : (t.paid?'✓ Pago':'○ Pendente');
    const payPill = t.paid!==undefined
      ? (isCardExpense
          ? `<span class="paid-pill ${t.paid?'paid':'pending'} readonly" title="Pago junto com a fatura do cartão">${paidLabel}</span>`
          : `<button class="paid-pill ${t.paid?'paid':'pending'}" data-toggle-paid="${t.id}">${paidLabel}</button>`)
      : '';
    const showsAsPositive = t.type==='income' || isCardCredit;
    return `<div class="ledger-row" data-id="${t.id}">
      ${categoryBadgeHtml(c?c.icon:null, c?c.color:'#888', '💰')}
      <div>
        <div class="desc">${escapeHtml(t.desc)}${badge}</div>
        <div class="meta">${c?c.name:'Sem categoria'}${sub?' › '+escapeHtml(sub.name):''} · ${a?a.name:''}${t.purchaseDate?` · compra em ${new Date(t.purchaseDate+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}`:''}${payPill}${(t.tags&&t.tags.length)?t.tags.map(tg=>`<span class="tx-tag-chip">#${escapeHtml(tg)}</span>`).join(''):''}</div>
      </div>
      <div class="amount ${showsAsPositive?'pos':'neg'} mono">${showsAsPositive?'+':''}${fmt(t.amount)}</div>
      <div class="date">${dateFmt}</div>
      <div class="row-actions">
        <button class="icon-btn edit-tx" title="Editar">✎</button>
        <button class="icon-btn del-tx" title="Excluir">✕</button>
      </div>
    </div>`;
  }

  function bindLedgerRowActions(){
    mainEl.querySelectorAll('.ledger-row').forEach(row=>{
      const id = row.dataset.id;

      if(delBtn) delBtn.onclick = async (e)=>{
        e.stopPropagation();

        await saveState(); render();
      };

        await saveState(); render();

  // ---------- SELEÇÃO MÚLTIPLA (filtros) ----------
  // Componente compacto: um botão com resumo ("Todos", "2 selecionados"...)
  // que abre um painel com checkboxes. Usado nos filtros de Análise/Transações.
  // mselOpenId guarda qual painel está aberto no momento (id do container).
  // Como toda mudança de filtro dispara um re-render da página inteira (o
  // innerHTML é recriado do zero), sem isso o painel fechava sozinho a cada
  // clique em um checkbox — obrigando reabrir toda vez. Guardando o id aqui
  // e reabrindo logo depois do bind, o painel continua aberto durante toda
  // a sequência de cliques, e só fecha quando a pessoa clica fora dele.
  let mselOpenId = null;
  function multiSelectHtml(id, allLabel, options, selectedSet){
    const count = selectedSet.size;
    const summary = count===0 ? allLabel
      : count===1 ? (options.find(o=>o.value===[...selectedSet][0])||{}).label || '1 selecionado'
      : `${count} selecionados`;
    return `
      <div class="msel" id="${id}">
        <button type="button" class="msel-btn">${escapeHtml(summary)}<span class="msel-caret">▾</span></button>
        <div class="msel-panel">
          <label class="msel-opt msel-all"><input type="checkbox" data-msel-all ${count===0?'checked':''}><span>${escapeHtml(allLabel)}</span></label>
          <div class="msel-divider"></div>
          ${options.map(o=>`<label class="msel-opt"><input type="checkbox" value="${o.value}" ${selectedSet.has(o.value)?'checked':''}><span class="msel-opt-content">${o.icon||''}${escapeHtml(o.label)}</span></label>`).join('') || '<div class="msel-empty">Nada pra escolher aqui.</div>'}
        </div>
      </div>`;
  }
  function bindMultiSelect(id, selectedSet, onChange){
    const container = document.getElementById(id);
    if(!container) return;
    const btn = container.querySelector('.msel-btn');
    const panel = container.querySelector('.msel-panel');
    if(mselOpenId===id) panel.classList.add('open');
    btn.onclick = (e)=>{
      e.stopPropagation();
      const willOpen = !panel.classList.contains('open');
      document.querySelectorAll('.msel-panel.open').forEach(p=>{ if(p!==panel) p.classList.remove('open'); });
      panel.classList.toggle('open', willOpen);
      mselOpenId = willOpen ? id : null;
    };
    panel.addEventListener('click', e=> e.stopPropagation());
    container.querySelectorAll('input[type=checkbox]:not([data-msel-all])').forEach(cb=>{
      cb.onchange = ()=>{
        if(cb.checked) selectedSet.add(cb.value); else selectedSet.delete(cb.value);
        mselOpenId = id; // mantém este painel aberto no próximo render, disparado por onChange()
        onChange();
      };
    });
    const allCb = container.querySelector('[data-msel-all]');
    allCb.onchange = ()=>{
      if(allCb.checked){ selectedSet.clear(); mselOpenId = id; onChange(); }
      else allCb.checked = true; // não deixa desmarcar "Todos" sem escolher outra coisa
    };
  }

    mselOpenId = null;
    document.querySelectorAll('.msel-panel.open').forEach(p=>p.classList.remove('open'));
