  // Corrige digitação em CAIXA ALTA sozinha, e garante a primeira letra
  // maiúscula — sem atrapalhar quem já está digitando normalmente.
  function attachSmartCapitalize(el){
    if(!el) return;
    el.addEventListener('input', ()=>{
      const v = el.value;
      if(!v) return;
      const letters = v.replace(/[^a-zA-ZÀ-ÿ]/g,'');
      let next = v;
      if(letters.length>=3 && letters===letters.toUpperCase() && letters!==letters.toLowerCase()){
        next = v.toLowerCase();
      }
      next = next.charAt(0).toUpperCase() + next.slice(1);
      if(next!==v){
        const pos = el.selectionStart;
        el.value = next;
        el.setSelectionRange(pos, pos);
      }
    });
  }

  // Máscara de dinheiro: a pessoa só digita números, e os pontos de milhar
  // e a vírgula decimal aparecem sozinhos (como numa maquininha).
  // allowNegativeFn: função opcional que, se retornar true no momento da
  // digitação, permite manter um "-" na frente (usado no cartão de crédito
  // para lançar estornos/descontos como valor negativo).
  function attachMoneyMask(el, allowNegativeFn){
    if(!el) return;
    el.addEventListener('input', ()=>{
      const allowNegative = typeof allowNegativeFn==='function' ? allowNegativeFn() : !!allowNegativeFn;
      const neg = allowNegative && el.value.trim().startsWith('-');
      let digits = el.value.replace(/\D/g,'');
      if(!digits){ el.value = neg ? '-' : ''; return; }
      digits = digits.replace(/^0+(?=\d)/,'');
      while(digits.length<3) digits = '0'+digits;
      const cents = digits.slice(-2);
      let intPart = digits.slice(0,-2).replace(/^0+(?=\d)/,'') || '0';
      intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      el.value = (neg?'-':'') + intPart + ',' + cents;
    });
  }
  // Converte "12.345,67" (com ponto de milhar) num número de verdade.
  function parseMoneyInput(str){
    return parseFloat((str||'').replace(/\./g,'').replace(',','.')) || 0;
  }

  // Teclado numérico próprio pro campo de valor no celular: dá pra somar,
  // subtrair, multiplicar e dividir como numa calculadora, e "Pronto" já
  // preenche o campo com o resultado calculado.
  let calcKeypadState = null;
  function closeCalcKeypad(){
    const kb = document.getElementById('calcKeypad');
    const ov = document.getElementById('calcKeypadOverlay');
    if(kb) kb.remove();
    if(ov) ov.remove();
    calcKeypadState = null;
  }
  function openCalcKeypad(input, allowNegativeFn){
    if(calcKeypadState && calcKeypadState.input===input) return;
    closeCalcKeypad();
    const allowNegative = typeof allowNegativeFn==='function' ? allowNegativeFn() : !!allowNegativeFn;
    const startingRaw = (input.value||'').trim();
    const startingNeg = allowNegative && startingRaw.startsWith('-');
    const startingExpr = startingRaw.replace('-','').replace(',', '.');
    calcKeypadState = { input, expr: /^[0-9.]+$/.test(startingExpr) ? startingExpr : '', neg: startingNeg };

    const overlay = document.createElement('div');
    overlay.id = 'calcKeypadOverlay';
    overlay.className = 'bn-overlay open';
    overlay.style.zIndex = '1150';
    root.appendChild(overlay);
    overlay.addEventListener('click', closeCalcKeypad);

    const kb = document.createElement('div');
    kb.id = 'calcKeypad';
    kb.className = 'calc-keypad';
    kb.innerHTML = `
      <div class="calc-display mono" id="calcDisplay">0</div>
      <div class="calc-grid">
        <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button><button type="button" class="calc-op" data-k="/">÷</button>
        <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button><button type="button" class="calc-op" data-k="*">×</button>
        <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button><button type="button" class="calc-op" data-k="-">−</button>
        <button type="button" data-k="0">0</button><button type="button" data-k=".">,</button><button type="button" class="calc-op" data-k="back">⌫</button><button type="button" class="calc-op" data-k="+">+</button>
      </div>
      ${allowNegative ? `<button type="button" class="btn btn-ghost" id="calcNegToggle" style="width:100%; margin-top:8px;">${calcKeypadState.neg?'✓ ':''}Estorno ou desconto (valor negativo)</button>` : ''}
      <button type="button" class="calc-done" id="calcDone">Pronto</button>
    `;
    root.appendChild(kb);

    function refreshDisplay(){
      const shown = (calcKeypadState.neg?'-':'') + (calcKeypadState.expr.replace(/\./g, ',') || '0');
      document.getElementById('calcDisplay').textContent = shown;
    }
    refreshDisplay();

    if(allowNegative){
      const negBtn = document.getElementById('calcNegToggle');
      negBtn.onclick = ()=>{
        calcKeypadState.neg = !calcKeypadState.neg;
        negBtn.textContent = (calcKeypadState.neg?'✓ ':'') + 'Estorno ou desconto (valor negativo)';
        refreshDisplay();
      };
    }

    kb.querySelectorAll('[data-k]').forEach(btn=>{
      btn.onclick = ()=>{
        const k = btn.dataset.k;
        if(k==='back'){
          calcKeypadState.expr = calcKeypadState.expr.slice(0,-1);
        } else if('+-*/'.includes(k)){
          if(calcKeypadState.expr && !/[+\-*/.]$/.test(calcKeypadState.expr)){
            calcKeypadState.expr += k;
          } else if(calcKeypadState.expr && /[+\-*/]$/.test(calcKeypadState.expr)){
            calcKeypadState.expr = calcKeypadState.expr.slice(0,-1) + k;
          }
        } else if(k==='.'){
          const lastNum = calcKeypadState.expr.split(/[+\-*/]/).pop();
          if(!lastNum.includes('.')) calcKeypadState.expr += '.';
        } else {
          calcKeypadState.expr += k;
        }
        refreshDisplay();
      };
    });

    document.getElementById('calcDone').onclick = ()=>{
      let expr = calcKeypadState.expr.replace(/[+\-*/.]$/, '');
      let result = 0;
      if(expr && /^[0-9+\-*/.]+$/.test(expr)){
        try { result = Function('"use strict"; return (' + expr + ')')(); }
        catch(e){ result = 0; }
      }
      if(!isFinite(result)) result = 0;
      const sign = calcKeypadState.neg ? '-' : '';
      input.value = sign + Math.abs(result).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
      closeCalcKeypad();
    };
  }

  // Descrições mais usadas recentemente, pra sugerir no autocompletar (ajuda
  // bastante a digitar rápido no celular).
  function recentDescriptions(){
    const counts = {};
    [...state.transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,300).forEach(t=>{
      if(!t.desc) return;
      counts[t.desc] = (counts[t.desc]||0) + 1;
    });
    return Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).slice(0,25);
  }
  function allTagsList(){
    const set = new Set();
    state.transactions.forEach(t=>{ (t.tags||[]).forEach(tag=>set.add(tag)); });
    return [...set].sort((a,b)=>a.localeCompare(b));
  }
  function parseTagsInput(str){
    return (str||'').split(',').map(s=>s.trim()).filter(Boolean);
  }

  // ---------- PAINEL PC (dashboard amplo, só telas grandes) ----------
  function simpleDonutSvg(items, centerLabel, centerValue){
    const total = items.reduce((s,it)=>s+Math.abs(it.value),0);
    if(total<=0){
      return `<div class="cat-donut-wrap"><div class="cat-donut-center"><div class="cat-donut-center-label">${escapeHtml(centerLabel)}</div><div class="cat-donut-center-value mono">${centerValue}</div></div></div>`;
    }
    const cx=50, cy=50, rOuter=45, rInner=29;
    function polar(r, angleDeg){ const rad=(angleDeg-90)*Math.PI/180; return [cx+r*Math.cos(rad), cy+r*Math.sin(rad)]; }
    function slicePath(rO, rI, a0, a1){
      const [x1,y1]=polar(rO,a1), [x2,y2]=polar(rO,a0), [x3,y3]=polar(rI,a0), [x4,y4]=polar(rI,a1);
      const large = (a1-a0) > 180 ? 1 : 0;
      return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${rO} ${rO} 0 ${large} 0 ${x2.toFixed(2)} ${y2.toFixed(2)} L${x3.toFixed(2)} ${y3.toFixed(2)} A${rI} ${rI} 0 ${large} 1 ${x4.toFixed(2)} ${y4.toFixed(2)} Z`;
    }
    let angle=0;
    const labelParts=[];
    const slices = items.map(it=>{
      const val = Math.abs(it.value);
      const pct = val/total*100;
      const sweep = Math.max(pct/100*360, 0.4);
      const a0=angle, a1=Math.min(angle+sweep,360);
      angle=a1;
      const d = (a1-a0)>=359.9 ? `${slicePath(rOuter,rInner,0,180)} ${slicePath(rOuter,rInner,180,360)}` : slicePath(rOuter, rInner, a0, a1);
      if(pct>=6){
        const [lx,ly] = polar((rOuter+rInner)/2, (a0+a1)/2);
        labelParts.push(`<text x="${lx.toFixed(2)}" y="${ly.toFixed(2)}" font-size="7.5" font-weight="600" fill="#fff" text-anchor="middle" dominant-baseline="middle" font-family="Inter, sans-serif">${pct.toFixed(0)}%</text>`);
      }
      return `<path d="${d}" fill="${it.color}" style="stroke:var(--paper-card); stroke-width:1.8; stroke-linejoin:round;"><title>${escapeHtml(it.name)} · ${fmt(val)}</title></path>`;
    }).join('') + labelParts.join('');
    return `<div class="cat-donut-wrap"><svg viewBox="0 0 100 100" class="cat-donut-svg">${slices}</svg>
      <div class="cat-donut-center"><div class="cat-donut-center-label">${escapeHtml(centerLabel)}</div><div class="cat-donut-center-value mono">${centerValue}</div></div>
    </div>`;
  }

  // Igual ao dailyChartSvg (gasto acumulado x meta), só que por mês em vez
  // de por dia — pra acompanhar o ano inteiro.
  // Gráfico "bridge": Receita total do ano descendo em degraus por cada
  // grupo de despesa, terminando na Poupança (o que sobrou). Colunas mais
  // estreitas e rótulos verticais pra caber muitos grupos numa tela só.
  function annualBridgeChartSvg(receitaTotal, groupSteps){
    const n = groupSteps.length;
    const totalCols = n + 2; // Receita + grupos + Poupança
    const poupanca = receitaTotal - groupSteps.reduce((s,g)=>s+g.value,0);
    const w = 780, h=400, padL=52, padR=20, padT=40, padB=100;
    const chartW = w-padL-padR, chartH = h-padT-padB;
    const stepX = chartW/totalCols;
    const barW = Math.max(10, stepX*0.6);
    const maxY = Math.max(receitaTotal, 1);
    const yFor = v => padT + chartH - (Math.max(0,v)/maxY)*chartH;
    const xFor = i => padL + i*stepX + stepX/2;
    const haloText=(x,y,content,{size=15,weight=700,color='var(--ink)',anchor='middle'}={})=>
      `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${size}" font-weight="${weight}" text-anchor="${anchor}" font-family="Inter, sans-serif" style="fill:${color}; paint-order:stroke; stroke:var(--paper-card); stroke-width:3.5px; stroke-linejoin:round;">${content}</text>`;

    let svg = '';
    const zeroY = yFor(0);
    svg += `<line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w-padR}" y2="${zeroY.toFixed(1)}" stroke="var(--line-strong)" stroke-width="1"></line>`;

    // Barra 0: Receita total (verde, do zero até o topo)
    const rx = xFor(0);
    svg += `<rect x="${(rx-barW/2).toFixed(1)}" y="${yFor(receitaTotal).toFixed(1)}" width="${barW.toFixed(1)}" height="${(zeroY-yFor(receitaTotal)).toFixed(1)}" rx="3" fill="var(--forest)"></rect>`;
    svg += haloText(rx, yFor(receitaTotal)-12, receitaTotal.toLocaleString('pt-BR',{maximumFractionDigits:0}), {size:15, weight:700, color:'var(--forest)'});
    svg += `<text x="${rx.toFixed(1)}" y="${h-padB+20}" font-size="14" font-weight="700" fill="var(--ink)" text-anchor="end" font-family="Inter, sans-serif" transform="rotate(-40 ${rx.toFixed(1)} ${(h-padB+20).toFixed(1)})">Receita</text>`;

    // Degraus de despesa (vermelho), um por grupo
    let running = receitaTotal;
    groupSteps.forEach((g, i)=>{
      const from = running;
      const to = running - g.value;
      running = to;
      const cx = xFor(i+1);
      const yTop = yFor(Math.max(from,to));
      const yBot = yFor(Math.min(from,to));
      svg += `<rect x="${(cx-barW/2).toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(2,yBot-yTop).toFixed(1)}" rx="3" fill="var(--rust)"></rect>`;
      svg += haloText(cx, yTop-12, `-${g.value.toLocaleString('pt-BR',{maximumFractionDigits:0})}`, {size:15, weight:700, color:'var(--rust)'});
      if(i>0){
        const prevCx = xFor(i);
        const connY = yFor(from);
        svg += `<line x1="${(prevCx+barW/2).toFixed(1)}" y1="${connY.toFixed(1)}" x2="${(cx-barW/2).toFixed(1)}" y2="${connY.toFixed(1)}" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="2,2"></line>`;
      } else {
        const connY = yFor(from);
        svg += `<line x1="${(rx+barW/2).toFixed(1)}" y1="${connY.toFixed(1)}" x2="${(cx-barW/2).toFixed(1)}" y2="${connY.toFixed(1)}" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="2,2"></line>`;
      }
      svg += `<text x="${cx.toFixed(1)}" y="${h-padB+20}" font-size="14" font-weight="600" fill="var(--slate-mute)" text-anchor="end" font-family="Inter, sans-serif" transform="rotate(-40 ${cx.toFixed(1)} ${(h-padB+20).toFixed(1)})">${escapeHtml(g.name)}</text>`;
    });

    // Barra final: Poupança (azul), do zero até o que sobrou
    const px = xFor(n+1);
    const poupIsPos = poupanca>=0;
    const poupColor = poupIsPos ? 'var(--brass-light)' : 'var(--rust)';
    svg += `<rect x="${(px-barW/2).toFixed(1)}" y="${yFor(Math.max(0,poupanca)).toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(2,Math.abs(yFor(poupanca)-zeroY)).toFixed(1)}" rx="3" fill="${poupColor}"></rect>`;
    svg += haloText(px, yFor(Math.max(0,poupanca))-12, poupanca.toLocaleString('pt-BR',{maximumFractionDigits:0}), {size:15.5, weight:800, color: poupIsPos?'var(--ink)':'var(--rust)'});
    svg += `<text x="${px.toFixed(1)}" y="${h-padB+20}" font-size="14" font-weight="700" fill="var(--ink)" text-anchor="end" font-family="Inter, sans-serif" transform="rotate(-40 ${px.toFixed(1)} ${(h-padB+20).toFixed(1)})">Poupança</text>`;
    const lastCx = xFor(n);
    svg += `<line x1="${(lastCx+barW/2).toFixed(1)}" y1="${yFor(running).toFixed(1)}" x2="${(px-barW/2).toFixed(1)}" y2="${yFor(running).toFixed(1)}" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="2,2"></line>`;

    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block;">${svg}</svg>`;
  }

  // Gráfico "bridge" da aba Análise: em vez da receita, parte da Meta do
  // filtro atual, desce em degraus por categoria de despesa (dentro do
  // recorte filtrado) e termina numa coluna "Como estamos" — o que sobrou
  // (verde) ou o quanto estourou (vermelho) da meta.
  function goalBridgeChartSvg(goalTotal, catSteps){
    const n = catSteps.length;
    const totalCols = n + 2; // Meta + categorias + Como estamos
    const leftover = goalTotal - catSteps.reduce((s,c)=>s+c.value,0);
    const w = 780, h=400, padL=52, padR=20, padT=40, padB=100;
    const chartW = w-padL-padR, chartH = h-padT-padB;
    const stepX = chartW/totalCols;
    const barW = Math.max(10, stepX*0.6);
    const maxY = Math.max(goalTotal, ...catSteps.map((c,i)=>goalTotal-catSteps.slice(0,i).reduce((s,x)=>s+x.value,0)), 1);
    const yFor = v => padT + chartH - (Math.max(0,v)/maxY)*chartH;
    const xFor = i => padL + i*stepX + stepX/2;
    const haloText=(x,y,content,{size=15,weight=700,color='var(--ink)',anchor='middle'}={})=>
      `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${size}" font-weight="${weight}" text-anchor="${anchor}" font-family="Inter, sans-serif" style="fill:${color}; paint-order:stroke; stroke:var(--paper-card); stroke-width:3.5px; stroke-linejoin:round;">${content}</text>`;

    let svg = '';
    const zeroY = yFor(0);
    svg += `<line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${w-padR}" y2="${zeroY.toFixed(1)}" stroke="var(--line-strong)" stroke-width="1"></line>`;

    // Barra 0: Meta (verde, do zero até o topo)
    const gx = xFor(0);
    svg += `<rect x="${(gx-barW/2).toFixed(1)}" y="${yFor(goalTotal).toFixed(1)}" width="${barW.toFixed(1)}" height="${(zeroY-yFor(goalTotal)).toFixed(1)}" rx="3" fill="var(--forest)"></rect>`;
    svg += haloText(gx, yFor(goalTotal)-12, goalTotal.toLocaleString('pt-BR',{maximumFractionDigits:0}), {size:15, weight:700, color:'var(--forest)'});
    svg += `<text x="${gx.toFixed(1)}" y="${h-padB+20}" font-size="14" font-weight="700" fill="var(--ink)" text-anchor="end" font-family="Inter, sans-serif" transform="rotate(-40 ${gx.toFixed(1)} ${(h-padB+20).toFixed(1)})">Meta</text>`;

    // Degraus de despesa (vermelho), um por categoria
    let running = goalTotal;
    catSteps.forEach((c, i)=>{
      const from = running;
      const to = running - c.value;
      running = to;
      const cx = xFor(i+1);
      const yTop = yFor(Math.max(from,to));
      const yBot = yFor(Math.min(from,to));
      svg += `<rect x="${(cx-barW/2).toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(2,yBot-yTop).toFixed(1)}" rx="3" fill="var(--rust)"></rect>`;
      svg += haloText(cx, yTop-12, `-${c.value.toLocaleString('pt-BR',{maximumFractionDigits:0})}`, {size:15, weight:700, color:'var(--rust)'});
      if(i>0){
        const prevCx = xFor(i);
        const connY = yFor(from);
        svg += `<line x1="${(prevCx+barW/2).toFixed(1)}" y1="${connY.toFixed(1)}" x2="${(cx-barW/2).toFixed(1)}" y2="${connY.toFixed(1)}" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="2,2"></line>`;
      } else {
        const connY = yFor(from);
        svg += `<line x1="${(gx+barW/2).toFixed(1)}" y1="${connY.toFixed(1)}" x2="${(cx-barW/2).toFixed(1)}" y2="${connY.toFixed(1)}" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="2,2"></line>`;
      }
      svg += `<text x="${cx.toFixed(1)}" y="${h-padB+20}" font-size="14" font-weight="600" fill="var(--slate-mute)" text-anchor="end" font-family="Inter, sans-serif" transform="rotate(-40 ${cx.toFixed(1)} ${(h-padB+20).toFixed(1)})">${escapeHtml(c.name)}</text>`;
    });

    // Barra final: Como estamos — verde se sobrou (positivo), vermelho se estourou (negativo)
    const lx = xFor(n+1);
    const isPos = leftover>=0;
    const leftoverColor = isPos ? 'var(--forest)' : 'var(--rust)';
    svg += `<rect x="${(lx-barW/2).toFixed(1)}" y="${yFor(Math.max(0,leftover)).toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(2,Math.abs(yFor(leftover)-zeroY)).toFixed(1)}" rx="3" fill="${leftoverColor}"></rect>`;
    svg += haloText(lx, yFor(Math.max(0,leftover))-12, leftover.toLocaleString('pt-BR',{maximumFractionDigits:0}), {size:15.5, weight:800, color: leftoverColor});
    svg += `<text x="${lx.toFixed(1)}" y="${h-padB+20}" font-size="14" font-weight="700" fill="var(--ink)" text-anchor="end" font-family="Inter, sans-serif" transform="rotate(-40 ${lx.toFixed(1)} ${(h-padB+20).toFixed(1)})">Como estamos</text>`;
    const lastCx = xFor(n);
    svg += `<line x1="${(lastCx+barW/2).toFixed(1)}" y1="${yFor(running).toFixed(1)}" x2="${(lx-barW/2).toFixed(1)}" y2="${yFor(running).toFixed(1)}" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="2,2"></line>`;

    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block;">${svg}</svg>`;
  }

  function annualSpendChartSvg(monthlyExpense, monthlyIncome, annualGoal, monthsElapsed){
    const fmt0 = v => 'R$ ' + Math.round(v).toLocaleString('pt-BR');
    const barMax = Math.max(1, ...monthlyExpense.slice(1,13));
    const lastM = monthsElapsed>0 ? Math.min(monthsElapsed,12) : 0;
    const cumExp = [0]; let runE=0;
    const cumInc = [0]; let runI=0;
    for(let m=1; m<=12; m++){
      if(m<=lastM){
        runE += (monthlyExpense[m]||0); cumExp[m]=runE;
        runI += (monthlyIncome[m]||0); cumInc[m]=runI;
      } else { cumExp[m]=null; cumInc[m]=null; }
    }
    const cumExpMax = Math.max(0, ...cumExp.slice(1).filter(v=>v!=null));
    const cumIncMax = Math.max(0, ...cumInc.slice(1).filter(v=>v!=null));
    const hasTarget = annualGoal>0;
    const cumTarget = [0];
    for(let m=1; m<=12; m++) cumTarget[m] = hasTarget ? (annualGoal*m/12) : null;
    const yMax = Math.max(barMax, cumExpMax, cumIncMax, hasTarget?annualGoal:0, 1) * 1.18;
    const w=780, h=440, padL=16, padR=16, padT=70, padB=38;
    const chartW=w-padL-padR, chartH=h-padT-padB;
    const gap=chartW/12;
    const barW=Math.max(6, gap*0.38);
    const yFor=v=>padT+chartH-(v/yMax)*chartH;
    const xFor=m=>padL+(m-1)*gap+gap/2;
    const haloText=(x,y,content,{size=15,weight=700,color='var(--ink)',anchor='middle'}={})=>
      `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${size}" font-weight="${weight}" text-anchor="${anchor}" font-family="Inter, sans-serif" style="fill:${color}; paint-order:stroke; stroke:var(--paper-card); stroke-width:4px; stroke-linejoin:round;">${content}</text>`;
    let svg='';

    if(hasTarget){
      const gy=yFor(annualGoal);
      svg += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${w-padR}" y2="${gy.toFixed(1)}" stroke="var(--rust)" stroke-width="1.8" stroke-dasharray="5,4"></line>`;
    }

    // Barras de despesa por mês (referência de fundo, discreta)
    for(let m=1; m<=12; m++){
      const val = monthlyExpense[m]||0;
      const barH = val>0 ? Math.max(2,(val/yMax)*chartH) : 0;
      const x = padL+(m-1)*gap+(gap-barW)/2;
      const y = padT+chartH-barH;
      svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="2" fill="${val>0?'var(--rust)':'var(--line)'}" opacity="0.35"></rect>`;
    }

    if(hasTarget){
      const pts=[]; for(let m=1; m<=12; m++) pts.push(`${xFor(m).toFixed(1)},${yFor(cumTarget[m]).toFixed(1)}`);
      svg += `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--brass-light)" stroke-width="2.2"></polyline>`;
    }

    // As duas linhas acumuladas (receita sólida verde, despesa tracejada
    // âmbar) — o traço tracejado garante que dá pra distinguir as duas
    // mesmo quando os valores ficam bem próximos e as linhas se encostam.
    if(lastM>0){
      const ptsInc=[], ptsExp=[];
      for(let m=1; m<=lastM; m++){
        ptsInc.push(`${xFor(m).toFixed(1)},${yFor(cumInc[m]).toFixed(1)}`);
        ptsExp.push(`${xFor(m).toFixed(1)},${yFor(cumExp[m]).toFixed(1)}`);
      }
      // "Casing" branco por baixo de cada linha, pra elas se destacarem das
      // barras e da grade — e uma da outra, quando cruzam.
      if(ptsInc.length>1){
        svg += `<polyline points="${ptsInc.join(' ')}" fill="none" stroke="var(--paper-card)" stroke-width="6.5"></polyline>`;
        svg += `<polyline points="${ptsInc.join(' ')}" fill="none" stroke="var(--paper-card)" stroke-width="6.5" stroke-dasharray="7,4"></polyline>`;
      }
      if(ptsInc.length>1) svg += `<polyline points="${ptsInc.join(' ')}" fill="none" stroke="var(--forest)" stroke-width="3"></polyline>`;
      if(ptsExp.length>1) svg += `<polyline points="${ptsExp.join(' ')}" fill="none" stroke="var(--amber)" stroke-width="3" stroke-dasharray="8,5"></polyline>`;

      // Pontos em todo mês (com tooltip), mas só alguns ganham rótulo de
      // valor por extenso — a cada 3 meses e sempre no último mês — pra não
      // amontoar números vizinhos uns em cima dos outros.
      const minGap = 42;
      for(let m=1; m<=lastM; m++){
        const cxI=xFor(m), cyI=yFor(cumInc[m]);
        const cxE=xFor(m), cyE=yFor(cumExp[m]);
        const monthName = MONTHS[m-1];
        svg += `<circle cx="${cxI.toFixed(1)}" cy="${cyI.toFixed(1)}" r="4" fill="var(--forest)" stroke="var(--paper-card)" stroke-width="1.5"><title>${monthName}: receita acumulada ${cumInc[m].toLocaleString('pt-BR',{maximumFractionDigits:0})}</title></circle>`;
        svg += `<rect x="${(cxE-3.4).toFixed(1)}" y="${(cyE-3.4).toFixed(1)}" width="6.8" height="6.8" rx="1.5" fill="var(--amber)" stroke="var(--paper-card)" stroke-width="1.5" transform="rotate(45 ${cxE.toFixed(1)} ${cyE.toFixed(1)})"><title>${monthName}: despesa acumulada ${cumExp[m].toLocaleString('pt-BR',{maximumFractionDigits:0})}</title></rect>`;
        const shouldLabel = (m===lastM) || (m%3===0);
        if(shouldLabel){
          const dist = Math.abs(cyI-cyE);
          const extra = dist<minGap ? (minGap-dist)/2 : 0;
          const incOffset = 20 + extra;
          const expOffset = 14 + extra;
          svg += haloText(cxI, cyI+incOffset, cumInc[m].toLocaleString('pt-BR',{maximumFractionDigits:0}), {size:14, weight:700, color:'var(--forest)'});
          svg += haloText(cxE, cyE-expOffset, cumExp[m].toLocaleString('pt-BR',{maximumFractionDigits:0}), {size:14, weight:700, color:'var(--amber)'});
        }
      }
    }

    if(hasTarget) svg += haloText(w-padR, 18, `META ANUAL ${fmt0(annualGoal)}`, {size:14.5, weight:700, color:'var(--rust)', anchor:'end'});

    for(let m=1; m<=12; m++){
      svg += `<text x="${xFor(m).toFixed(1)}" y="${h-10}" font-size="14" font-weight="600" fill="var(--slate-mute)" text-anchor="middle" font-family="Inter, sans-serif">${MONTHS[m-1].slice(0,3)}</text>`;
    }
    svg += `<line x1="${padL}" y1="${padT+chartH}" x2="${w-padR}" y2="${padT+chartH}" stroke="var(--line)" stroke-width="1"></line>`;

    const legend = `<g font-family="Inter, sans-serif" font-size="13.5" font-weight="600">
      <circle cx="${padL+5}" cy="40" r="5" fill="var(--forest)"></circle>
      <text x="${padL+16}" y="44" fill="var(--slate-mute)">Receita acumulada</text>
      <rect x="${padL+165}" y="35" width="10" height="10" rx="2" fill="var(--amber)" transform="rotate(45 ${padL+170} 40)"></rect>
      <text x="${padL+182}" y="44" fill="var(--slate-mute)">Despesa acumulada</text>
    </g>`;

    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block;">${legend}${svg}</svg>`;
  }

  // ---- Gráfico anual: gasto no crédito (Nubank Crédito + Itaú Uniclass)
  // vs. gasto à vista (todas as outras contas, incluindo o cartão Swile,
  // que aqui conta como à vista) — duas barras lado a lado por mês,
  // jan-dez. creditByMonth e cashByMonth são arrays de 12 posições
  // (índice 0 = janeiro).
  function creditVsCashChartSvg(creditByMonth, cashByMonth){
    const w=780, h=380, padL=16, padR=16, padT=44, padB=38;
    const chartW=w-padL-padR, chartH=h-padT-padB;
    const gap=chartW/12;
    const barW=Math.max(10, gap*0.5);
    const yMax = Math.max(1, ...creditByMonth.map((v,i)=>v+(cashByMonth[i]||0))) * 1.18;
    const haloText=(x,y,content,{size=12,weight=700,color='var(--ink)',anchor='middle'}={})=>
      `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${size}" font-weight="${weight}" text-anchor="${anchor}" font-family="Inter, sans-serif" style="fill:${color}; paint-order:stroke; stroke:var(--paper-card); stroke-width:4px; stroke-linejoin:round;">${content}</text>`;
    let svg='';
    for(let m=0; m<12; m++){
      const x = padL+m*gap+(gap-barW)/2;
      const credVal = creditByMonth[m]||0;
      const cashVal = cashByMonth[m]||0;
      const credH = credVal>0 ? Math.max(2,(credVal/yMax)*chartH) : 0;
      const cashH = cashVal>0 ? Math.max(2,(cashVal/yMax)*chartH) : 0;
      const credY = padT+chartH-credH;
      const cashY = credY-cashH;
      // crédito embaixo, à vista empilhado por cima — uma coluna só por mês
      svg += `<rect x="${x.toFixed(1)}" y="${credY.toFixed(1)}" width="${barW.toFixed(1)}" height="${credH.toFixed(1)}" rx="2" fill="var(--brass)"><title>${MONTHS[m]}: crédito ${fmt(credVal)}</title></rect>`;
      svg += `<rect x="${x.toFixed(1)}" y="${cashY.toFixed(1)}" width="${barW.toFixed(1)}" height="${cashH.toFixed(1)}" rx="2" fill="var(--brass-light)"><title>${MONTHS[m]}: à vista ${fmt(cashVal)}</title></rect>`;
      if(cashVal>0.01) svg += haloText(x+barW/2, cashY-5, cashVal.toLocaleString('pt-BR',{maximumFractionDigits:0}), {size:10.5, weight:700, color:'var(--brass-light)'});
      if(credVal>0.01) svg += haloText(x+barW/2, credY-5, credVal.toLocaleString('pt-BR',{maximumFractionDigits:0}), {size:10.5, weight:700, color:'var(--brass)'});
      svg += `<text x="${(x+barW/2).toFixed(1)}" y="${h-10}" font-size="13" font-weight="600" fill="var(--slate-mute)" text-anchor="middle" font-family="Inter, sans-serif">${MONTHS[m].slice(0,3)}</text>`;
    }
    svg += `<line x1="${padL}" y1="${padT+chartH}" x2="${w-padR}" y2="${padT+chartH}" stroke="var(--line)" stroke-width="1"></line>`;
    const legend = `<g font-family="Inter, sans-serif" font-size="13.5" font-weight="600">
      <rect x="${padL}" y="14" width="12" height="12" rx="2" fill="var(--brass)"></rect>
      <text x="${padL+18}" y="24" fill="var(--slate-mute)">Crédito (Nubank + Itaú Uniclass)</text>
      <rect x="${padL+265}" y="14" width="12" height="12" rx="2" fill="var(--brass-light)"></rect>
      <text x="${padL+283}" y="24" fill="var(--slate-mute)">À vista (demais contas, inclui Swile)</text>
    </g>`;
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block;">${legend}${svg}</svg>`;
  }

  function renderPcDashboard(){
    if(pcYear===null) pcYear = currentYear;
    const year = pcYear;
    const accountsTotalPC = state.accounts.filter(a=>!a.archived && a.type!=='Crédito').reduce((s,a)=>s+computeAccountBalance(a.id),0);

    // ---- Ano inteiro: receita, despesa, meta por grupo, mês a mês ----
    const reimbIdsPC = reimbCategoryIds();
    const incomeGoalPC = state.incomeGoal || 0;
    const expenseGroupsPC = (state.groups||[]).filter(g=>g.type==='expense');
    const incomeByMonthPC = new Array(12).fill(0);
    const expenseByMonthPC = new Array(12).fill(0); // sem reembolso — pra meta
    const spentByGroupMonthPC = {};
    expenseGroupsPC.forEach(g=> spentByGroupMonthPC[g.id] = new Array(12).fill(0));
    for(let m=0; m<12; m++){
      txForMonth(year, m).forEach(t=>{
        if(isReimbTx(t, reimbIdsPC)) return;
        if(t.type==='income') incomeByMonthPC[m] += t.amount;
        else if(t.type==='expense'){
          expenseByMonthPC[m] += (-t.amount);
          const c = catById(t.categoryId);
          if(c && spentByGroupMonthPC[c.groupId]) spentByGroupMonthPC[c.groupId][m] += (-t.amount);
        }
      });
    }
    const incomeYtd = incomeByMonthPC.reduce((s,v)=>s+v,0);
    const expenseYtd = expenseByMonthPC.reduce((s,v)=>s+v,0);
    const savingsYtd = incomeYtd - expenseYtd;

    // ---- Gasto no crédito × à vista, mês a mês (ano inteiro) ----
    // "Crédito" aqui é só o Nubank Crédito e o Itaú Uniclass; qualquer
    // outra conta — incluindo o cartão Swile, que por decisão do usuário
    // conta como à vista — entra no lado "à vista". Segue a mesma regra de
    // exclusão de reembolso usada no resto do Painel Anual.
    const creditAccountIdsPC = new Set(
      state.accounts.filter(a=>{
        const n = (a.name||'').toLowerCase();
        return a.type==='Crédito' && (/nubank/.test(n) || /ita[uú].*uniclass/.test(n));
      }).map(a=>a.id)
    );
    const creditByMonthPC = new Array(12).fill(0);
    const cashByMonthPC = new Array(12).fill(0);
    for(let m=0; m<12; m++){
      txForMonth(year, m).forEach(t=>{
        if(t.type!=='expense') return;
        if(isReimbTx(t, reimbIdsPC)) return;
        const amt = -t.amount;
        if(creditAccountIdsPC.has(t.accountId)) creditByMonthPC[m] += amt;
        else cashByMonthPC[m] += amt;
      });
    }
    const creditVsCashChartHtmlPC = creditVsCashChartSvg(creditByMonthPC, cashByMonthPC);
    const monthsElapsedPC = year===new Date().getFullYear() ? (new Date().getMonth()+1) : (year<new Date().getFullYear() ? 12 : 0);

    // Card 1: anel Despesas × Receitas anual (igual ao Painel, mas pro ano)
    const pctSpentYtd = incomeYtd>0 ? (expenseYtd/incomeYtd*100) : null;

    // Card 2: anel de economia do ano
    const economyPctYtd = pctSpentYtd===null ? null : (100-pctSpentYtd);
    const economyColorYtd = economyPctYtd===null ? null : (economyPctYtd<=0 ? 'var(--rust)' : economyPctYtd<13 ? 'var(--amber)' : 'var(--forest)');
    const economyStatusYtd = economyPctYtd===null ? 'status-neutral' : economyPctYtd<=0 ? 'status-bad' : economyPctYtd<13 ? 'status-warn' : 'status-good';
    const economyLabelYtd = economyPctYtd===null ? 'Sem receita' : economyPctYtd<=0 ? 'Sem economia' : economyPctYtd<13 ? 'Economia baixa' : 'Boa economia';

    // ---- Totais por grupo no ano (usados no gráfico bridge e nas metas anuais) ----
    const groupCompareRowsPC = expenseGroupsPC.map(g=>{
      const goalPct = state.groupBudgets ? (state.groupBudgets[g.id]||0) : 0;
      const ytdSpent = spentByGroupMonthPC[g.id].slice(0, monthsElapsedPC||12).reduce((s,v)=>s+v,0);
      return { g, goalPct, ytdSpent };
    });
    const totalGoalPctPC = groupCompareRowsPC.reduce((s,r)=>s+r.goalPct,0);
    // ---- Metas anuais (substitui o antigo "Saldo do mês", que perdeu o
    // sentido sem um mês selecionado) ----
    const annualIncomeGoalPC = incomeGoalPC * 12;
    const annualGoalReaisPC = incomeGoalPC * 12 * (totalGoalPctPC/100);

    // ---- Projeção de saldo até o fim do ano, pelo ritmo médio de sobra
    // mensal observado até agora (sobra do ano ÷ meses já passados) ----
    const remainingMonthsPC = Math.max(0, 12 - monthsElapsedPC);
    const avgMonthlySavingsPC = monthsElapsedPC>0 ? (savingsYtd/monthsElapsedPC) : 0;
    const projectedYearEndPC = accountsTotalPC + avgMonthlySavingsPC*remainingMonthsPC;

    // ---- Tabela "bowler" (grupo × mês, igual à aba Bowler) ----
    const pctForPC = (spent) => incomeGoalPC>0 ? (spent/incomeGoalPC*100) : 0;
    const cellClassPC = (realizedPct, goalPct) => {
      if(!goalPct) return 'bowler-neutral';
      return realizedPct>goalPct ? 'bowler-red' : 'bowler-green';
    };
    const fmtCellPC = (v)=> v.toLocaleString('pt-BR',{maximumFractionDigits:0});
    const bowlerRowsHtmlPC = expenseGroupsPC.map(g=>{
      const goalPct = state.groupBudgets[g.id] || 0;
      const cellsHtml = spentByGroupMonthPC[g.id].map(spent=>{
        const realizedPct = pctForPC(spent);
        const displayVal = spent>0.01 ? fmtCellPC(spent) : '—';
        return `<td class="bowler-cell ${cellClassPC(realizedPct, goalPct)}" title="${fmt(spent)}${goalPct?` · meta ${realizedPct.toFixed(0)}%/${goalPct.toFixed(0)}%`:''}">${displayVal}</td>`;
      }).join('');
      return `<tr><td class="bowler-row-label"><span class="bowler-row-label-inner">${categoryBadgeHtml(g.icon, g.color, '📁')}${escapeHtml(g.name)}</span></td>${cellsHtml}</tr>`;
    }).join('') || `<tr><td colspan="13" class="empty-state">Crie grupos de despesa e metas na aba Dashboard primeiro.</td></tr>`;
    const bowlerTotalGoalPctPC = expenseGroupsPC.reduce((s,g)=>s+(state.groupBudgets[g.id]||0),0);
    const bowlerTotalCellsHtmlPC = [];
    for(let m=0; m<12; m++){
      const totalSpent = expenseGroupsPC.reduce((s,g)=>s+spentByGroupMonthPC[g.id][m],0);
      const realizedPct = pctForPC(totalSpent);
      const displayVal = totalSpent>0.01 ? fmtCellPC(totalSpent) : '—';
      bowlerTotalCellsHtmlPC.push(`<td class="bowler-cell bowler-total-cell ${cellClassPC(realizedPct, bowlerTotalGoalPctPC)}" title="${fmt(totalSpent)}${bowlerTotalGoalPctPC?` · meta ${realizedPct.toFixed(0)}%/${bowlerTotalGoalPctPC.toFixed(0)}%`:''}">${displayVal}</td>`);
    }


    const bridgeGroupSteps = groupCompareRowsPC
      .filter(r=>r.ytdSpent>0.01)
      .sort((a,b)=>b.ytdSpent-a.ytdSpent)
      .map(r=>({ name: r.g.name, value: r.ytdSpent }));
    const annualBridgeChartHtmlPC = annualBridgeChartSvg(incomeYtd, bridgeGroupSteps);

    // ---- Card: Gasto por mês (ano inteiro) — acumulado x meta anual, com receita ----
    const monthlyExpenseArrPC = [0, ...expenseByMonthPC]; // índice 1..12
    const monthlyIncomeArrPC = [0, ...incomeByMonthPC];
    const annualSpendChartHtmlPC = annualSpendChartSvg(monthlyExpenseArrPC, monthlyIncomeArrPC, annualGoalReaisPC, monthsElapsedPC);

    // ---- Card: Grupos e categorias mês a mês (editável) — clique num item
    // pra ver sua série no ano, a média até agora e o veredito vs a meta.
    // Inclui um item "Despesas total" (soma de tudo) seguindo o mesmo padrão.
    const expenseCatsPC = state.categories.filter(c=>c.type==='expense');
    const spentByCatMonthPC = {};
    expenseCatsPC.forEach(c=> spentByCatMonthPC[c.id] = new Array(12).fill(0));
    for(let m=0; m<12; m++){
      txForMonth(year, m).filter(t=>t.type==='expense').forEach(t=>{
        if(spentByCatMonthPC[t.categoryId]) spentByCatMonthPC[t.categoryId][m] += (-t.amount);
      });
    }
    const baseItemsPC = pcAnnualMode==='group' ? expenseGroupsPC : expenseCatsPC;
    const baseSeriesMapPC = pcAnnualMode==='group' ? spentByGroupMonthPC : spentByCatMonthPC;
    const totalSeriesPC = new Array(12).fill(0);
    baseItemsPC.forEach(item=>{ baseSeriesMapPC[item.id].forEach((v,m)=>{ totalSeriesPC[m]+=v; }); });
    const totalItemPC = { id:'__total__', name:'Despesas total', icon:'📊', color:'#3b4657' };
    const annualSourceItemsPC = [totalItemPC, ...baseItemsPC];
    const annualSeriesMapPC = Object.assign({ '__total__': totalSeriesPC }, baseSeriesMapPC);
    const annualListPC = monthsElapsedPC>0 ? annualSourceItemsPC.map(item=>{
      const series = annualSeriesMapPC[item.id];
      const total = series.slice(0, monthsElapsedPC).reduce((s,v)=>s+v,0);
      return { item, series, total, avg: total/monthsElapsedPC };
    }).sort((a,b)=>b.total-a.total) : [];
    if(pcAnnualSelected===null || !annualSourceItemsPC.some(i=>i.id===pcAnnualSelected)){
      pcAnnualSelected = annualListPC[0] ? annualListPC[0].item.id : null;
    }
    const selAnnualPC = annualListPC.find(r=>r.item.id===pcAnnualSelected);
    const annualListHtmlPC = annualListPC.map(r=>`
      <div class="rank-row clickable ${r.item.id===pcAnnualSelected?'annual-row-active':''}" data-pc-annual-pick="${r.item.id}" style="${r.item.id==='__total__'?'font-weight:700; border-bottom:1.5px solid var(--line-strong); margin-bottom:4px; padding-bottom:10px;':''}">
        <span class="rank-name">${categoryBadgeHtml(r.item.icon, r.item.color, pcAnnualMode==='group'?'📁':'💰')}${escapeHtml(r.item.name)}</span>
        <span class="rank-value mono">${fmt(r.total)} <span style="color:var(--slate-mute); font-weight:600;">· méd ${fmt(r.avg)}/mês</span></span>
      </div>`).join('') || `<div class="empty-state">Nada lançado ainda em ${year}.</div>`;
    let selGoalReaisPC = 0, verdictPillPC = '', trendPC = null;
    if(selAnnualPC){
      trendPC = computeValueTrend(selAnnualPC.series.slice(0, monthsElapsedPC));
      if(selAnnualPC.item.id==='__total__'){
        selGoalReaisPC = pcAnnualMode==='group' ? incomeGoalPC*(totalGoalPctPC/100) : 0;
      } else {
        selGoalReaisPC = pcAnnualMode==='group'
          ? incomeGoalPC * ((state.groupBudgets[selAnnualPC.item.id]||0)/100)
          : (state.budgets[selAnnualPC.item.id]||0);
      }
      if(selGoalReaisPC>0){
        const ratio = selAnnualPC.avg/selGoalReaisPC*100;
        if(selAnnualPC.avg>selGoalReaisPC) verdictPillPC = `<span class="budget-status-pill status-bad">🔴 Acima da meta</span>`;
        else if(ratio>=85) verdictPillPC = `<span class="budget-status-pill status-warn">🟡 Perto do limite</span>`;
        else verdictPillPC = `<span class="budget-status-pill status-good">🟢 Indo bem</span>`;
      }
    }
    const annualDetailHtmlPC = selAnnualPC ? `
      <div class="bowler-pill-row" style="margin-top:18px;">
        ${annualSourceItemsPC.map(item=>`<button type="button" class="bowler-pill ${item.id===pcAnnualSelected?'active':''}" data-pc-annual-pick="${item.id}" style="${item.id===pcAnnualSelected?`background:${item.color}; border-color:${item.color}; color:#fff;`:''}">${escapeHtml(item.name)}</button>`).join('')}
      </div>
      <div class="card-head-row" style="margin-top:10px; flex-wrap:wrap; gap:8px;">
        <div class="card-sub">${escapeHtml(selAnnualPC.item.name)} mês a mês (jan-dez) — média até agora: <strong style="color:var(--ink);">${fmt(selAnnualPC.avg)}</strong>/mês${selGoalReaisPC>0 ? ` · meta: <strong style="color:var(--ink);">${fmt(selGoalReaisPC)}</strong>/mês` : ''}</div>
        <div style="display:flex; gap:8px; align-items:center;">
          <span class="bowler-trend-badge">${trendPC.icon} ${trendPC.label}</span>
          ${verdictPillPC}
        </div>
      </div>
      ${annualValueTrendChartSvg(selAnnualPC.series, selAnnualPC.avg, monthsElapsedPC, selGoalReaisPC)}
    ` : '';


    const leftoverByMonthPC = incomeByMonthPC.map((inc,i)=> inc - expenseByMonthPC[i]);
    const isCurrentRealYearPC = (year === new Date().getFullYear());
    const realBalanceNowPC = isCurrentRealYearPC ? accountsTotalPC : null;
    const leftoverYtdPC = leftoverByMonthPC.slice(0, monthsElapsedPC||12).reduce((s,v)=>s+v,0);
    const balanceGapPC = realBalanceNowPC!==null ? (realBalanceNowPC - leftoverYtdPC) : null;

    mainEl.innerHTML = `
      <div id="rumo-header" class="dashboard-header">
        <div><h1>Painel Anual</h1><div class="subtitle">Visão completa do ano de ${year}</div></div>
        <div class="month-switch">
