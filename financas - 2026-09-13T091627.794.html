    setTimeout(()=>{ const d = document.getElementById('f-desc'); if(d) d.focus(); }, 50);

    // Faturas: quando é compra no cartão de crédito, a data vira "em qual
    // fatura isso cai" em vez da data literal da compra. A próxima fatura
    // (a mais próxima que ainda não fechou) fica sempre pré-selecionada.
    const MONTHS_SHORT = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    // Sempre oferece: fatura do mês anterior, a próxima (padrão) e mais algumas seguintes.
    // O valor guardado passa a ter o MÊS DA COMPRA (não o mês de vencimento) —
    // assim "Fatura de agosto" sempre grava uma data dentro de agosto, e
    // bate com a forma como o resto do app soma as faturas por mês.
    function invoiceDates(account, count){
      const dueDay = (account && account.dueDay) || 1;
      const closingDay = (account && account.closingDay) || dueDay;
      const today = new Date(); today.setHours(0,0,0,0);
      let closing = new Date(today.getFullYear(), today.getMonth(), closingDay);
      if(closing < today) closing = new Date(closing.getFullYear(), closing.getMonth()+1, closingDay);
      const nextSpendMonth = new Date(closing.getFullYear(), closing.getMonth()-1, 1);
      const start = new Date(nextSpendMonth.getFullYear(), nextSpendMonth.getMonth()-1, 1);
      const dates = [];
      for(let i=0;i<count;i++){
        const m = new Date(start.getFullYear(), start.getMonth()+i, 1);
        const lastDay = new Date(m.getFullYear(), m.getMonth()+1, 0).getDate();
        dates.push(new Date(m.getFullYear(), m.getMonth(), Math.min(dueDay, lastDay)));
      }
      return dates; // dates[i] fica dentro do mês da compra; dates[1] = "próxima fatura a fechar"
    }
    function faturaLabel(d, account){
      const dueDay = (account && account.dueDay) || 1;
      const dueMonthDate = new Date(d.getFullYear(), d.getMonth()+1, 1);
      const lastDay = new Date(dueMonthDate.getFullYear(), dueMonthDate.getMonth()+1, 0).getDate();
      const dd = Math.min(dueDay, lastDay);
      return `Fatura de ${MONTHS_SHORT[d.getMonth()]} — vence ${String(dd).padStart(2,'0')}/${String(dueMonthDate.getMonth()+1).padStart(2,'0')}`;
    }
    function refreshDateOrFaturaField(){
      const isCreditCard = selType==='creditcard';
      const label = document.getElementById('f-date-label');
      const inner = document.getElementById('f-date-field-inner');
      if(isCreditCard){
        const accSel = document.getElementById('f-acc');
        const acc = accSel ? accById(accSel.value) : null;
        const initialDate = (existing && existing.type==='expense') ? existing.date : new Date().toISOString().slice(0,10);
        label.textContent = 'Data da compra';
        inner.innerHTML = `<div style="display:flex; gap:6px;">
          <input type="date" id="f-date" style="flex:1;" value="${initialDate}">
          <button type="button" id="f-date-today" class="btn btn-ghost btn-small" style="flex-shrink:0;">Hoje</button>
        </div>
        <div class="fab-hint" id="f-fatura-hint" style="margin-top:6px; margin-bottom:0;"></div>`;
        bindDateTodayButton();
        const updateFaturaHint = ()=>{
          const hint = document.getElementById('f-fatura-hint');
          const dStr = document.getElementById('f-date').value;
          if(!dStr || !acc){ hint.textContent = ''; return; }
          const closingDay = acc.closingDay || 1;
          const dueDay = acc.dueDay || closingDay;
          const d = new Date(dStr+'T00:00:00');
          const dueMonthDate = new Date(d.getFullYear(), d.getMonth()+1, 1);
          const lastDay = new Date(dueMonthDate.getFullYear(), dueMonthDate.getMonth()+1, 0).getDate();
          const dd = Math.min(dueDay, lastDay);
          hint.textContent = `→ Entra na fatura de ${MONTHS[d.getMonth()]} · vence ${String(dd).padStart(2,'0')}/${String(dueMonthDate.getMonth()+1).padStart(2,'0')}`;
        };
        document.getElementById('f-date').addEventListener('input', updateFaturaHint);
        document.getElementById('f-date-today').addEventListener('click', updateFaturaHint);
        updateFaturaHint();
      } else {
        label.textContent = 'Data';
        inner.innerHTML = `<div style="display:flex; gap:6px;">
          <input type="date" id="f-date" style="flex:1;" value="${existing?existing.date:new Date(currentYear,currentMonth,Math.min(new Date().getDate(),28)).toISOString().slice(0,10)}">
          <button type="button" id="f-date-today" class="btn btn-ghost btn-small" style="flex-shrink:0;">Hoje</button>

    function updateGroupDisplay(){
      const catId = document.getElementById('f-cat').value;
      const cat = catById(catId);

    function subcatParentCategory(subId){
      return state.categories.find(c=> (c.subcategories||[]).some(s=>s.id===subId));
    }
    // Depois que a categoria fica definida (de um jeito ou de outro), a lista de
    // subcategorias passa a mostrar só as daquela categoria — nada de outras categorias.
    function rebuildSubcatOptionsForCategory(catId, keepSelectedId){
      const subSel = document.getElementById('f-subcat');
      const cat = catById(catId);
      const subs = (cat && cat.subcategories) || [];
      subSel.innerHTML = '<option value="">Nenhuma</option>' + subs.map(s=>`<option value="${s.id}" ${keepSelectedId===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('');
    }
    // Escolher a subcategoria primeiro puxa a categoria (e o grupo) automaticamente,
    // e a partir daí a lista de subcategorias já fica restrita a essa categoria.
    function onSubcatChange(){
      const subId = document.getElementById('f-subcat').value;
      if(subId){
        const parent = subcatParentCategory(subId);
        if(parent){
          document.getElementById('f-cat').value = parent.id;
          rebuildSubcatOptionsForCategory(parent.id, subId);
        }
      }
      updateGroupDisplay();
    }
    // Escolher a categoria direto também atualiza o grupo, e filtra a lista de
    // subcategorias pra mostrar só as que pertencem a essa categoria.
    function onCatChange(){

    function refreshAmountCcHint(){
      const hint = document.getElementById('f-amount-cc-hint');

      if(!hint) return;
      if(selType==='creditcard'){
        hint.style.display = 'block';
        hint.textContent = 'Compra: digite o valor normalmente. Estorno, cashback ou desconto na fatura: digite o valor negativo (ex: -50,00) — ele abate o total da fatura.';
        if(amountEl) amountEl.placeholder = '0,00 (negativo = estorno/desconto)';
      } else {

    function refreshFieldsForType(){

    function refreshRecurrenceExtra(){

        if(hint) hint.textContent = '(valor mensal)';

    document.getElementById('f-type-toggle').querySelectorAll('button').forEach(btn=>{
      btn.onclick = ()=>{
        selType = btn.dataset.type;

        document.getElementById('f-type-toggle').querySelectorAll('button').forEach(b=>b.classList.remove('active','expense','income','transfer','creditcard'));
        btn.classList.add('active', selType);
        const isTransfer = selType==='transfer';

        document.getElementById('f-transfer-fields').style.display = isTransfer ? 'block' : 'none';

    overlay.querySelector('#f-cancel').onclick = closeModal;
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
    if(isEdit){

      };
      const continueBtn = overlay.querySelector('#f-continue-recurrence');
      if(continueBtn) continueBtn.onclick = ()=>{ closeModal(); openContinueRecurrenceModal(existing); };
      if(existing.recurrenceGroupId){

    overlay.querySelector('#f-save').onclick = async ()=>{
      const desc = document.getElementById('f-desc').value.trim();
      const amount = parseMoneyInput(document.getElementById('f-amount').value);
      const faturaEl = document.getElementById('f-fatura');
      const date = faturaEl ? faturaEl.value : document.getElementById('f-date').value;

      if(isNaN(amount) || amount===0 || (selType!=='creditcard' && amount<0) || !date){
        alert('Preencha valor e data.');
        return;
      }

      if(selType==='transfer'){
        const fromAccountId = document.getElementById('f-from-acc').value;
        const toAccountId = document.getElementById('f-to-acc').value;
        if(!fromAccountId || !toAccountId || fromAccountId===toAccountId){
          alert('Escolha duas contas diferentes para a transferência.');
          return;
        }
        const finalDesc = desc || 'Transferência';
        if(isEdit){
          Object.assign(existing, {desc: finalDesc, amount: Math.abs(amount), date, type: 'transfer', fromAccountId, toAccountId, categoryId: undefined, accountId: undefined});
        } else {
          state.transactions.push({id: uid(), desc: finalDesc, amount: Math.abs(amount), date, type: 'transfer', fromAccountId, toAccountId});
        }
      } else {
        const categoryId = document.getElementById('f-cat').value;
        const subcategoryId = document.getElementById('f-subcat') ? (document.getElementById('f-subcat').value || undefined) : undefined;
        const tags = document.getElementById('f-tags') ? parseTagsInput(document.getElementById('f-tags').value) : [];
        const purchaseDate = document.getElementById('f-purchase-date') ? document.getElementById('f-purchase-date').value : undefined;
        const accountId = document.getElementById('f-acc').value;
        if(!desc || !accountId){
          alert('Preencha descrição, valor, data e conta.');
          return;
        }
        const storedType = selType==='creditcard' ? 'expense' : selType;
        // Cartão de crédito: o valor digitado já carrega o sinal — positivo é
        // compra (aumenta a fatura), negativo é estorno/desconto (abate a
        // fatura), por isso só invertemos o sinal, sem forçar valor absoluto.
        const signedAmount = selType==='income' ? Math.abs(amount) : selType==='creditcard' ? -amount : -Math.abs(amount);
        const recurrenceMode = document.getElementById('f-recurrence') ? document.getElementById('f-recurrence').value : 'none';
        const today = new Date().toISOString().slice(0,10);
        // Despesa/receita comum lançada de uma vez: usa o status (pago/recebido
        // ou pendente) escolhido no botão do formulário. Parceladas/fixas/por
        // período seguem a data de cada parcela (passado/hoje = ok, futuro =
        // pendente). Despesa de cartão: sempre nasce "pendente" — só vira
        // "pago" quando a fatura é paga (e aí sim debita da conta escolhida).
        const tracksPaid = storedType==='expense' || storedType==='income';
        const paidFor = (d) => {
          if(!tracksPaid) return undefined;
          if(selType==='creditcard') return false;
          return d<=today;
        };
        const singlePaid = !tracksPaid ? undefined
          : selType==='creditcard' ? (isExistingCreditCard ? existing.paid : false)
          : selPaid;

        if(isEdit){
          Object.assign(existing, {desc, amount: signedAmount, date, type: storedType, categoryId, subcategoryId, accountId, tags, purchaseDate: selType==='creditcard'?purchaseDate:undefined, fromAccountId: undefined, toAccountId: undefined, paid: singlePaid});
        } else if(recurrenceMode==='installment'){
          const n = clampInt(document.getElementById('f-installments').value, 2, 48);
          const per = Math.round((amount/n)*100)/100;
          const groupId = uid();
          let allocated = 0;
          for(let i=0;i<n;i++){
            const instAmt = (i===n-1) ? Math.round((amount-allocated)*100)/100 : per;
            allocated += per;
            const signed = selType==='income' ? Math.abs(instAmt) : selType==='creditcard' ? -instAmt : -Math.abs(instAmt);
            const d = addMonthsToDateStr(date,i);
            state.transactions.push({
              id: uid(), desc: `${desc} (${i+1}/${n})`, amount: signed, date: d,
              type: storedType, categoryId, subcategoryId, accountId, tags, purchaseDate: selType==='creditcard'?purchaseDate:undefined, paid: paidFor(d),
              recurrenceType:'installment', recurrenceGroupId: groupId, installmentIndex:i+1, installmentTotal:n
            });
          }
        } else if(recurrenceMode==='period'){
          const n = clampInt(document.getElementById('f-months').value, 1, 60);
          const groupId = uid();
          for(let i=0;i<n;i++){
            const d = addMonthsToDateStr(date,i);
            state.transactions.push({
              id: uid(), desc, amount: signedAmount, date: d,
              type: storedType, categoryId, subcategoryId, accountId, tags, purchaseDate: selType==='creditcard'?purchaseDate:undefined, paid: paidFor(d),
              recurrenceType:'period', recurrenceGroupId: groupId, installmentIndex:i+1, installmentTotal:n
            });
          }
        } else if(recurrenceMode==='fixed'){
          const groupId = uid();
          for(let i=0;i<24;i++){
            const d = addMonthsToDateStr(date,i);
            state.transactions.push({
              id: uid(), desc, amount: signedAmount, date: d,
              type: storedType, categoryId, subcategoryId, accountId, tags, purchaseDate: selType==='creditcard'?purchaseDate:undefined, paid: paidFor(d),
              recurrenceType:'fixed', recurrenceGroupId: groupId
            });
          }
        } else {
          state.transactions.push({id: uid(), desc, amount: signedAmount, date, type: storedType, categoryId, subcategoryId, accountId, tags, purchaseDate: selType==='creditcard'?purchaseDate:undefined, paid: singlePaid});

  // Limpa transações/contas a pagar de teste, mantendo a estrutura (contas,
  // cartões, grupos, categorias, subcategorias e metas) intacta.
  // ---------- IMPORTAÇÃO DE PLANILHA EXCEL ----------
  function normalizeMatch(str){
    return (str||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  }
  function parseBrDate(str){
    const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec((str||'').toString().trim());
    if(!m) return null;
    return `${m[3]}-${m[2]}-${m[1]}`;
  }
  function findAccountByName(name){
    const norm = normalizeMatch(name);
    if(!norm) return null;
    const candidates = state.accounts.filter(a=>normalizeMatch(a.name)===norm);
    if(candidates.length===0) return null;
    // Prefere conta que não seja cartão de crédito, pra evitar confundir
    // "Nubank" (conta corrente na planilha) com o cartão "Nubank" do app.
    return candidates.find(a=>a.type!=='Crédito') || candidates[0];
  }
  function findCategoryByName(name, type){
    const norm = normalizeMatch(name);
    if(!norm) return null;
    return state.categories.find(c=>c.type===type && normalizeMatch(c.name)===norm) || null;
  }
  function ensureImportGroup(type){
    let g = (state.groups||[]).find(gr=>gr.type===type && normalizeMatch(gr.name)==='importados');
    if(!g){
      g = { id: uid(), name: 'Importados', type, color: '#7C8880', icon: '📥' };
      state.groups.push(g);
    }
    return g;
  }
  function ensureCategory(name, type){
    let cat = findCategoryByName(name, type);
    if(!cat){
      const group = ensureImportGroup(type);
      cat = { id: uid(), name: toStandardCase(name), type, groupId: group.id, color:'#7C8880', icon:'📥', subcategories: [] };
      state.categories.push(cat);
    }
    return cat;
  }
  function ensureSubcategory(cat, name){
    if(!name) return null;
    const norm = normalizeMatch(name);
    cat.subcategories = cat.subcategories || [];
    let sub = cat.subcategories.find(s=>normalizeMatch(s.name)===norm);
    if(!sub){
      sub = { id: uid(), name: toStandardCase(name) };
      cat.subcategories.push(sub);
    }
    return sub;
  }

  // Exporta uma cópia dos dados: backup completo em JSON (mesmo formato
  // salvo no Supabase, útil pra restaurar tudo) e/ou as transações em
  // planilha .xlsx (pra usar fora do app, imprimir, mandar pro contador etc).
  function downloadJSONBackup(){
    const dataStr = JSON.stringify(state, null, 2);
    const blob = new Blob([dataStr], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = new Date().toISOString().slice(0,10);
    a.href = url; a.download = `financas-backup-${ts}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function downloadTransactionsXlsx(){
    const sorted = [...state.transactions].sort((a,b)=>a.date.localeCompare(b.date));
    const rows = sorted.map(t=>{
      const cat = catById(t.categoryId);
      const sub = cat && t.subcategoryId ? (cat.subcategories||[]).find(s=>s.id===t.subcategoryId) : null;
      const tipoLabel = t.type==='income' ? 'Receita' : t.type==='expense' ? 'Despesa' : 'Transferência';
      let contaLabel = '';
      if(t.type==='transfer'){
        const fromAcc = accById(t.fromAccountId), toAcc = accById(t.toAccountId);
        contaLabel = `${fromAcc?fromAcc.name:'?'} → ${toAcc?toAcc.name:'?'}`;
      } else {
        const acc = accById(t.accountId);
        contaLabel = acc ? acc.name : '';
      }
      const statusLabel = t.type==='transfer' || t.paid===undefined ? '' : (t.paid ? (t.type==='income'?'Recebido':'Pago') : 'Pendente');
      const parcela = (t.recurrenceType==='installment' || t.recurrenceType==='period') ? `${t.installmentIndex}/${t.installmentTotal}`
        : t.recurrenceType==='fixed' ? 'Fixa' : '';
      return {
        'Data': t.date,
        'Tipo': tipoLabel,
        'Descrição': t.desc || '',
        'Categoria': cat ? cat.name : '',
        'Subcategoria': sub ? sub.name : '',
        'Conta': contaLabel,
        'Valor': Math.abs(t.amount||0),
        'Status': statusLabel,
        'Recorrência': parcela
      };
    });
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{wch:11},{wch:13},{wch:32},{wch:16},{wch:16},{wch:20},{wch:12},{wch:11},{wch:10}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Transações');
    const ts = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, `financas-transacoes-${ts}.xlsx`);
  }

  function openImportModal(){
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'modalOverlay';
    root.appendChild(overlay);
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });

    let parsed = null; // { rows: [...], transferRows: [...], accountNames: Set }
    let accountMap = {}; // nome da planilha -> 'new' | accountId existente

    function drawStep1(){
      overlay.innerHTML = `
        <div class="modal">
          <h2>Importar planilha Excel</h2>
          <div class="card-sub" style="margin-top:-10px;">
            Espera as abas "Receitas e Despesas" (ou "Despesas"/"Receitas") e, opcionalmente, "Transferências" — com as colunas Data, Descrição, Valor, Conta, Situação, Categoria, Subcategoria.
          </div>
          <div class="field" style="margin-top:16px;">
            <label>Arquivo .xlsx</label>
            <input type="file" id="import-file-input" accept=".xlsx,.xls">
          </div>
          <div id="import-status" class="fab-hint" style="margin-top:0;"></div>
          <div class="modal-actions">
            <button class="btn btn-ghost" id="import-cancel">Cancelar</button>
          </div>
        </div>`;
      overlay.querySelector('#import-cancel').onclick = closeModal;
      overlay.querySelector('#import-file-input').onchange = async (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        document.getElementById('import-status').textContent = 'Lendo o arquivo...';
        try {
          const buf = await file.arrayBuffer();
          const wb = XLSX.read(buf, { type: 'array' });
          parsed = extractDataFromWorkbook(wb);
          if(parsed.rows.length===0 && parsed.transferRows.length===0){
            document.getElementById('import-status').textContent = 'Não encontrei nenhuma linha válida nessa planilha. Confira o nome das abas e colunas.';
            return;
          }
          drawStep2();
        } catch(err){
          document.getElementById('import-status').textContent = 'Não consegui ler esse arquivo: ' + (err.message||err);
        }
      };
    }

    function extractDataFromWorkbook(wb){
      const findSheet = (needles) => wb.SheetNames.find(n => needles.some(nd => normalizeMatch(n).includes(normalizeMatch(nd))));
      const toRows = (sheetName) => sheetName ? XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: null }) : [];

      let rows = [];
      const combinedName = findSheet(['receitas e despesas']);
      if(combinedName){
        rows = toRows(combinedName);
      } else {
        rows = toRows(findSheet(['despesas'])).concat(toRows(findSheet(['receitas'])));
      }
      rows = rows.filter(r => parseBrDate(r['Data']) && typeof r['Valor']==='number' && r['Conta']);

      const transferName = findSheet(['transferenc']);
      let transferRows = transferName ? toRows(transferName) : [];
      transferRows = transferRows.filter(r => parseBrDate(r['Data']) && typeof r['Valor']==='number' && r['Conta origem'] && r['Conta destino']);

      const accountNames = new Set();
      rows.forEach(r => accountNames.add(String(r['Conta']).trim()));
      transferRows.forEach(r => { accountNames.add(String(r['Conta origem']).trim()); accountNames.add(String(r['Conta destino']).trim()); });

      return { rows, transferRows, accountNames };
    }

    function drawStep2(){
      const names = [...parsed.accountNames].sort();
      names.forEach(n=>{
        if(!(n in accountMap)){
          const match = findAccountByName(n);
          accountMap[n] = match ? match.id : 'new';
        }
      });
      const accOptionsHtml = (selected) => `<option value="new" ${selected==='new'?'selected':''}>+ Criar conta nova</option>` +
        state.accounts.map(a=>`<option value="${a.id}" ${selected===a.id?'selected':''}>${escapeHtml(a.name)} (${a.type})</option>`).join('');

      overlay.innerHTML = `
        <div class="modal" style="width:480px;">
          <h2>Confirme as contas</h2>
          <div class="card-sub" style="margin-top:-10px;">Encontrei ${parsed.rows.length} lançamento(s)${parsed.transferRows.length?` e ${parsed.transferRows.length} transferência(s)`:''}. Pra cada conta da planilha, escolha uma conta existente ou deixe "criar conta nova".</div>
          <div class="import-acc-list">
            ${names.map(n=>`
              <div class="field">
                <label>${escapeHtml(n)}</label>
                <select class="import-acc-select" data-sheet-acc="${escapeHtml(n)}">${accOptionsHtml(accountMap[n])}</select>
              </div>`).join('')}
          </div>
          <div class="modal-actions">
            <button class="btn btn-ghost" id="import-back">Voltar</button>
            <button class="btn btn-primary" id="import-continue">Continuar</button>
          </div>
        </div>`;
      overlay.querySelector('#import-back').onclick = drawStep1;
      overlay.querySelectorAll('.import-acc-select').forEach(sel=>{
        sel.onchange = ()=>{ accountMap[sel.dataset.sheetAcc] = sel.value; };
      });
      overlay.querySelector('#import-continue').onclick = drawStep3;
    }

    function drawStep3(){
      const newAccCount = Object.values(accountMap).filter(v=>v==='new').length;
      overlay.innerHTML = `
        <div class="modal">
          <h2>Pronto para importar</h2>
          <ul class="clear-data-list">
            <li>${parsed.rows.length} lançamento(s) de despesa/receita</li>
            <li>${parsed.transferRows.length} transferência(s)</li>
            <li>${newAccCount} conta(s) nova(s) serão criadas</li>
            <li>Categorias/subcategorias que já existem no app são reaproveitadas; as que não existem entram no grupo "Importados", pra você organizar depois</li>
            <li>O status "Paga"/"Pendente" da planilha vira o selo de pago/pendente no app</li>
          </ul>
          <div class="card-sub">Isso não apaga nada que já existe — só adiciona.</div>
          <div class="modal-actions">
            <button class="btn btn-ghost" id="import-back2">Voltar</button>
            <button class="btn btn-primary" id="import-run">Importar agora</button>
          </div>
        </div>`;
      overlay.querySelector('#import-back2').onclick = drawStep2;
      overlay.querySelector('#import-run').onclick = runImport;
    }

    async function runImport(){
      overlay.querySelector('.modal').innerHTML = `<h2>Importando…</h2><div class="card-sub">Isso pode levar alguns segundos pra planilhas grandes.</div>`;
      await new Promise(r=>setTimeout(r, 30)); // deixa a tela acima pintar antes do trabalho pesado

      const resolvedAccounts = {};
      Object.entries(accountMap).forEach(([sheetName, mapping])=>{
        if(mapping==='new'){
          const acc = { id: uid(), name: sheetName.trim(), type:'Banco', balance: 0, color:'#3F6E92' };
          state.accounts.push(acc);
          resolvedAccounts[sheetName] = acc.id;
        } else {
          resolvedAccounts[sheetName] = mapping;
        }
      });

      let created = 0;
      parsed.rows.forEach(r=>{
        const date = parseBrDate(r['Data']);
        const amount = Number(r['Valor']);
        if(!date || !amount) return;
        const type = amount<0 ? 'expense' : 'income';
        const accountId = resolvedAccounts[String(r['Conta']).trim()];
        if(!accountId) return;
        const cat = r['Categoria'] ? ensureCategory(r['Categoria'], type) : null;
        const sub = cat && r['Subcategoria'] ? ensureSubcategory(cat, r['Subcategoria']) : null;
        const paid = String(r['Situação']||'').trim().toLowerCase()==='paga';
        state.transactions.push({
          id: uid(), desc: (r['Descrição']||'Importado').toString().trim(), amount, date,
          type, categoryId: cat?cat.id:undefined, subcategoryId: sub?sub.id:undefined, accountId,
          paid
        });
        created++;
      });

      let transfersCreated = 0;
      parsed.transferRows.forEach(r=>{
        const date = parseBrDate(r['Data']);
        const amount = Math.abs(Number(r['Valor']));
        const fromAccountId = resolvedAccounts[String(r['Conta origem']).trim()];
        const toAccountId = resolvedAccounts[String(r['Conta destino']).trim()];
        if(!date || !amount || !fromAccountId || !toAccountId || fromAccountId===toAccountId) return;
        state.transactions.push({
          id: uid(), desc: 'Transferência importada', amount, date,
          type: 'transfer', fromAccountId, toAccountId
        });
        transfersCreated++;
      });

      await saveState();
      overlay.querySelector('.modal').innerHTML = `
        <h2>Importação concluída 🎉</h2>
        <div class="card-sub">${created} lançamento(s) e ${transfersCreated} transferência(s) foram adicionados.</div>
        <div class="modal-actions">
          <button class="btn btn-primary" id="import-done">Ver contas</button>
        </div>`;
      overlay.querySelector('#import-done').onclick = ()=>{ closeModal(); currentPage='accounts'; render(); };
    }

    drawStep1();
  }

  function openCaixinhaMoveModal(account, caixinha){
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'modalOverlay';
    const available = computeAccountBalance(account.id) - (account.caixinhas||[]).reduce((s,c)=>s+c.balance,0);
    overlay.innerHTML = `

          <button type="button" data-dir="in" class="active income">Depositar</button>
          <button type="button" data-dir="out">Resgatar</button>

          <input type="text" inputmode="decimal" id="cx-amount" placeholder="0,00">

          <button class="btn btn-primary" id="cx-save">Confirmar</button>
        </div>
      </div>`;
    root.appendChild(overlay);
    attachMoneyMask(document.getElementById('cx-amount'));
    let dir = 'in';
    overlay.querySelectorAll('.type-toggle button').forEach(btn=>{
      btn.onclick = ()=>{
        dir = btn.dataset.dir;
        overlay.querySelectorAll('.type-toggle button').forEach(b=>b.classList.remove('active','income','expense'));
        btn.classList.add('active', dir==='in'?'income':'expense');
      };
    });
    overlay.querySelector('#cx-cancel').onclick = closeModal;
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
    overlay.querySelector('#cx-save').onclick = async ()=>{
      const amount = parseMoneyInput(document.getElementById('cx-amount').value);
      if(isNaN(amount) || amount<=0){ alert('Informe um valor válido.'); return; }
      if(dir==='in'){
        if(amount>available+0.001){ alert('Saldo insuficiente disponível na conta.'); return; }
        caixinha.balance = Math.round((caixinha.balance+amount)*100)/100;
      } else {
        if(amount>caixinha.balance+0.001){ alert('A caixinha não tem esse valor disponível.'); return; }
        caixinha.balance = Math.round((caixinha.balance-amount)*100)/100;
      }
      await saveState(); closeModal(); renderAccounts();
    };
  }

      const closingDay = closingDayRaw ? Math.min(31, Math.max(1, parseInt(closingDayRaw,10)||0)) : null;
      if(!name){ alert('Dê um nome para a conta.'); return; }
      if(isEdit){

      await saveState(); closeModal(); render();

        </div>
        <div class="modal-actions">
          ${isEdit?'<button class="btn btn-danger" id="c-delete">Excluir</button>':''}
          <button class="btn btn-ghost" id="c-cancel">Cancelar</button>
          <button class="btn btn-primary" id="c-save">Salvar</button>
        </div>
      </div>`;
    root.appendChild(overlay);
    attachSmartCapitalize(document.getElementById('c-name'));
    let selType = startType;
    let selIcon = startIcon;
    const groupSel = ()=> document.getElementById('c-group');
    if(!groupOpts(startType)){
      groupSel().innerHTML = '<option value="">Nenhum grupo — crie um primeiro</option>';
    }
    function currentGroupColor(){
      const g = (state.groups||[]).find(x=>x.id===groupSel().value);
      return g ? g.color : '#7C8880';
    }
    function refreshColorPreview(){
      document.getElementById('c-color-preview').style.background = currentGroupColor();
    }
    refreshColorPreview();
    groupSel().onchange = refreshColorPreview;
    overlay.querySelectorAll('.icon-pick').forEach(btn=>{
      btn.onclick = ()=>{
        selIcon = btn.dataset.icon;
        overlay.querySelectorAll('.icon-pick').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
      };
    });
    overlay.querySelectorAll('.type-toggle button').forEach(btn=>{
      btn.onclick = ()=>{
        selType = btn.dataset.type;
        overlay.querySelectorAll('.type-toggle button').forEach(b=>b.classList.remove('active','expense','income'));
        btn.classList.add('active', selType);
        groupSel().innerHTML = groupOpts(selType) || '<option value="">Nenhum grupo — crie um primeiro</option>';
        groupSel().onchange = refreshColorPreview;
        refreshColorPreview();
      };
    });
    overlay.querySelector('#c-cancel').onclick = closeModal;
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
    if(isEdit){
      overlay.querySelector('#c-delete').onclick = async ()=>{
        if(state.transactions.some(t=>t.categoryId===existing.id) || state.bills.some(b=>b.categoryId===existing.id)){
          alert('Não é possível excluir: existem lançamentos vinculados a esta categoria.');
          return;
        }
        state.categories = state.categories.filter(c=>c.id!==existing.id);
        delete state.budgets[existing.id];
        if(state.goals) delete state.goals[existing.id];
        await saveState(); closeModal(); renderCategories();
      };
    }
    overlay.querySelector('#c-save').onclick = async ()=>{
      const name = document.getElementById('c-name').value.trim();
      const groupId = groupSel().value;
      if(!name){ alert('Dê um nome para a categoria.'); return; }
      if(!groupId){ alert('Crie um grupo antes de adicionar uma categoria.'); return; }
      const color = currentGroupColor();
      if(isEdit){
        Object.assign(existing, {name: toStandardCase(name), type: selType, groupId, color, icon: selIcon});
      } else {
        state.categories.push({id: uid(), name: toStandardCase(name), type: selType, groupId, color, icon: selIcon, subcategories: []});
      }
      await saveState(); closeModal(); renderCategories();
    };
  }

  function openGroupModal(existing){
    const isEdit = !!existing;
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'modalOverlay';
    const icons = ICON_BANK;
    const startIcon = isEdit ? (existing.icon || icons[0]) : icons[0];
    const iconBtns = icons.map((ic,i)=>`<button type="button" class="icon-pick ${ic===startIcon?'active':''}" data-icon="${ic}">${categoryIconSvg(ic) || ic}</button>`).join('');
    const startType = isEdit ? existing.type : 'expense';
    const startColor = isEdit ? existing.color : '#3F6E92';
    const catCount = isEdit ? state.categories.filter(c=>c.groupId===existing.id).length : 0;
    overlay.innerHTML = `
      <div class="modal">
        <h2>${isEdit?'Editar grupo':'Novo grupo'}</h2>
        <div class="field"><label>Nome</label><input type="text" id="g-name" value="${isEdit?escapeHtml(existing.name):''}" placeholder="Ex: Fixos"></div>
        <div class="field"><label>Tipo</label>
          ${isEdit
            ? `<div class="muted-note">${startType==='income'?'Receita':'Despesa'} — o tipo não pode ser alterado depois de criado.</div>`
            : `<div class="type-toggle">
                <button type="button" data-type="expense" class="active expense">Despesa</button>
                <button type="button" data-type="income">Receita</button>
              </div>`}
        </div>
        <div class="field"><label>Ícone</label><div class="icon-grid">${iconBtns}</div></div>
        <div class="field"><label>Cor</label><input type="color" id="g-color" value="${startColor}" style="height:40px; padding:4px;">
          ${isEdit && catCount>0 ? `<div class="muted-note">Ao salvar, as ${catCount} categoria${catCount>1?'s':''} deste grupo também passam a usar essa cor.</div>` : ''}
        </div>
        <div class="modal-actions">
          ${isEdit?'<button class="btn btn-danger" id="g-delete">Excluir</button>':''}
          <button class="btn btn-ghost" id="g-cancel">Cancelar</button>
          <button class="btn btn-primary" id="g-save">Salvar</button>
        </div>
      </div>`;
    root.appendChild(overlay);
    attachSmartCapitalize(document.getElementById('g-name'));
    let selType = startType;
    let selIcon = startIcon;
    overlay.querySelectorAll('.icon-pick').forEach(btn=>{
      btn.onclick = ()=>{
        selIcon = btn.dataset.icon;
        overlay.querySelectorAll('.icon-pick').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
      };
    });
    overlay.querySelectorAll('.type-toggle button').forEach(btn=>{
      btn.onclick = ()=>{
        selType = btn.dataset.type;
        overlay.querySelectorAll('.type-toggle button').forEach(b=>b.classList.remove('active','expense','income'));
        btn.classList.add('active', selType);
      };
    });
    overlay.querySelector('#g-cancel').onclick = closeModal;
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
    if(isEdit){
      overlay.querySelector('#g-delete').onclick = async ()=>{
        if(state.categories.some(c=>c.groupId===existing.id)){
          alert('Não é possível excluir: existem categorias vinculadas a este grupo.');
          return;
        }
        state.groups = state.groups.filter(g=>g.id!==existing.id);
        await saveState(); closeModal(); renderCategories();
      };
    }
    overlay.querySelector('#g-save').onclick = async ()=>{
      const name = document.getElementById('g-name').value.trim();
      const color = document.getElementById('g-color').value;
      if(!name){ alert('Dê um nome para o grupo.'); return; }
      if(isEdit){
        Object.assign(existing, {name: toStandardCase(name), icon: selIcon, color});
        syncCategoryColorsToGroups();
      } else {
        state.groups.push({id: uid(), name: toStandardCase(name), type: selType, color, icon: selIcon});
      }
      await saveState(); closeModal(); renderCategories();
    };
  }

  // ---------- LOGIN ----------
  function updateAccountFoot(){
    const email = authSession && authSession.email;
    [['accountFoot','accountEmail'], ['accountFootMobile','accountEmailMobile']].forEach(([footId, emailId])=>{
      const foot = document.getElementById(footId);
      if(email){
        foot.classList.add('visible');
        document.getElementById(emailId).textContent = email;
      } else {
        foot.classList.remove('visible');
      }
    });
  }

          <div class="login-sub">${mode==='login' ? 'Entre com seu e-mail e senha' : 'Crie sua conta'}</div>
          <div class="field"><label>E-mail</label><input type="email" id="login-email" placeholder="voce@email.com"></div>
          <div class="field"><label>Senha</label><input type="password" id="login-pass" placeholder="••••••••"></div>
          <div class="login-error" id="login-error"></div>
          <button class="btn btn-primary" id="login-submit" style="width:100%; justify-content:center;">${mode==='login'?'Entrar':'Criar conta'}</button>
          <div class="login-switch">${mode==='login' ? 'Não tem conta? <a href="#" id="switchMode">Criar uma</a>' : 'Já tem conta? <a href="#" id="switchMode">Entrar</a>'}</div>
          <div class="login-switch" style="margin-top:8px;"><a href="#" id="loginSbSettings">Configurações do Supabase</a></div>
        </div>`;
      document.getElementById('loginSbSettings').onclick = (e)=>{ e.preventDefault(); openSupabaseModal(); };
      document.getElementById('switchMode').onclick = (e)=>{ e.preventDefault(); mode = mode==='login'?'signup':'login'; draw(); };
      const submit = async ()=>{
        const email = document.getElementById('login-email').value.trim();
        const pass = document.getElementById('login-pass').value;
        const errEl = document.getElementById('login-error');
        errEl.style.color = 'var(--rust)';
        errEl.textContent = '';
        if(!email || !pass){ errEl.textContent = 'Preencha e-mail e senha.'; return; }
        try{
          const data = mode==='login' ? await signInWithPassword(email, pass) : await signUpWithPassword(email, pass);
          if(!data.access_token){
            errEl.style.color = 'var(--forest)';
            errEl.textContent = 'Conta criada! Verifique seu e-mail para confirmar antes de entrar.';
            mode = 'login'; draw();
            return;
          }
          setAuthSession(data);
          await afterLogin();
        } catch(e){
          errEl.textContent = e.message;
        }
      };
      document.getElementById('login-submit').onclick = submit;
      mainEl.querySelectorAll('#login-email, #login-pass').forEach(inp=>{
        inp.addEventListener('keydown', ev=>{ if(ev.key==='Enter') submit(); });
      });
    }
    draw();
  }

  async function afterLogin(){
    root.classList.remove('login-mode');
    mainEl.innerHTML = `<div style="padding:60px; text-align:center; color:var(--slate-mute);">Carregando seus dados...</div>`;
    try {
      const remote = await pullFromSupabase(state.settings.supabaseUrl, state.settings.supabaseKey);
      if(remote){
        remote.settings = remote.settings || {};
        remote.settings.supabaseUrl = state.settings.supabaseUrl;
        remote.settings.supabaseKey = state.settings.supabaseKey;
        state = remote;
      }
    } catch(e){ console.error('supabase pull failed', e); }
    if(!state.settings) state.settings = {theme:'light'};
    state.settings.hideValues = true; // ao logar, os valores sempre começam escondidos
    updateAccountFoot();
    await finishBoot();
    resetInactivityTimer();
  }

  async function onLogoutClick(){
    await clearAuthSession();
    updateAccountFoot();
    closeMoreSheet();
    renderLoginScreen();
  }
  document.getElementById('logoutBtn').addEventListener('click', onLogoutClick);
  document.getElementById('logoutBtnMobile').addEventListener('click', onLogoutClick);

  // ---------- LOGOUT AUTOMÁTICO POR INATIVIDADE ----------
  const INACTIVITY_LIMIT_MS = 10 * 60 * 1000; // 10 minutos sem nenhuma interação
  let inactivityTimer = null;
  function resetInactivityTimer(){
    if(inactivityTimer) clearTimeout(inactivityTimer);
    if(!authSession) return; // sem sessão (modo local, ou já deslogado) — nada a expirar
    inactivityTimer = setTimeout(async ()=>{
      if(!authSession) return;
      await onLogoutClick();
      alert('Sua sessão foi encerrada por inatividade. Faça login novamente.');
    }, INACTIVITY_LIMIT_MS);
  }
  ['mousemove','mousedown','keydown','touchstart','scroll'].forEach(evt=>{
    document.addEventListener(evt, resetInactivityTimer, {passive:true});
  });
  resetInactivityTimer();

  // ---------- INIT ----------
  async function init(){
    mainEl.innerHTML = `<div style="padding:60px; text-align:center; color:var(--slate-mute);">Carregando seus dados...</div>`;
    await loadState();
    await loadAuthSession();
    const configured = !!(state.settings.supabaseUrl && state.settings.supabaseKey);

    if(configured && authSession && authSession.expires_at && Date.now() > authSession.expires_at - 30000){
      const ok = await refreshAuthSession();
      if(!ok) authSession = null;
    }

    if(configured && !authSession){
      renderLoginScreen();
      return;
    }
    if(configured && authSession){
      updateAccountFoot();
      await afterLogin();
      return;
    }
    // Supabase não configurado — segue localmente, sem exigir login.
    await finishBoot();
  }
  init();
})();
</script>
