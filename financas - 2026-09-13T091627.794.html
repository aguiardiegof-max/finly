      const dailyEditTag = miniTagHtml('groupDailyGoal:'+r.g.id, dailyGoal>0 ? `${dailyIndicator}média diária ${fmt(avgPerDay)} · meta ${fmt(dailyGoal)} ✎` : (daysElapsedDash>0 ? `média diária ${fmt(avgPerDay)} · + meta` : '+ meta diária'), dailyGoal||'', '0,00', !dailyGoal);
      return `<div class="goal-row">
        <div class="goal-row-top">
          <div class="goal-row-name">${categoryBadgeHtml(r.g.icon, r.g.color, '📁')}${escapeHtml(r.g.name)} <span class="farol-dot" title="${r.over?'Estourou a meta':r.goalPct>0 && r.realizedPct/r.goalPct*100>=75?'Perto do limite':'Dentro da meta'}">${r.farol.emoji}</span></div>
          ${tag}
        </div>
        <div class="goal-track"><div class="goal-fill" style="width:${barPct}%; background:${r.farol.color}"></div></div>
        <div class="goal-row-bottom">
          <span>Realizado: <strong class="mono">${fmt(r.spent)}</strong> (${r.realizedPct.toFixed(1)}%)</span>
          <span>${r.goalPct>0 ? `Meta: ${r.goalPct}% ${incomeGoal>0?'· ≈ '+fmt(r.goalReais):''}` : 'Sem meta definida'}</span>
        </div>
        <div class="goal-row-bottom" style="margin-top:4px;">
          ${dailyEditTag}
        </div>
        ${r.reimb>0 ? `<div class="goal-row-bottom" style="margin-top:4px; color:var(--slate-mute); font-size:12px;">↩️ + ${fmt(r.reimb)} em reembolso — o valor total das despesas neste grupo é ${fmt(r.spent+r.reimb)}</div>` : ''}
      </div>`;
    }).join('') || `<div class="empty-state">Crie grupos de despesa pra poder definir metas.</div>`;

    // ---- Tabela Mês × Anual (comparação de meta com o realizado, no mês e acumulado no ano) ----
    const monthsElapsed = currentMonth + 1;
    const annualIncomeGoal = incomeGoal * monthsElapsed;
    const ytdSpentByGroup = {};
    for(let m=0; m<=currentMonth; m++){
      txForMonth(currentYear, m).filter(t=>t.type==='expense').forEach(t=>{
        const c = catById(t.categoryId);
        if(!c) return;
        if(isReimbTx(t, reimbIdsG)) return;
        ytdSpentByGroup[c.groupId] = (ytdSpentByGroup[c.groupId]||0) + (-t.amount);
      });
    }
    const compareRows = groupGoalRows.map(r=>{
      const ytdSpent = ytdSpentByGroup[r.g.id] || 0;
      const annualRealizedPct = annualIncomeGoal>0 ? (ytdSpent/annualIncomeGoal*100) : 0;
      const annualDiff = annualRealizedPct - r.goalPct;
      const annualOver = r.goalPct>0 && annualRealizedPct>r.goalPct;
      const annualFarol = farolFor(r.goalPct>0 ? (annualRealizedPct/r.goalPct*100) : 0, annualOver);
      return { g: r.g, goalPct: r.goalPct, monthPct: r.realizedPct, monthFarol: r.farol, annualPct: annualRealizedPct, annualDiff, annualFarol };
    });
    const totalGoalPct = compareRows.reduce((s,r)=>s+r.goalPct,0);
    const totalMonthPct = compareRows.reduce((s,r)=>s+r.monthPct,0);
    const totalAnnualPct = compareRows.reduce((s,r)=>s+r.annualPct,0);

    const pctFmt = (n) => `${n.toFixed(2).replace('.',',')}%`;
    const compareRowsHtml = compareRows.map(r=>`
      <tr>
        <td class="gct-name">${categoryBadgeHtml(r.g.icon, r.g.color, '📁')}${escapeHtml(r.g.name)}</td>
        <td class="mono">${pctFmt(r.goalPct)}</td>
        <td class="mono">${pctFmt(r.monthPct)}</td>
        <td class="gct-farol">${r.monthFarol.emoji}</td>
        <td class="mono">${pctFmt(r.goalPct)}</td>
        <td class="mono">${pctFmt(r.annualPct)}</td>
        <td class="mono" style="color:${r.annualDiff<0?'var(--forest)':'var(--rust)'}">${r.annualDiff>=0?'+':''}${pctFmt(r.annualDiff)}</td>
        <td class="gct-farol">${r.annualFarol.emoji}</td>
      </tr>`).join('');
    const compareTableHtml = `
      <table class="goal-compare-table">
        <thead>
          <tr><th rowspan="2">Grupo</th><th colspan="3">Mês</th><th colspan="4">Anual</th></tr>
          <tr><th>Meta</th><th>Realizado</th><th></th><th>Meta</th><th>Realizado</th><th>Diferença</th><th></th></tr>
        </thead>
        <tbody>
          ${compareRowsHtml}
          <tr class="gct-total-row">
            <td>Despesas total</td>
            <td class="mono">${pctFmt(totalGoalPct)}</td>
            <td class="mono">${pctFmt(totalMonthPct)}</td>
            <td></td>
            <td class="mono">${pctFmt(totalGoalPct)}</td>
            <td class="mono">${pctFmt(totalAnnualPct)}</td>
            <td></td>
            <td></td>
          </tr>
        </tbody>
      </table>`;
    const catGoalEntries = Object.entries(state.budgets||{}).map(([catId,goal])=>{
      const cat = catById(catId);
      if(!cat || !goal) return null;
      const spent = monthTx.filter(t=>t.categoryId===catId).reduce((s,t)=>s+(-t.amount),0);
      const variance = goal - spent; // positivo = folga, negativo = estourou (gargalo)
      const pctGoal = goal>0 ? (spent/goal*100) : 0;
      const over = spent>goal;
      return { cat, goal, spent, variance, farol: farolFor(pctGoal, over) };
    }).filter(Boolean).sort((a,b)=>a.variance-b.variance);
    const maxAbsVariance = Math.max(1, ...catGoalEntries.map(e=>Math.abs(e.variance)));

    const catDivergingHtml = catGoalEntries.map(e=>{
      const half = Math.min(50, Math.abs(e.variance)/maxAbsVariance*50);
      const isNeg = e.variance<0;
      return `<div class="divbar-row">
        <div class="divbar-label"><span class="farol-dot">${e.farol.emoji}</span>${escapeHtml(e.cat.name)}</div>
        <div class="divbar-track">
          <div class="divbar-center"></div>
          <div class="divbar-fill ${isNeg?'neg':'pos'}" style="width:${half.toFixed(1)}%;"></div>
        </div>
        <div class="divbar-value mono" style="color:${isNeg?'var(--rust)':'var(--forest)'}">${isNeg?'-':'+'}${fmt(Math.abs(e.variance))}</div>
      </div>`;
    }).join('') || `<div class="empty-state">Defina metas por categoria em Orçamentos pra ver essa comparação aqui.</div>`;

    // ---- Balanço mês a mês (receita x despesa) — últimos 6 meses ou ano todo ----
    const monthsBack = 6;
    const monthlyData = [];
    if(dashboardBalanceRange==='year'){
      for(let m=0; m<12; m++){
        const txs = txForMonth(currentYear, m);
        const inc = txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
        const exp = Math.abs(txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0));
        monthlyData.push({y: currentYear, m, inc, exp});
      }
    } else {
      for(let i=monthsBack-1; i>=0; i--){
        let m = currentMonth - i, y = currentYear;
        while(m<0){ m+=12; y--; }
        const txs = txForMonth(y,m);
        const inc = txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
        const exp = Math.abs(txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0));
        monthlyData.push({y, m, inc, exp});
      }
    }
    const balanceChartSvg = monthlyBalanceChartSvg(monthlyData);

    // ---- Reembolsos no ano — mês a mês desde janeiro: quanto saiu e quanto
    // voltou, com pendente/recebido acumulados. Card fica no final da aba.
    const reimbHasCategoryAnnual = reimbIdsG.expenseId!==null || reimbIdsG.incomeId!==null;
    const reimbOutByMonth = new Array(12).fill(0);
    const reimbInByMonth = new Array(12).fill(0);
    for(let m=0; m<12; m++){
      txForMonth(currentYear, m).forEach(t=>{
        if(!isReimbTx(t, reimbIdsG)) return;
        if(t.type==='expense') reimbOutByMonth[m] += (-t.amount);
        else if(t.type==='income') reimbInByMonth[m] += t.amount;
      });
    }
    const reimbOutYtd = reimbOutByMonth.reduce((s,v)=>s+v,0);
    const reimbInYtd = reimbInByMonth.reduce((s,v)=>s+v,0);
    const reimbPendingYtd = Math.max(0, reimbOutYtd - reimbInYtd);
    const reimbAnnualCardHtml = reimbHasCategoryAnnual ? `
      <div class="card" style="margin-top:16px;">
        <div class="card-title">Reembolsos — ${currentYear}</div>
        <div class="card-sub">Quanto saiu e quanto voltou em cada mês, desde o início do ano</div>
        <div class="grid-2" style="margin-top:10px;">
          <div class="card stat-card">
            <div class="stat-label">Pendente no ano</div>
            <div class="stat-value mono" style="color:${reimbPendingYtd>0?'var(--rust)':'var(--forest-deep)'};">${fmt(reimbPendingYtd)}</div>
          </div>
          <div class="card stat-card">
            <div class="stat-label">Recebido no ano</div>
            <div class="stat-value mono pos">${fmt(reimbInYtd)}</div>
          </div>
        </div>
        ${reimbAnnualChartSvg(reimbOutByMonth, reimbInByMonth)}
      </div>` : `
      <div class="card" style="margin-top:16px;">
        <div class="card-title">Reembolsos</div>
        <div class="card-sub">Crie uma categoria de despesa chamada "Reembolso" (e, se quiser rastrear o recebimento, uma categoria de receita com o mesmo nome) pra ativar esse painel automaticamente.</div>
      </div>`;

    const incomeGoalTag = incomeGoal>0
      ? miniTagHtml('income', `Meta de receita: ${fmt(incomeGoal)} ✎`, incomeGoal, '0,00')
      : miniTagHtml('income', '+ Definir meta de receita', '', '0,00', true);

    mainEl.innerHTML = `
      <div id="rumo-header">
        <div><h1>Dashboard</h1><div class="subtitle">Metas, gargalos e o balanço dos últimos meses · ${incomeGoalTag}</div></div>
        ${monthSwitchHtml()}
      </div>

      <div class="card" style="margin-bottom:16px;">
        <div class="card-title">Metas por grupo</div>
        <div class="card-sub">${incomeGoal>0 ? 'Percentual da meta de receita reservado pra cada grupo — 🟢 dentro da meta, 🟡 perto do limite, 🔴 estourou' : 'Defina a meta de receita acima pra habilitar o cálculo em %'}</div>
        <div class="goal-list">${groupGoalsHtml}</div>
      </div>

      <div class="card" style="margin-bottom:16px; overflow-x:auto;">
        <div class="card-title">Mês × Anual, por grupo</div>
        <div class="card-sub">Meta e realizado comparados no mês atual e acumulado no ano (${currentYear})</div>
        ${compareTableHtml}
      </div>

      <div class="card" style="margin-bottom:16px;">
        <div class="card-title">Categorias: realizado × meta</div>
        <div class="card-sub">Do maior gargalo (estourou mais) ao melhor resultado (mais dentro da meta)</div>
        <div class="divbar-list">${catDivergingHtml}</div>
      </div>

      <div class="card">
        <div class="card-head-row">
          <div>
            <div class="card-title">Balanço mês a mês</div>
            <div class="card-sub">Receita × despesa ${dashboardBalanceRange==='year' ? `no ano de ${currentYear}` : `nos últimos ${monthsBack} meses`}</div>
          </div>
          <div class="type-toggle" id="dashBalanceToggle" style="width:auto;">
            <button type="button" data-balance-range="6m" class="${dashboardBalanceRange==='6m'?'active income':''}">6 meses</button>
            <button type="button" data-balance-range="year" class="${dashboardBalanceRange==='year'?'active income':''}">Ano todo</button>
          </div>
        </div>
        ${balanceChartSvg}
      </div>

      ${reimbAnnualCardHtml}
    `;
    bindMonthSwitch();
    bindMiniTags(async (field, rawValue)=>{
      const val = parseFloat((rawValue||'').replace(',','.')) || 0;
      if(field==='income'){
        state.incomeGoal = val;
      } else if(field.startsWith('group:')){
        state.groupBudgets[field.slice(6)] = Math.min(100, Math.max(0, val));
      } else if(field.startsWith('groupDailyGoal:')){
        if(!state.groupDailyGoals) state.groupDailyGoals = {};
        state.groupDailyGoals[field.slice(15)] = val;
      }
      await saveState();
      renderGoalsDashboard();
    });
    const dashBalanceToggle = document.getElementById('dashBalanceToggle');
    if(dashBalanceToggle) dashBalanceToggle.querySelectorAll('button').forEach(btn=>{
      btn.onclick = ()=>{ dashboardBalanceRange = btn.dataset.balanceRange; renderGoalsDashboard(); };
    });
  }

  // Gráfico "saiu × voltou" por mês, pra visualizar o reembolso ao longo do
  // ano de um jeito rápido — mesmo espírito do gráfico de balanço mensal.
  function reimbAnnualChartSvg(outByMonth, inByMonth){
    const w=700, h=290, padL=44, padR=20, padT=38, padB=38;
    const chartW = w-padL-padR, chartH = h-padT-padB;
    const maxVal = Math.max(1, ...outByMonth, ...inByMonth);
    const groupGap = chartW/12;
    const barW = Math.min(22, groupGap*0.32);
    let bars = '';
    for(let i=0;i<12;i++){
      const gx = padL + i*groupGap + groupGap/2;
      const outH = (outByMonth[i]/maxVal)*chartH;
      const inH = (inByMonth[i]/maxVal)*chartH;
      const outX = gx - barW - 3;
      const inX = gx + 3;
      const outY = padT + chartH - outH;
      const inY = padT + chartH - inH;
      if(outByMonth[i]>0.01) bars += `<rect x="${outX.toFixed(1)}" y="${outY.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1,outH).toFixed(1)}" rx="3" fill="var(--rust)"></rect>`;
      if(inByMonth[i]>0.01) bars += `<rect x="${inX.toFixed(1)}" y="${inY.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1,inH).toFixed(1)}" rx="3" fill="var(--forest)"></rect>`;
      if(outByMonth[i]>0.01) bars += `<text x="${(outX+barW/2).toFixed(1)}" y="${(outY-7).toFixed(1)}" font-size="11" font-weight="700" fill="var(--rust)" text-anchor="middle" font-family="Inter, sans-serif">${outByMonth[i].toLocaleString('pt-BR',{maximumFractionDigits:0})}</text>`;
      if(inByMonth[i]>0.01) bars += `<text x="${(inX+barW/2).toFixed(1)}" y="${(inY-7).toFixed(1)}" font-size="11" font-weight="700" fill="var(--forest)" text-anchor="middle" font-family="Inter, sans-serif">${inByMonth[i].toLocaleString('pt-BR',{maximumFractionDigits:0})}</text>`;
      bars += `<text x="${gx.toFixed(1)}" y="${h-14}" font-size="13" font-weight="600" fill="var(--slate-mute)" text-anchor="middle" font-family="Inter, sans-serif">${MONTHS[i].slice(0,3)}</text>`;
    }
    bars += `<line x1="${padL}" y1="${(padT+chartH).toFixed(1)}" x2="${w-padR}" y2="${(padT+chartH).toFixed(1)}" stroke="var(--line-strong)" stroke-width="1"></line>`;
    const legend = `<g font-family="Inter, sans-serif" font-size="13" font-weight="600">
      <rect x="${padL}" y="8" width="11" height="11" rx="2" fill="var(--rust)"></rect>
      <text x="${padL+16}" y="17.5" fill="var(--slate-mute)">Saiu</text>
      <rect x="${padL+72}" y="8" width="11" height="11" rx="2" fill="var(--forest)"></rect>
      <text x="${padL+88}" y="17.5" fill="var(--slate-mute)">Voltou</text>
    </g>`;
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:290px; display:block;">${legend}${bars}</svg>`;
  }

  function monthlyBalanceChartSvg(monthlyData){
    const dense = monthlyData.length>6;
    const w = 700, h = 260, padL = 10, padR = 10, padT = 34, padB = 30;
    const chartW = w-padL-padR, chartH = h-padT-padB;
    const maxVal = Math.max(1, ...monthlyData.flatMap(d=>[d.inc, d.exp]));
    const groupGap = chartW/monthlyData.length;
    const barW = Math.min(dense?20:30, groupGap*0.3);
    const valueFontSize = dense ? 7.5 : 8.5;
    const monthFontSize = dense ? 9 : 10.5;
    let bars = '';
    monthlyData.forEach((d,i)=>{
      const gx = padL + i*groupGap + groupGap/2;
      const incH = (d.inc/maxVal)*chartH;
      const expH = (d.exp/maxVal)*chartH;
      const incX = gx - barW - 3;
      const expX = gx + 3;
      const incY = padT + chartH - incH;
      const expY = padT + chartH - expH;
      bars += `<rect x="${incX.toFixed(1)}" y="${incY.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1,incH).toFixed(1)}" rx="2" fill="var(--forest)"></rect>`;
      bars += `<rect x="${expX.toFixed(1)}" y="${expY.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1,expH).toFixed(1)}" rx="2" fill="var(--rust)"></rect>`;
      if(d.inc>0) bars += `<text x="${incX+barW/2}" y="${(incY-5).toFixed(1)}" font-size="${valueFontSize}" fill="var(--forest)" text-anchor="middle" font-family="Inter, sans-serif">${d.inc.toLocaleString('pt-BR',{maximumFractionDigits:0})}</text>`;
      if(d.exp>0) bars += `<text x="${expX+barW/2}" y="${(expY-5).toFixed(1)}" font-size="${valueFontSize}" fill="var(--rust)" text-anchor="middle" font-family="Inter, sans-serif">${d.exp.toLocaleString('pt-BR',{maximumFractionDigits:0})}</text>`;
      bars += `<text x="${gx.toFixed(1)}" y="${h-8}" font-size="${monthFontSize}" fill="var(--slate-mute)" text-anchor="middle" font-family="Inter, sans-serif">${MONTHS[d.m].slice(0,3)}/${String(d.y).slice(2)}</text>`;
    });
    bars += `<line x1="${padL}" y1="${padT+chartH}" x2="${w-padR}" y2="${padT+chartH}" stroke="var(--line)" stroke-width="1"></line>`;
    const legend = `<g font-family="Inter, sans-serif" font-size="10.5">
      <rect x="${padL}" y="6" width="10" height="10" rx="2" fill="var(--forest)"></rect>
      <text x="${padL+14}" y="15" fill="var(--slate-mute)">Receita</text>
      <rect x="${padL+80}" y="6" width="10" height="10" rx="2" fill="var(--rust)"></rect>
      <text x="${padL+94}" y="15" fill="var(--slate-mute)">Despesa</text>
    </g>`;
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:260px; display:block;">${legend}${bars}</svg>`;
  }

  // ---------- PLANEJAMENTO (calendário de eventos, sem vínculo com dados reais) ----------
  const PLANNING_TYPES = [
    {id:'birthday', label:'Aniversário', emoji:'🎂', color:'#B8913C'},
    {id:'event', label:'Evento', emoji:'📅', color:'#3F6E92'},
    {id:'project', label:'Projeto', emoji:'💰', color:'#1F6E4A'},
    {id:'other', label:'Outro', emoji:'📌', color:'#8C6FB0'},
  ];
  function planningTypeInfo(id){ return PLANNING_TYPES.find(t=>t.id===id) || PLANNING_TYPES[3]; }

  function renderPlanning(){
    const monthKey = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
    const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate();
    const firstDow = new Date(currentYear, currentMonth, 1).getDay();
    const monthEvents = state.planningEvents.filter(ev=> ev.date.slice(0,7)===monthKey).sort((a,b)=>a.date.localeCompare(b.date));
    const eventsByDay = {};
    monthEvents.forEach(ev=>{
      const day = parseInt(ev.date.slice(8,10),10);
      (eventsByDay[day] = eventsByDay[day]||[]).push(ev);
    });

    let cells = '';
    for(let i=0;i<firstDow;i++) cells += `<div class="plan-cell plan-empty"></div>`;
    const todayStr = new Date().toISOString().slice(0,10);
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const isToday = dateStr===todayStr;
      const dayEvents = eventsByDay[d] || [];
      const shown = dayEvents.slice(0,3);
      const extra = dayEvents.length - shown.length;
      cells += `<div class="plan-cell ${isToday?'is-today':''} ${dayEvents.length>0?'has-plan-events':''}" data-plan-day="${dateStr}">
        <span class="plan-day-num">${d}</span>
        <div class="plan-chips">
          ${shown.map(ev=>{
            const info = planningTypeInfo(ev.eventType);
            return `<div class="plan-chip" draggable="true" data-plan-event="${ev.id}" style="background:${info.color}22; border-color:${info.color}80; color:${info.color};" title="${escapeHtml(ev.title)}">${info.emoji} ${escapeHtml(ev.title)}</div>`;
          }).join('')}
          ${extra>0 ? `<div class="plan-chip-more">+${extra}</div>` : ''}
        </div>
      </div>`;
    }
    const totalCells = firstDow + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for(let i=0;i<trailing;i++) cells += `<div class="plan-cell plan-empty"></div>`;

    const weekDayLabels = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    const upcomingHtml = monthEvents.map(ev=>{
      const info = planningTypeInfo(ev.eventType);
      const cat = ev.categoryId ? catById(ev.categoryId) : null;
      const dLabel = new Date(ev.date+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',weekday:'short'});
      return `<div class="plan-list-row" data-plan-event="${ev.id}">
        <div class="plan-list-date mono">${dLabel}</div>
        <div class="plan-list-info">
          <div class="plan-list-title">${info.emoji} ${escapeHtml(ev.title)}${cat?` <span class="tag">${escapeHtml(cat.name)}</span>`:''}</div>
          ${ev.notes ? `<div class="plan-list-notes">${escapeHtml(ev.notes)}</div>` : ''}
        </div>
        <div class="plan-list-value mono">${ev.value ? fmt(ev.value) : ''}</div>
      </div>`;
    }).join('') || `<div class="empty-state">Nenhum evento cadastrado em ${MONTHS[currentMonth]}.</div>`;

    mainEl.innerHTML = `
      <div id="rumo-header">
        <div><h1>Planejamento</h1><div class="subtitle">Datas, projetos e lembretes financeiros — não entra nos seus relatórios</div></div>
        <div style="display:flex; gap:10px; align-items:center;">
          ${monthSwitchHtml()}
          <button class="btn btn-primary" id="addPlanBtn">+ Novo evento</button>
        </div>
      </div>

      <div class="card" style="margin-bottom:16px;">
        <div class="card-title">Meta do mês <span style="text-transform:none; font-weight:400; font-size:12px; color:var(--slate-mute);">(só anotação, não afeta cálculos)</span></div>
        <textarea id="planGoalNote" class="plan-goal-note" placeholder="Ex: economizar pra reforma, juntar entrada do carro...">${escapeHtml(state.planningNotes[monthKey]||'')}</textarea>
      </div>

      <div class="card" style="margin-bottom:16px;">
        <div class="card-title">Calendário — ${MONTHS[currentMonth]}</div>
        <div class="card-sub">Arraste um evento pra outro dia pra remarcar · clique num dia vazio pra criar um novo</div>
        <div class="plan-weekdays">${weekDayLabels.map(w=>`<div>${w}</div>`).join('')}</div>
        <div class="plan-grid">${cells}</div>
      </div>

      <div class="card">
        <div class="card-title">Eventos de ${MONTHS[currentMonth]}</div>
        <div class="plan-list">${upcomingHtml}</div>
      </div>
    `;
    bindMonthSwitch();
    document.getElementById('addPlanBtn').onclick = ()=> openPlanningEventModal();
    document.getElementById('planGoalNote').onchange = async (e)=>{
      state.planningNotes[monthKey] = e.target.value;
      await saveState();
    };
    mainEl.querySelectorAll('[data-plan-day]').forEach(cell=>{
      cell.addEventListener('click', (e)=>{
        if(e.target.closest('[data-plan-event]')) return;
        openPlanningEventModal(null, cell.dataset.planDay);
      });
      cell.addEventListener('dragover', (e)=>{ e.preventDefault(); cell.classList.add('plan-drop-hover'); });
      cell.addEventListener('dragleave', ()=> cell.classList.remove('plan-drop-hover'));
      cell.addEventListener('drop', async (e)=>{
        e.preventDefault();
        cell.classList.remove('plan-drop-hover');
        const evId = e.dataTransfer.getData('text/plain');
        const ev = state.planningEvents.find(x=>x.id===evId);
        if(ev){ ev.date = cell.dataset.planDay; await saveState(); renderPlanning(); }
      });
    });
    mainEl.querySelectorAll('[data-plan-event]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        openPlanningEventModal(state.planningEvents.find(x=>x.id===el.dataset.planEvent));
      });
      el.addEventListener('dragstart', (e)=>{
        e.dataTransfer.setData('text/plain', el.dataset.planEvent);
        e.dataTransfer.effectAllowed = 'move';
      });
    });
  }

  function openPlanningEventModal(existing, presetDate){
    const isEdit = !!existing;
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'modalOverlay';
    const catOptions = `<option value="">Nenhuma</option>` + [...state.categories].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')).map(c=>`<option value="${c.id}" ${isEdit&&existing.categoryId===c.id?'selected':''}>${c.icon?c.icon+' ':''}${escapeHtml(c.name)}</option>`).join('');
    overlay.innerHTML = `
      <div class="modal">
        <h2>${isEdit?'Editar evento':'Novo evento'}</h2>
        <div class="field"><label>Título</label><input type="text" id="pe-title" value="${isEdit?escapeHtml(existing.title):''}" placeholder="Ex: Aniversário da Maria"></div>
        <div class="field-row">
          <div class="field"><label>Data</label><input type="date" id="pe-date" value="${isEdit?existing.date:(presetDate||new Date().toISOString().slice(0,10))}"></div>
          <div class="field"><label>Tipo</label>
            <select id="pe-type">${PLANNING_TYPES.map(t=>`<option value="${t.id}" ${isEdit&&existing.eventType===t.id?'selected':''}>${t.emoji} ${t.label}</option>`).join('')}</select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Valor previsto (opcional)</label><input type="text" inputmode="decimal" id="pe-value" value="${isEdit&&existing.value?existing.value.toFixed(2).replace('.',','):''}" placeholder="0,00"></div>
          <div class="field"><label>Categoria (opcional)</label><select id="pe-cat">${catOptions}</select></div>
        </div>
        <div class="field"><label>Notas</label><textarea id="pe-notes" class="plan-goal-note" style="min-height:70px;" placeholder="Detalhes, lista de presença, o que precisa comprar...">${isEdit?escapeHtml(existing.notes||''):''}</textarea></div>
        <div class="modal-actions">
          ${isEdit?'<button class="btn btn-danger" id="pe-delete">Excluir</button>':''}
          <button class="btn btn-ghost" id="pe-cancel">Cancelar</button>
          <button class="btn btn-primary" id="pe-save">Salvar</button>
        </div>
      </div>`;
    root.appendChild(overlay);
    attachSmartCapitalize(document.getElementById('pe-title'));
    attachMoneyMask(document.getElementById('pe-value'));
    overlay.querySelector('#pe-cancel').onclick = closeModal;
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
    if(isEdit){
      overlay.querySelector('#pe-delete').onclick = async ()=>{
        state.planningEvents = state.planningEvents.filter(x=>x.id!==existing.id);
        await saveState(); closeModal(); renderPlanning();
      };
    }
    overlay.querySelector('#pe-save').onclick = async ()=>{
      const title = document.getElementById('pe-title').value.trim();
      const date = document.getElementById('pe-date').value;
      const eventType = document.getElementById('pe-type').value;
      const value = parseMoneyInput(document.getElementById('pe-value').value) || undefined;
      const categoryId = document.getElementById('pe-cat').value || undefined;
      const notes = document.getElementById('pe-notes').value.trim() || undefined;
      if(!title){ alert('Dê um título pro evento.'); return; }
      if(!date){ alert('Escolha uma data.'); return; }
      if(isEdit){
        Object.assign(existing, {title, date, eventType, value, categoryId, notes});
      } else {
        state.planningEvents.push({id: uid(), title, date, eventType, value, categoryId, notes});
      }
      await saveState(); closeModal(); renderPlanning();
    };
  }

  // ---------- BUDGETS ----------
  // ---------- METAS ----------
  // state.goals[catId] = { 'AAAA-M': valor } — mapa esparso por categoria.
  // Se um mês não tem valor próprio definido, herda o valor do mês definido
  // mais recente antes dele (senão 0). O valor efetivo do mês/ano atualmente
  // selecionado no topo do app (currentMonth/currentYear) é o que alimenta
  // state.budgets, usado em Orçamentos e no resto do app.
  // Migração única: os valores que já existiam em state.budgets (um único
  // limite fixo por categoria, sem distinção de mês) viram a meta do
  // mês/ano atual em state.goals — dali pra frente cada mês pode ter seu
  // próprio valor, mas o comportamento passado (mesmo valor todo mês) fica
  // preservado como ponto de partida.
  function migrateGoalsOnce(){
    if(state._goalsMigrationV1) return false;
    if(!state.goals) state.goals = {};
    Object.entries(state.budgets||{}).forEach(([catId, val])=>{
      if(val) setGoalValue(catId, currentYear, currentMonth, val);
    });
    state._goalsMigrationV1 = true;
    return true;
  }
  function goalKey(year, month){ return year + '-' + month; }
  function effectiveGoal(catId, year, month){
    const g = state.goals && state.goals[catId];
    let y = year, m = month;
    for(let i=0; i<600; i++){
      if(g && g[goalKey(y,m)] !== undefined) return g[goalKey(y,m)];
      m--; if(m<0){ m=11; y--; }
    }
    return 0;
  }
  function setGoalValue(catId, year, month, val){
    if(!state.goals) state.goals = {};
    if(!state.goals[catId]) state.goals[catId] = {};
    if(val===null) delete state.goals[catId][goalKey(year,month)];
    else state.goals[catId][goalKey(year,month)] = val;
  }
  function syncBudgetsFromGoals(){
    if(!state || !state.categories) return;
    if(!state.goals) state.goals = {};
    if(!state.budgets) state.budgets = {};
    state.categories.filter(c=>c.type==='expense').forEach(c=>{
      state.budgets[c.id] = effectiveGoal(c.id, currentYear, currentMonth);
    });
  }

  function renderGoals(){
    if(metasYear===null) metasYear = currentYear;
    const year = metasYear;
    const expenseCats = state.categories.filter(c=>c.type==='expense');
    const isCurrentYear = year===currentYear;
    const todayReal = new Date();
    const isPastOrCurrentMonth = (m)=> year<todayReal.getFullYear() || (year===todayReal.getFullYear() && m<=todayReal.getMonth());

    // Gasto real de cada categoria em cada mês do ano selecionado, pra
    // comparar lado a lado com a meta definida.
    const spentByCatMonth = {};
    expenseCats.forEach(c=> spentByCatMonth[c.id] = new Array(12).fill(0));
    for(let m=0; m<12; m++){
      txForMonth(year, m).filter(t=>t.type==='expense').forEach(t=>{
        if(spentByCatMonth[t.categoryId]) spentByCatMonth[t.categoryId][m] += (-t.amount);
      });
    }
    const fmtCompact = (n)=> valuesHidden ? '•••' : Math.round(n).toLocaleString('pt-BR');

    const rowsHtml = expenseCats.map(c=>{
      const cellsHtml = MONTHS.map((_,m)=>{
        const val = effectiveGoal(c.id, year, m);
        const spent = spentByCatMonth[c.id][m];
        const isActive = isCurrentYear && m===currentMonth;
        const over = val>0 && spent>val;
        const showSpent = spent>0.004 || isPastOrCurrentMonth(m);
        const spentCls = spent>0.004 ? (over?'over':'under') : 'muted';
        const spentHtml = showSpent
          ? `<div class="goal-spent ${spentCls}" title="Gasto em ${MONTHS[m]}: ${fmt(spent)}">${spent>0.004 ? fmtCompact(spent) : '—'}</div>`
          : `<div class="goal-spent muted">—</div>`;
        return `<td class="goal-cell ${isActive?'goal-cell-active':''}">
          ${spentHtml}
          <input type="text" inputmode="decimal" class="goal-input" data-cat="${c.id}" data-year="${year}" data-month="${m}" value="${val || ''}" placeholder="0,00">
        </td>`;
      }).join('');
      return `<tr><td class="bowler-row-label"><span class="bowler-row-label-inner">${categoryBadgeHtml(c.icon, c.color, '💰')}${escapeHtml(c.name)}</span></td>${cellsHtml}</tr>`;
    }).join('') || `<tr><td colspan="13" class="empty-state">Crie categorias de despesa primeiro.</td></tr>`;

    const totalGoalCellsHtml = MONTHS.map((_,m)=>{
      const total = expenseCats.reduce((s,c)=>s+effectiveGoal(c.id, year, m), 0);
      const isActive = isCurrentYear && m===currentMonth;
      return `<td class="bowler-cell bowler-total-cell ${isActive?'goal-cell-active':''}">${fmt(total)}</td>`;
    }).join('');
    const totalSpentCellsHtml = MONTHS.map((_,m)=>{
      const totalGoal = expenseCats.reduce((s,c)=>s+effectiveGoal(c.id, year, m), 0);
      const totalSpent = expenseCats.reduce((s,c)=>s+spentByCatMonth[c.id][m], 0);
      const isActive = isCurrentYear && m===currentMonth;
      const over = totalGoal>0 && totalSpent>totalGoal;
      const showSpent = totalSpent>0.004 || isPastOrCurrentMonth(m);
      const colorStyle = totalSpent>0.004 ? `color:${over?'var(--rust)':'var(--forest-deep)'};` : '';
      return `<td class="bowler-cell bowler-total-cell ${isActive?'goal-cell-active':''}" style="${colorStyle}">${showSpent ? (totalSpent>0.004?fmt(totalSpent):'—') : '—'}</td>`;
    }).join('');

    mainEl.innerHTML = `
      <div id="rumo-header">
        <div><h1>Metas</h1><div class="subtitle">Defina a meta de cada categoria mês a mês, o ano todo</div></div>
        <div class="month-switch" style="width:auto;">
          <button type="button" id="metasPrevYear">‹</button>
          <div class="label display">${year}</div>
          <button type="button" id="metasNextYear">›</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Metas de ${year}</div>
        <div class="card-sub">Clique num valor pra editar a meta daquele mês (o número pequeno em cima de cada campo é o quanto já foi gasto). Deixe em branco pra herdar a meta do mês definido anterior mais próximo.${isCurrentYear ? ' A coluna destacada é o mês atual — ela também aparece (e pode ser editada) em Orçamentos.' : ''} Arraste a tabela pros lados pra ver todos os meses.</div>
        <div class="bowler-table-scroll" style="margin-top:10px;">
          <table class="bowler-table goals-table">
            <thead><tr><th>Categoria</th>${MONTHS.map((m,i)=>`<th class="${isCurrentYear && i===currentMonth?'goal-cell-active':''}">${m.slice(0,3)}</th>`).join('')}</tr></thead>
            <tbody>
              ${rowsHtml}
              <tr class="bowler-total-row"><td>Meta total</td>${totalGoalCellsHtml}</tr>
              <tr class="bowler-total-row goals-spent-total-row"><td>Gasto total</td>${totalSpentCellsHtml}</tr>
            </tbody>
          </table>
        </div>
      </div>
    `;
    document.getElementById('metasPrevYear').onclick = ()=>{ metasYear--; renderGoals(); };
    document.getElementById('metasNextYear').onclick = ()=>{ metasYear++; renderGoals(); };
    mainEl.querySelectorAll('.bowler-table-scroll').forEach(enableDragScroll);
    mainEl.querySelectorAll('.goal-input').forEach(inp=>{
      attachMoneyMask(inp);
      inp.onchange = async (e)=>{
        const raw = e.target.value.trim();
        const catId = e.target.dataset.cat;
        const y = parseInt(e.target.dataset.year, 10);
        const m = parseInt(e.target.dataset.month, 10);
        setGoalValue(catId, y, m, raw==='' ? null : parseMoneyInput(raw));
        syncBudgetsFromGoals();
        await saveState();
        renderGoals();
      };
    });
  }

  function renderBudgets(){
    const monthTx = txForMonth(currentYear, currentMonth).filter(t=>t.type==='expense');
    const spentByCat = {};
    monthTx.forEach(t=>{ spentByCat[t.categoryId] = (spentByCat[t.categoryId]||0) + (-t.amount); });

    const expenseCats = state.categories.filter(c=>c.type==='expense');
    const rows = expenseCats.map(c=>{
      const limit = state.budgets[c.id] || 0;
      const spent = spentByCat[c.id] || 0;
      const pct = limit>0 ? Math.min(100, (spent/limit*100)) : 0;
      const over = limit>0 && spent>limit;
      const barColor = over ? 'var(--rust)' : (pct>75 ? 'var(--amber)' : 'var(--forest)');
      return `<div class="budget-item">
        <div class="budget-top">
          <div class="name">${categoryBadgeHtml(c.icon, c.color, '💰')}${escapeHtml(c.name)}</div>
          <div class="figures mono">
            <span style="color:${over?'var(--rust)':'var(--ink)'}">${fmt(spent)}</span> / 
            <input type="text" inputmode="decimal" class="budget-input" data-cat="${c.id}" value="${limit || ''}" placeholder="0,00">
          </div>
        </div>
        <div class="budget-track"><div class="budget-fill" style="width:${pct}%; background:${barColor}"></div></div>
        ${over ? `<div style="color:var(--rust); font-size:11.5px; margin-top:5px;">Estourou o orçamento em ${fmt(spent-limit)}</div>` : ''}
      </div>`;
    }).join('');

    const overspendRanking = expenseCats.map(c=>{
      const limit = state.budgets[c.id] || 0;
      const spent = spentByCat[c.id] || 0;
      const overage = spent - limit;
      const pctOver = limit>0 ? (spent/limit*100-100) : 0;
      return { c, limit, spent, overage, pctOver };
    }).filter(r=>r.limit>0 && r.overage>0.004).sort((a,b)=>b.overage-a.overage);
    const overspendTotal = overspendRanking.reduce((s,r)=>s+r.overage,0);
    const overspendRankingHtml = overspendRanking.length>0
      ? overspendRanking.map((r,i)=>`
        <div class="overspend-row">
          <div class="overspend-rank">${i+1}</div>
          <div class="overspend-name">${categoryBadgeHtml(r.c.icon, r.c.color, '💰')}${escapeHtml(r.c.name)}</div>
          <div class="overspend-figures">
            <span class="mono overspend-amount">-${fmt(r.overage)}</span>
            <span class="overspend-pct">${r.pctOver.toFixed(0)}% acima da meta</span>
          </div>
        </div>`).join('')
      : `<div class="empty-state">Nenhuma categoria passou do orçamento este mês. 🎉</div>`;

    mainEl.innerHTML = `
      <div id="rumo-header">
        <div><h1>Orçamentos</h1><div class="subtitle">Defina limites mensais por categoria</div></div>
        ${monthSwitchHtml()}
      </div>
      <div class="card" style="margin-bottom:16px;">
        <div class="card-head-row">
          <div>
            <div class="card-title">Maiores estouros do mês</div>
            <div class="card-sub">Categorias que passaram da meta, da maior pra menor diferença</div>
          </div>
          ${overspendRanking.length>0 ? `<span class="mono collapse-total neg">-${fmt(overspendTotal)}</span>` : ''}
        </div>
        ${overspendRankingHtml}
      </div>
      <div class="card">
        <div class="card-title">Limites de ${MONTHS[currentMonth]}</div>
        <div class="card-sub">Clique no valor para editar o limite mensal de cada categoria</div>
        ${rows}
      </div>
    `;
    bindMonthSwitch();
    mainEl.querySelectorAll('.budget-input').forEach(inp=>{
      attachMoneyMask(inp);
      inp.onchange = async (e)=>{
        const val = parseMoneyInput(e.target.value);
        setGoalValue(e.target.dataset.cat, currentYear, currentMonth, val);
        syncBudgetsFromGoals();
        await saveState(); renderBudgets();
      };
    });
  }

  // ---------- BILLS ----------
  function renderBills(){
    const bills = [...state.bills].sort((a,b)=> (a.paid-b.paid) || a.dueDate.localeCompare(b.dueDate));
    const today = new Date().toISOString().slice(0,10);
    const rows = bills.map(b=>{
      const c = catById(b.categoryId);
      const overdue = !b.paid && b.dueDate < today;
      const dateFmt = new Date(b.dueDate+'T00:00:00').toLocaleDateString('pt-BR', {day:'2-digit', month:'short'});
      return `<div class="bill-row ${overdue?'overdue':''}" data-id="${b.id}">
        <button class="checkbtn ${b.paid?'checked':''}" data-toggle="${b.id}" title="Marcar como pago"></button>
        <div>
          <div class="desc" style="font-weight:600; color:var(--ink);">${escapeHtml(b.desc)}</div>
          <div class="meta">${c?c.name:'Sem categoria'}</div>
        </div>
        <div class="due mono">Vence ${dateFmt}</div>
        <div class="amount mono" style="font-weight:600;">${fmt(b.amount)}</div>
        <div class="pill ${b.paid?'paid':'pending'}">${b.paid?'Pago':(overdue?'Atrasado':'Pendente')}</div>
        <div class="row-actions">
          <button class="icon-btn edit-bill" data-id="${b.id}" title="Editar">✎</button>
          <button class="icon-btn del-bill" data-id="${b.id}" title="Excluir">✕</button>
        </div>
      </div>`;
    }).join('') || `<div class="empty-state"><div class="display">Nenhuma conta cadastrada</div>Adicione suas contas fixas para não perder o vencimento.</div>`;

    mainEl.innerHTML = `
      <div id="rumo-header">
        <div><h1>Contas a pagar</h1><div class="subtitle">Suas contas recorrentes e vencimentos · clique numa conta para editar</div></div>
        <button class="btn btn-primary" id="addBillBtn">+ Nova conta</button>
      </div>
      <div class="card">${rows}</div>
    `;
    document.getElementById('addBillBtn').onclick = ()=> openBillModal();
    mainEl.querySelectorAll('[data-toggle]').forEach(btn=>{
      btn.onclick = async (e)=>{
        e.stopPropagation();
        const b = state.bills.find(x=>x.id===btn.dataset.toggle);
        b.paid = !b.paid;
        await saveState(); renderBills();
      };
    });
    mainEl.querySelectorAll('.bill-row').forEach(row=>{
      row.style.cursor = 'pointer';
      row.onclick = ()=> openBillModal(state.bills.find(b=>b.id===row.dataset.id));
    });
    mainEl.querySelectorAll('.edit-bill').forEach(btn=>{
      btn.onclick = (e)=>{ e.stopPropagation(); openBillModal(state.bills.find(b=>b.id===btn.dataset.id)); };
    });
    mainEl.querySelectorAll('.del-bill').forEach(btn=>{
      btn.onclick = async (e)=>{
        e.stopPropagation();
        state.bills = state.bills.filter(b=>b.id!==btn.dataset.id);
        await saveState(); renderBills();
      };
    });
  }

  // ---------- ACCOUNTS ----------
  function renderAccounts(){
    const cardEntries = state.accounts.map((a, idx)=>{
      const bal = computeAccountBalance(a.id);
      const caixinhas = a.caixinhas || [];
      const reserved = caixinhas.reduce((s,c)=>s+c.balance,0);
      const available = bal - reserved;
      const invoiceInfo = a.type==='Crédito' ? currentInvoiceInfo(a) : null;
      const invoiceDueLabel = invoiceInfo && invoiceInfo.dueDate ? new Date(invoiceInfo.dueDate+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) : null;
      const caixinhaRows = caixinhas.map(cx=>`
        <div class="caixinha-row">
          <div class="caixinha-info">
            <span class="swatch" style="background:${cx.color}"></span>
            <div>
              <div class="caixinha-name">${escapeHtml(cx.name)}</div>
              ${cx.goal ? `<div class="caixinha-track"><div class="caixinha-fill" style="width:${Math.min(100, cx.goal>0?(cx.balance/cx.goal*100):0)}%"></div></div>` : ''}
            </div>
          </div>
          <div class="caixinha-balance mono">${fmt(cx.balance)}${cx.goal?` <span style="color:var(--slate-mute)">/ ${fmt(cx.goal)}</span>`:''}</div>
          <div class="caixinha-actions">
            <button class="icon-btn cx-edit" data-acc="${a.id}" data-cx="${cx.id}" title="Editar">✎</button>
            <button class="icon-btn cx-move" data-acc="${a.id}" data-cx="${cx.id}" title="Mover dinheiro">⇄</button>
            <button class="icon-btn cx-del" data-acc="${a.id}" data-cx="${cx.id}" title="Excluir">✕</button>
          </div>
        </div>`).join('');

      return { archived: !!a.archived, html: `
      <div class="account-card ${a.archived?'account-archived':''}" data-edit-acc="${a.id}" style="cursor:pointer;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div style="display:flex; align-items:center; gap:10px;">
            ${bankLogoHtml(a)}
            <div>
              <div class="acc-name">${escapeHtml(a.name)} ${a.archived?'<span class="archived-badge">Arquivada</span>':''}</div>
              <div class="acc-type">${a.type}${dueInfoText(a)}</div>
            </div>
          </div>
          <div class="acc-card-actions">
            <button class="icon-btn move-acc" data-dir="up" data-id="${a.id}" title="Mover para cima" ${idx===0?'disabled':''}>▲</button>
            <button class="icon-btn move-acc" data-dir="down" data-id="${a.id}" title="Mover para baixo" ${idx===state.accounts.length-1?'disabled':''}>▼</button>
            <button class="icon-btn del-acc" data-id="${a.id}" title="Excluir">✕</button>
          </div>
        </div>
        <div class="acc-balance mono" style="color:${bal>=0?'var(--forest)':'var(--rust)'}">${fmt(bal)}</div>
        ${invoiceInfo ? `<div class="available-note">${invoiceInfo.payable?'Fatura a pagar':'Próxima fatura'}${invoiceDueLabel?' · vence '+invoiceDueLabel:''}: <span class="mono">${fmt(invoiceInfo.amount)}</span> · <a href="#" data-view-card-tx="${a.id}">ver lançamentos</a></div>` : ''}
        ${a.type==='Crédito' && hasPayableInvoice(a) ? `<button type="button" class="btn btn-ghost btn-small pay-invoice-btn-light" data-pay-invoice="${a.id}">Pagar fatura</button>` : ''}
        ${caixinhas.length>0 ? `<div class="available-note">Disponível: <span class="mono">${fmt(available)}</span> · em caixinhas: <span class="mono">${fmt(reserved)}</span></div>` : ''}
        <div class="caixinhas-wrap" data-caixinhas-wrap="${a.id}">
          <div class="caixinhas-head">
            <span>Caixinhas</span>
            <button class="add-caixinha" data-acc="${a.id}">+ nova</button>
          </div>
          ${caixinhaRows || '<div style="font-size:11.5px; color:var(--slate-mute);">Nenhuma caixinha ainda.</div>'}
        </div>
      </div>
    ` };
    });
    const activeCardsHtml = cardEntries.filter(c=>!c.archived).map(c=>c.html).join('');
    const archivedCardsHtml = cardEntries.filter(c=>c.archived).map(c=>c.html).join('');

    mainEl.innerHTML = `
      <div id="rumo-header">
        <div><h1>Contas</h1><div class="subtitle">Carteira, bancos e cartões · clique numa conta para editar</div></div>
        <button class="btn btn-primary" id="addAccBtn">+ Nova conta</button>
      </div>
      <div class="accounts-grid roomy">${activeCardsHtml || '<div class="empty-state">Nenhuma conta ativa. Clique em "+ Nova conta".</div>'}</div>
      ${archivedCardsHtml ? `
        <div class="archived-section">
          <div class="archived-section-title">Contas arquivadas</div>
          <div class="accounts-grid roomy">${archivedCardsHtml}</div>
        </div>` : ''}
      <div class="danger-zone-link">
        <a href="#" id="clearTestDataLink">🗑️ Limpar dados de teste</a>
        <span class="danger-zone-hint">apaga transações, contas a pagar e zera saldos — mantém contas, cartões, grupos e categorias</span>
      </div>
    `;
    document.getElementById('addAccBtn').onclick = ()=> openAccountModal();
    document.getElementById('clearTestDataLink').onclick = (e)=>{ e.preventDefault(); openClearTestDataModal(); };
    mainEl.querySelectorAll('[data-edit-acc]').forEach(card=>{
      card.onclick = ()=> openAccountModal(state.accounts.find(a=>a.id===card.dataset.editAcc));
    });
    mainEl.querySelectorAll('[data-pay-invoice]').forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        openPayInvoiceModal(state.accounts.find(a=>a.id===btn.dataset.payInvoice));
      };
    });
    mainEl.querySelectorAll('[data-view-card-tx]').forEach(link=>{
      link.onclick = (e)=>{
        e.preventDefault(); e.stopPropagation();
        openCardTransactionsModal(state.accounts.find(a=>a.id===link.dataset.viewCardTx));
      };
    });
    mainEl.querySelectorAll('.move-acc').forEach(btn=>{
      btn.onclick = async (e)=>{
        e.stopPropagation();
        if(btn.disabled) return;
        const id = btn.dataset.id;
        const idx = state.accounts.findIndex(a=>a.id===id);
        const swapWith = btn.dataset.dir==='up' ? idx-1 : idx+1;
        if(swapWith<0 || swapWith>=state.accounts.length) return;
        [state.accounts[idx], state.accounts[swapWith]] = [state.accounts[swapWith], state.accounts[idx]];
        await saveState(); renderAccounts();
      };
    });
    mainEl.querySelectorAll('.del-acc').forEach(btn=>{
      btn.onclick = async (e)=>{
        e.stopPropagation();
        const id = btn.dataset.id;
        if(state.transactions.some(t=>t.accountId===id || t.fromAccountId===id || t.toAccountId===id)){
          alert('Não é possível excluir: existem transações vinculadas a esta conta.');
          return;
        }
        state.accounts = state.accounts.filter(a=>a.id!==id);
        await saveState(); renderAccounts();
      };
    });
    mainEl.querySelectorAll('[data-caixinhas-wrap]').forEach(wrap=>{
      wrap.addEventListener('click', (e)=> e.stopPropagation());
    });
    mainEl.querySelectorAll('.add-caixinha').forEach(btn=>{
      btn.onclick = (e)=>{ e.stopPropagation(); openCaixinhaModal(state.accounts.find(a=>a.id===btn.dataset.acc)); };
    });
    mainEl.querySelectorAll('.cx-edit').forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        const acc = state.accounts.find(a=>a.id===btn.dataset.acc);
        const cx = (acc.caixinhas||[]).find(c=>c.id===btn.dataset.cx);
        openCaixinhaModal(acc, cx);
      };
    });
    mainEl.querySelectorAll('.cx-move').forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        const acc = state.accounts.find(a=>a.id===btn.dataset.acc);
        const cx = (acc.caixinhas||[]).find(c=>c.id===btn.dataset.cx);
        openCaixinhaMoveModal(acc, cx);
      };
    });
    mainEl.querySelectorAll('.cx-del').forEach(btn=>{
      btn.onclick = async (e)=>{
        e.stopPropagation();
        const acc = state.accounts.find(a=>a.id===btn.dataset.acc);
        const cx = (acc.caixinhas||[]).find(c=>c.id===btn.dataset.cx);
        if(cx.balance>0){
          alert('Resgate o dinheiro da caixinha antes de excluí-la.');
          return;
        }
        acc.caixinhas = (acc.caixinhas||[]).filter(c=>c.id!==cx.id);
        await saveState(); renderAccounts();
      };
    });
  }

  // ---------- CATEGORIES ----------
  function renderCategories(){
    const catCard = c => {
      const subs = c.subcategories || [];
      const chips = subs.map(s=>`<span class="subchip">${escapeHtml(s.name)}<button class="subchip-del" data-parent="${c.id}" data-sub="${s.id}" title="Remover">×</button></span>`).join('');
      return `
      <div class="cat-card-wrap" style="background: var(--paper-2); border:1px solid var(--line); border-radius: 12px; padding: 14px 16px;">
        <div class="cat-card" style="border:none; padding:0; background:transparent;">
          <div class="cat-left cat-left-clickable" data-edit-cat="${c.id}" style="cursor:pointer;">${categoryBadgeHtml(c.icon, c.color, '💰')}${escapeHtml(c.name)}</div>
          <div style="display:flex; gap:4px;">
            <button class="icon-btn edit-cat" data-id="${c.id}" title="Editar">✎</button>
            <button class="icon-btn del-cat" data-id="${c.id}" title="Excluir">✕</button>
          </div>
        </div>
        <div class="subcat-row">
          ${chips}
          <button class="subchip-add" data-parent="${c.id}">+ subcategoria</button>
        </div>
      </div>`;
    };

    const groupBlock = (type) => {
      const groups = (state.groups||[]).filter(g=>g.type===type);
      return groups.map(g=>{
        const cats = state.categories.filter(c=>c.groupId===g.id);
        return `
        <div class="group-block">
          <div class="group-head">
            <div class="group-title group-title-clickable" data-edit-group="${g.id}" style="cursor:pointer;">${categoryBadgeHtml(g.icon, g.color, '📁')}${escapeHtml(g.name)}</div>
            <div style="display:flex; gap:6px;">
              <button class="btn btn-ghost btn-small add-cat-in-group" data-group="${g.id}">+ categoria</button>
              <button class="icon-btn del-group" data-id="${g.id}" title="Excluir grupo">✕</button>
            </div>
          </div>
          <div class="cats-grid" style="align-items:start;">
            ${cats.map(catCard).join('') || '<div style="font-size:12px; color:var(--slate-mute);">Nenhuma categoria neste grupo ainda.</div>'}
          </div>
        </div>`;
      }).join('') || `<div class="empty-state">Nenhum grupo ainda. Clique em "+ Novo grupo".</div>`;
    };

    mainEl.innerHTML = `
      <div id="rumo-header">
        <div><h1>Categorias</h1><div class="subtitle">Grupo → categoria → subcategoria</div></div>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-ghost" id="addGroupBtn">+ Novo grupo</button>
          <button class="btn btn-primary" id="addCatBtn">+ Nova categoria</button>
        </div>
      </div>
      <div class="card" style="margin-bottom:16px;">
        <div class="card-title">Despesas</div>
        ${groupBlock('expense')}
      </div>
      <div class="card">
        <div class="card-title">Receitas</div>
        ${groupBlock('income')}
      </div>
    `;
    document.getElementById('addCatBtn').onclick = ()=> openCategoryModal();
    document.getElementById('addGroupBtn').onclick = ()=> openGroupModal();
    mainEl.querySelectorAll('[data-edit-group]').forEach(el=>{
      el.onclick = ()=> openGroupModal(state.groups.find(g=>g.id===el.dataset.editGroup));
    });
    mainEl.querySelectorAll('.add-cat-in-group').forEach(btn=>{
      btn.onclick = ()=> openCategoryModal(null, btn.dataset.group);
    });
    mainEl.querySelectorAll('.del-group').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.dataset.id;
        if(state.categories.some(c=>c.groupId===id)){
          alert('Não é possível excluir: existem categorias dentro deste grupo.');
          return;
        }
        state.groups = state.groups.filter(g=>g.id!==id);
        await saveState(); renderCategories();
      };
    });
    mainEl.querySelectorAll('.del-cat').forEach(btn=>{
      btn.onclick = async (e)=>{
        e.stopPropagation();
        const id = btn.dataset.id;
        if(state.transactions.some(t=>t.categoryId===id) || state.bills.some(b=>b.categoryId===id)){
          alert('Não é possível excluir: existem lançamentos vinculados a esta categoria.');
          return;
        }
        state.categories = state.categories.filter(c=>c.id!==id);
        delete state.budgets[id];
        if(state.goals) delete state.goals[id];
        await saveState(); renderCategories();
      };
    });
    mainEl.querySelectorAll('.edit-cat, [data-edit-cat]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        const id = el.dataset.id || el.dataset.editCat;
        openCategoryModal(state.categories.find(c=>c.id===id));
      };
    });
    mainEl.querySelectorAll('.subchip-add').forEach(btn=>{
      btn.onclick = async ()=>{
        const name = (prompt('Nome da subcategoria:')||'').trim();
        if(!name) return;
        const cat = state.categories.find(c=>c.id===btn.dataset.parent);
        cat.subcategories = cat.subcategories || [];
        cat.subcategories.push({id: uid(), name: toStandardCase(name)});
        await saveState(); renderCategories();
      };
    });
    mainEl.querySelectorAll('.subchip-del').forEach(btn=>{
      btn.onclick = async ()=>{
        const parentId = btn.dataset.parent, subId = btn.dataset.sub;
        if(state.transactions.some(t=>t.subcategoryId===subId)){
          alert('Não é possível excluir: existem transações vinculadas a esta subcategoria.');
          return;
        }
        const cat = state.categories.find(c=>c.id===parentId);
        cat.subcategories = (cat.subcategories||[]).filter(s=>s.id!==subId);
        await saveState(); renderCategories();
      };
    });
  }

  // ---------- MODALS ----------
  function closeModal(){
    const ov = document.getElementById('modalOverlay');
    if(ov) ov.remove();
    if(calcKeypadState) closeCalcKeypad();
  }

  function openSupabaseModal(){
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'modalOverlay';
    const s = state.settings;
    overlay.innerHTML = `
      <div class="modal">
        <h2>Conectar ao Supabase</h2>
        <div class="card-sub" style="margin-top:-10px;">Cole os dados do seu projeto (Project Settings → API no Supabase).</div>
        <div class="field"><label>URL do projeto</label><input type="text" id="sb-url" value="${s.supabaseUrl?escapeHtml(s.supabaseUrl):''}" placeholder="https://xxxxx.supabase.co"></div>
        <div class="field"><label>Chave anon (public)</label><input type="text" id="sb-key" value="${s.supabaseKey?escapeHtml(s.supabaseKey):''}" placeholder="eyJhbGciOi..."></div>
        <div class="fab-hint">Essa chave fica salva só no seu app. Qualquer pessoa que tenha o arquivo e essa chave consegue ler/gravar esses dados — não compartilhe o arquivo com estranhos.</div>
        <div class="modal-actions">
          ${(s.supabaseUrl||s.supabaseKey)?'<button class="btn btn-danger" id="sb-disconnect">Desconectar</button>':''}
          <button class="btn btn-ghost" id="sb-cancel">Cancelar</button>
          <button class="btn btn-primary" id="sb-save">Salvar</button>
        </div>
      </div>`;
    root.appendChild(overlay);
    overlay.querySelector('#sb-cancel').onclick = closeModal;
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
    if(s.supabaseUrl||s.supabaseKey){
      overlay.querySelector('#sb-disconnect').onclick = async ()=>{
        state.settings.supabaseUrl = undefined;
        state.settings.supabaseKey = undefined;
        await saveState();
        await clearAuthSession();
        updateAccountFoot();
        closeModal();
        alert('Desconectado do Supabase.');
        if(root.classList.contains('login-mode')) renderLoginScreen();
      };
    }
    overlay.querySelector('#sb-save').onclick = async ()=>{
      const url = document.getElementById('sb-url').value.trim();
      const key = document.getElementById('sb-key').value.trim();
      if(!url || !key){ alert('Preencha a URL e a chave.'); return; }
      state.settings.supabaseUrl = sbOrigin(url);
      state.settings.supabaseKey = key;
      await saveState();
      closeModal();
      if(!authSession){
        // Sem sessão válida: mostra a tela de login agora mesmo, sem precisar recarregar a página.
        renderLoginScreen();
      } else {
        alert('Conectado! Os próximos lançamentos vão sincronizar automaticamente com o Supabase.');
      }
    };
  }

  // Transforma um lançamento avulso (ex: vindo de uma importação) numa
  // recorrência daqui pra frente — útil quando o histórico importado parou
  // no mês atual mas a despesa (assinatura, parcela de obra etc) continua.
  function openContinueRecurrenceModal(existing){
    const m = /\s*\((\d+)\s*\/\s*(\d+)\)\s*$/.exec(existing.desc||'');
    const baseDesc = m ? existing.desc.slice(0, m.index).trim() : (existing.desc||'').trim();
    const detectedIndex = m ? parseInt(m[1],10) : null;
    const detectedTotal = m ? parseInt(m[2],10) : null;

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'modalOverlay';
    overlay.innerHTML = `
      <div class="modal">
        <h2>Continuar recorrência</h2>
        <div class="card-sub" style="margin-top:-10px;">"${escapeHtml(baseDesc)}" passa a se repetir automaticamente a partir do mês seguinte a ${new Date(existing.date+'T00:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}.</div>
        <div class="type-toggle" style="margin-top:16px;">
          <button type="button" data-mode="fixed" class="${!m?'active income':''}">Fixa (todo mês)</button>
          <button type="button" data-mode="installment" class="${m?'active income':''}">Parcelada (tem fim)</button>
        </div>
        <div id="cr-installment-fields" style="display:${m?'block':'none'}; margin-top:16px;">
          <div class="field-row">
            <div class="field"><label>Essa é a parcela nº</label><input type="text" inputmode="numeric" id="cr-index" value="${detectedIndex||1}"></div>
            <div class="field"><label>De quantas parcelas</label><input type="text" inputmode="numeric" id="cr-total" value="${detectedTotal||2}"></div>
          </div>
          <div class="fab-hint">Vamos criar as parcelas seguintes, do mesmo valor, uma por mês, até completar o total.</div>
        </div>
        <div id="cr-fixed-fields" style="display:${m?'none':'block'}; margin-top:16px;">
          <div class="fab-hint" style="margin-top:0;">Vamos repetir o mesmo valor todo mês, sem data pra acabar (dá pra parar quando quiser, editando e escolhendo "excluir esta e as futuras").</div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="cr-cancel">Cancelar</button>
          <button class="btn btn-primary" id="cr-confirm">Confirmar</button>
        </div>
      </div>`;
    root.appendChild(overlay);
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
    overlay.querySelector('#cr-cancel').onclick = closeModal;
    let mode = m ? 'installment' : 'fixed';
    overlay.querySelectorAll('.type-toggle button').forEach(btn=>{
      btn.onclick = ()=>{
        mode = btn.dataset.mode;
        overlay.querySelectorAll('.type-toggle button').forEach(b=>b.classList.remove('active','income'));
        btn.classList.add('active','income');
        document.getElementById('cr-installment-fields').style.display = mode==='installment' ? 'block' : 'none';
        document.getElementById('cr-fixed-fields').style.display = mode==='fixed' ? 'block' : 'none';
      };
    });
    overlay.querySelector('#cr-confirm').onclick = async ()=>{
      const groupId = uid();
      if(mode==='installment'){
        const idx = clampInt(document.getElementById('cr-index').value, 1, 999);
        const total = clampInt(document.getElementById('cr-total').value, idx, 999);
        existing.desc = `${baseDesc} (${idx}/${total})`;
        existing.recurrenceType = 'installment';
        existing.recurrenceGroupId = groupId;
        existing.installmentIndex = idx;
        existing.installmentTotal = total;
        for(let i=idx+1; i<=total; i++){
          state.transactions.push({
            id: uid(), desc: `${baseDesc} (${i}/${total})`, amount: existing.amount,
            date: addMonthsToDateStr(existing.date, i-idx), type: existing.type,
            categoryId: existing.categoryId, subcategoryId: existing.subcategoryId, accountId: existing.accountId,
            paid: existing.type==='expense' || existing.type==='income' ? false : undefined,
            recurrenceType: 'installment', recurrenceGroupId: groupId, installmentIndex: i, installmentTotal: total
          });
        }
      } else {
        existing.recurrenceType = 'fixed';
        existing.recurrenceGroupId = groupId;
        for(let i=1; i<=24; i++){
          state.transactions.push({
            id: uid(), desc: baseDesc, amount: existing.amount,
            date: addMonthsToDateStr(existing.date, i), type: existing.type,
            categoryId: existing.categoryId, subcategoryId: existing.subcategoryId, accountId: existing.accountId,
            paid: existing.type==='expense' || existing.type==='income' ? false : undefined,
            recurrenceType: 'fixed', recurrenceGroupId: groupId
          });
        }
      }
      await saveState();
      closeModal();
      render();
    };
  }

  // Edita a recorrência de um lançamento que já é parte de uma série —
  // regenera "esta e as futuras" com os novos parâmetros, sem mexer no
  // histórico já passado.
  function openEditRecurrenceModal(existing){
    const baseDesc = (existing.recurrenceType==='installment')
      ? (existing.desc||'').replace(/\s*\((\d+)\s*\/\s*(\d+)\)\s*$/, '').trim()
      : (existing.desc||'').trim();
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'modalOverlay';
    overlay.innerHTML = `
      <div class="modal">
        <h2>Editar recorrência</h2>
        <div class="card-sub" style="margin-top:-10px;">Isso muda "${escapeHtml(baseDesc)}" a partir desta data em diante — o que já passou continua igual.</div>
        <div class="type-toggle" style="margin-top:16px;">
          <button type="button" data-mode="fixed" class="${existing.recurrenceType==='fixed'?'active income':''}">Fixa (todo mês)</button>
          <button type="button" data-mode="installment" class="${existing.recurrenceType==='installment'?'active income':''}">Parcelada (tem fim)</button>
        </div>
        <div class="field" style="margin-top:16px;">
          <label>Valor a partir de agora (R$)</label>
          <input type="text" inputmode="decimal" id="er-amount" value="${Math.abs(existing.amount).toFixed(2).replace('.',',')}">
        </div>
        <div id="er-installment-fields" style="display:${existing.recurrenceType==='installment'?'block':'none'}">
          <div class="field-row">
            <div class="field"><label>Essa é a parcela nº</label><input type="text" inputmode="numeric" id="er-index" value="${existing.installmentIndex||1}" disabled></div>
            <div class="field"><label>De quantas parcelas</label><input type="text" inputmode="numeric" id="er-total" value="${existing.installmentTotal||2}"></div>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="er-cancel">Cancelar</button>
          <button class="btn btn-primary" id="er-confirm">Salvar</button>
        </div>
      </div>`;
    root.appendChild(overlay);
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
    overlay.querySelector('#er-cancel').onclick = closeModal;
    let mode = existing.recurrenceType==='installment' ? 'installment' : 'fixed';
    overlay.querySelectorAll('.type-toggle button').forEach(btn=>{
      btn.onclick = ()=>{
        mode = btn.dataset.mode;
        overlay.querySelectorAll('.type-toggle button').forEach(b=>b.classList.remove('active','income'));
        btn.classList.add('active','income');
        document.getElementById('er-installment-fields').style.display = mode==='installment' ? 'block' : 'none';
      };
    });
    overlay.querySelector('#er-confirm').onclick = async ()=>{
      const newAmount = parseMoneyInput(document.getElementById('er-amount').value) || Math.abs(existing.amount);
      const existingAccForSign = accById(existing.accountId);
      const wasCardCredit = existing.type==='expense' && existingAccForSign && existingAccForSign.type==='Crédito' && existing.amount>0;
      const signedAmount = (existing.type==='income' || wasCardCredit) ? Math.abs(newAmount) : -Math.abs(newAmount);
      const groupId = existing.recurrenceGroupId;
      const fromDate = existing.date;
      // Tira as futuras antigas da série (o que já passou fica intacto).
      state.transactions = state.transactions.filter(t=> !(t.recurrenceGroupId===groupId && t.date>fromDate));

      if(mode==='installment'){
        const idx = existing.installmentIndex || 1;
        const total = clampInt(document.getElementById('er-total').value, idx, 999);
        existing.desc = `${baseDesc} (${idx}/${total})`;
        existing.amount = signedAmount;
        existing.recurrenceType = 'installment';
        existing.installmentIndex = idx;
        existing.installmentTotal = total;
        for(let i=idx+1; i<=total; i++){
          state.transactions.push({
            id: uid(), desc: `${baseDesc} (${i}/${total})`, amount: signedAmount,
            date: addMonthsToDateStr(fromDate, i-idx), type: existing.type,
            categoryId: existing.categoryId, subcategoryId: existing.subcategoryId, accountId: existing.accountId,
            paid: false, recurrenceType: 'installment', recurrenceGroupId: groupId, installmentIndex: i, installmentTotal: total
          });
        }
      } else {
        existing.desc = baseDesc;
        existing.amount = signedAmount;
        existing.recurrenceType = 'fixed';
        existing.installmentIndex = undefined;
        existing.installmentTotal = undefined;
        for(let i=1; i<=24; i++){
          state.transactions.push({
            id: uid(), desc: baseDesc, amount: signedAmount,
            date: addMonthsToDateStr(fromDate, i), type: existing.type,
            categoryId: existing.categoryId, subcategoryId: existing.subcategoryId, accountId: existing.accountId,
            paid: false, recurrenceType: 'fixed', recurrenceGroupId: groupId
          });
        }
      }
      await saveState();
      closeModal();
      render();
    };
  }

  function openTxModal(existing){
    const isEdit = !!existing;
    const type = existing ? existing.type : 'expense';
    // Se a transação editada é uma despesa lançada numa conta do tipo Crédito,
    // trata como "Cartão de crédito" na hora de abrir o formulário.
    const existingAcc = existing ? accById(existing.accountId) : null;
    const isExistingCreditCard = !!(existing && existing.type==='expense' && existingAcc && existingAcc.type==='Crédito');
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'modalOverlay';
    const catOpts = (t) => [...state.categories].filter(c=>c.type===t).sort((a,b)=>{
      const ga = groupById(a.groupId), gb = groupById(b.groupId);
      const gna = ga ? ga.name : 'zzz', gnb = gb ? gb.name : 'zzz';
      return gna.localeCompare(gnb, 'pt-BR') || a.name.localeCompare(b.name, 'pt-BR');
    }).map(c=>`<option value="${c.id}" ${existing&&existing.categoryId===c.id?'selected':''}>${c.icon?c.icon+' ':''}${c.name}</option>`).join('');
    const accOpts = (selectedId, mode) => state.accounts.filter(a=>{
      if(a.archived && a.id!==selectedId) return false;
      if(mode==='creditOnly') return a.type==='Crédito';
      if(mode==='excludeCredit') return a.type!=='Crédito';
      return true;
    }).map(a=>`<option value="${a.id}" ${selectedId===a.id?'selected':''}>${a.name}${a.archived?' (arquivada)':''}</option>`).join('');
    // Lista global de subcategorias (de todas as categorias do tipo), pra poder
    // escolher a subcategoria primeiro e puxar categoria/grupo automaticamente.
    const subOptsGlobal = (t, selectedId) => {
      const opts = [];
      [...state.categories].filter(c=>c.type===t).sort((a,b)=>{
        const ga = groupById(a.groupId), gb = groupById(b.groupId);
        const gna = ga ? ga.name : 'zzz', gnb = gb ? gb.name : 'zzz';
        return gna.localeCompare(gnb, 'pt-BR') || a.name.localeCompare(b.name, 'pt-BR');
      }).forEach(c=>{
        (c.subcategories||[]).forEach(s=>{
          opts.push(`<option value="${s.id}" ${selectedId===s.id?'selected':''}>${escapeHtml(s.name)} — ${escapeHtml(c.name)}</option>`);
        });
      });
      return '<option value="">Nenhuma (escolher categoria abaixo)</option>' + opts.join('');
    };

    const seriesNote = isEdit && existing.recurrenceGroupId
      ? `<div class="fab-hint" style="margin-top:-6px;">Parte de um lançamento recorrente${existing.installmentTotal?` (${existing.installmentIndex}/${existing.installmentTotal})`:''}.</div>`
      : '';

    const recurrenceBlock = !isEdit ? `
      <div class="field">
        <label>Recorrência</label>
        <select id="f-recurrence">
          <option value="none">Única</option>
          <option value="installment">Parcelada</option>
          <option value="fixed">Fixa (todo mês)</option>
          <option value="period">Por tempo determinado</option>
        </select>
      </div>
      <div id="f-recurrence-extra"></div>
    ` : '';

    overlay.innerHTML = `
      <div class="modal">
        <h2>${isEdit?'Editar transação':'Nova transação'}</h2>
        <div class="type-toggle" id="f-type-toggle">
          <button type="button" data-type="expense" class="${isEdit && type==='expense' && !isExistingCreditCard?'active expense':''}">Despesa</button>
          <button type="button" data-type="income" class="${isEdit && type==='income'?'active income':''}">Receita</button>
          <button type="button" data-type="transfer" class="${isEdit && type==='transfer'?'active transfer':''}">Transferência</button>
          <button type="button" data-type="creditcard" class="${!isEdit || isExistingCreditCard?'active creditcard':''}">Cartão de crédito</button>
        </div>
        ${!isEdit ? `<div id="f-quickpicks" class="quickpicks"></div>` : ''}
        <div class="field" style="margin-top:16px;">
          <label>Descrição</label>
          <input type="text" id="f-desc" value="${existing?escapeHtml(existing.desc||''):''}" placeholder="${type==='transfer'?'Ex: Pagamento da fatura':'Ex: Supermercado'}" autocomplete="off" list="f-desc-suggestions" autofocus>
          <datalist id="f-desc-suggestions">${recentDescriptions().map(d=>`<option value="${escapeHtml(d)}">`).join('')}</datalist>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Valor (R$)${!isEdit?' <span id="f-amount-hint" style="text-transform:none; font-weight:400;"></span>':''}</label>
            <input type="text" inputmode="decimal" id="f-amount" ${isMobileViewport()?'readonly':''} value="${existing?(isExistingCreditCard?(-existing.amount):Math.abs(existing.amount)).toFixed(2).replace('.',','):''}" placeholder="0,00">
          </div>
          <div class="field">
            <label id="f-date-label">Data</label>
            <div id="f-date-field-inner">
              <div style="display:flex; gap:6px;">
                <input type="date" id="f-date" style="flex:1;" value="${existing?existing.date:new Date(currentYear,currentMonth,Math.min(new Date().getDate(),28)).toISOString().slice(0,10)}">
                <button type="button" id="f-date-today" class="btn btn-ghost btn-small" style="flex-shrink:0;">Hoje</button>
              </div>
            </div>
          </div>
        </div>
        <div class="fab-hint" id="f-amount-cc-hint" style="display:none; margin-top:-10px; margin-bottom:12px;"></div>
        <div id="f-normal-fields" style="display:${type==='transfer'?'none':'block'}">
          <div class="field">
            <label>Grupo</label>
            <div id="f-group-display" class="group-display"></div>
          </div>
          <div class="field">
            <label>Categoria</label>
            <select id="f-cat">${catOpts(type==='transfer'?'expense':type)}</select>
          </div>
          <div class="field">
            <label>Subcategoria</label>
            <select id="f-subcat">${subOptsGlobal(type==='transfer'?'expense':type, existing?existing.subcategoryId:null)}</select>
          </div>
          <div class="field">
            <label id="f-acc-label">Conta</label>
            <select id="f-acc">${accOpts(existing?existing.accountId:null, (!isEdit || isExistingCreditCard)?'creditOnly':'excludeCredit')}</select>

    root.appendChild(overlay);
    const descInput = document.getElementById('f-desc');

    let selType = (isExistingCreditCard || !isEdit) ? 'creditcard' : type;

    function computeDefaultPaid(dateStr){

    // Atalhos rápidos: as últimas combinações usadas (descrição + categoria +
    // subcategoria + conta) para o tipo atual, prontas pra preencher com 1 toque.
    function renderQuickPicks(){
      const wrap = document.getElementById('f-quickpicks');
      if(!wrap) return;
      if(selType==='transfer'){ wrap.innerHTML=''; return; }
      const wantAccType = selType==='creditcard' ? 'Crédito' : null;
      const wantTxType = selType==='income' ? 'income' : 'expense';
      const seen = new Set();
      const picks = [];
      [...state.transactions].sort((a,b)=> b.date.localeCompare(a.date)).forEach(t=>{
        if(picks.length>=6 || t.type!==wantTxType || !t.categoryId) return;
        const acc = accById(t.accountId);
        if(wantAccType && (!acc || acc.type!==wantAccType)) return;
        const key = t.categoryId+'|'+(t.subcategoryId||'')+'|'+t.desc;
        if(seen.has(key)) return;
        seen.add(key);
        picks.push(t);
      });
      if(picks.length===0){ wrap.innerHTML=''; return; }
      wrap.innerHTML = picks.map((t,i)=>{
        const c = catById(t.categoryId);
        return `<button type="button" class="quickpick-chip" data-idx="${i}">${c&&c.icon?c.icon+' ':''}${escapeHtml(t.desc)}</button>`;
      }).join('');
      wrap.querySelectorAll('.quickpick-chip').forEach(btn=>{
        btn.onclick = ()=>{
          const t = picks[Number(btn.dataset.idx)];
          document.getElementById('f-desc').value = t.desc;
          document.getElementById('f-cat').value = t.categoryId;
          document.getElementById('f-subcat').value = t.subcategoryId || '';

          updateGroupDisplay();
          document.getElementById('f-amount').focus();
        };
      });
